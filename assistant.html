<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0f1e">
<title>دستیار دومیتو</title>

<style>
:root{
 --bg:#0a0f1e;
 --panel:#121a2e;
 --panel2:#19233c;
 --bar:#0e1527cc;
 --codebg:#070c1a;
 --line:#ffffff14;
 --text:#eef2ff;
 --muted:#8e9bb8;
 --accent:#5b8cff;
 --accent2:#8b5cf6;
 --danger:#ff7b8a;
 --ok:#3ddc97;
 --glow1:#1d2f6366;
 --glow2:#4c1d9544;
 --fs:14.5px;
}
:root[data-theme="light"]{
 --bg:#f3f5fb;
 --panel:#ffffff;
 --panel2:#e9edf8;
 --bar:#ffffffd9;
 --codebg:#f0f3fb;
 --line:#00000018;
 --text:#141a2e;
 --muted:#66728e;
 --danger:#d93a50;
 --glow1:#9db8ff55;
 --glow2:#c4b0ff44;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
 margin:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);
 color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;
 background:
 radial-gradient(900px 500px at 100% -10%,var(--glow1),transparent 60%),
 radial-gradient(700px 400px at -10% 110%,var(--glow2),transparent 60%),
 var(--bg);
}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input,select,textarea{font-family:inherit}

/* ورود */
#accessGate{
 position:fixed;inset:0;z-index:99999;
 display:flex;align-items:center;justify-content:center;
 padding:22px;background:var(--bg);
}
#accessGate[hidden]{display:none}
.gate-card{
 width:100%;max-width:380px;padding:28px 22px;
 border-radius:24px;text-align:center;
 background:var(--panel);border:1px solid var(--line);
 box-shadow:0 20px 70px #0006;
}
.gate-logo{
 width:70px;height:70px;margin:0 auto 15px;
 border-radius:22px;display:grid;place-items:center;font-size:32px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.gate-card h2{margin:0 0 8px;font-size:22px}
.gate-card p{color:var(--muted);font-size:13px;line-height:2;margin:0 0 18px}
#goDomitoLogin{
 display:flex;align-items:center;justify-content:center;
 min-height:48px;margin-top:14px;padding:10px 14px;
 color:#fff;text-decoration:none;font-weight:bold;
 border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));
}

/* هدر */
header,#personas,footer{flex:none}
header{
 display:flex;align-items:center;justify-content:space-between;
 padding:10px 12px;background:var(--bar);
 backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
 width:38px;height:38px;border-radius:12px;flex:none;
 display:grid;place-items:center;font-size:19px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 box-shadow:0 6px 20px #5b8cff44;
}
.titles{min-width:0}
h1{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sub{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px #3ddc97aa}
.dot.err{background:var(--danger);box-shadow:none}
.dot.busy{background:#ffc857;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.icon{
 width:38px;height:38px;border-radius:50%;
 background:transparent;color:var(--muted);
 font-size:18px;display:grid;place-items:center;flex:none;
}
.icon:active{background:var(--line);color:var(--text)}
a.icon{text-decoration:none}
.hdr-actions{display:flex;gap:2px}

/* انتخاب شخصیت */
#personas{
 display:flex;gap:8px;overflow-x:auto;padding:8px 12px;
 border-bottom:1px solid var(--line);background:var(--bar);
 scrollbar-width:none;
}
#personas::-webkit-scrollbar{display:none}
#personas button{
 flex:none;padding:6px 13px;border-radius:999px;font-size:12.5px;
 background:var(--panel2);border:1px solid var(--line);color:var(--muted);
}
#personas button.on{
 color:#fff;border-color:transparent;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
}

/* چت */
#chat{
 flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 12px;
 display:flex;flex-direction:column;gap:12px;
 width:100%;max-width:820px;margin:0 auto;
 position:relative;
}
.welcome{margin:auto;text-align:center;max-width:360px;padding:20px}
.welcome .big{
 width:72px;height:72px;margin:0 auto 14px;
 border-radius:24px;display:grid;place-items:center;font-size:34px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.welcome h2{margin:0 0 6px;font-size:21px}
.welcome p{color:var(--muted);font-size:13px;line-height:2;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{
 background:var(--panel2);border:1px solid var(--line);
 border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--text);
}
@media (max-height:760px){
 .welcome{padding:6px}
 .welcome .big{width:52px;height:52px;font-size:26px;margin-bottom:8px;border-radius:18px}
 .welcome h2{font-size:18px}
 .welcome p{font-size:12px;line-height:1.7;margin-bottom:8px}
 .chips button{padding:6px 11px;font-size:12px}
 #quotaInfo{font-size:10.5px;padding-top:4px}
}
@media (max-height:560px){
 .welcome p,.welcome .big{display:none}
}
.row{display:flex;flex-direction:column;max-width:90%}
.row.user{align-self:flex-start;align-items:flex-start}
.row.ai{align-self:flex-end;align-items:flex-end}
.msg{
 padding:11px 15px;border-radius:18px;
 line-height:1.95;font-size:var(--fs);overflow-wrap:anywhere;
}
.user .msg{
 border-bottom-right-radius:6px;white-space:pre-wrap;color:#fff;
 background:linear-gradient(135deg,#2f6bf0,#6a4fe0);
}
.ai .msg{
 border-bottom-left-radius:6px;
 background:var(--panel);border:1px solid var(--line);
}
.ai .msg.error{color:var(--danger);white-space:pre-wrap}
.msg h3,.msg h4,.msg h5{margin:8px 0 2px;line-height:1.6}
.msg h3{font-size:1.15em}.msg h4{font-size:1.07em}.msg h5{font-size:1em}
.msg ul,.msg ol{margin:4px 0;padding-inline-start:22px}
.msg li{margin:1px 0}
.msg blockquote{
 margin:6px 0;padding:2px 10px;color:var(--muted);
 border-inline-start:3px solid var(--accent);
}
.msg a{color:var(--accent);word-break:break-all}
.msg p{margin:4px 0}
.thumb{
 display:block;max-width:100%;width:220px;max-height:220px;
 object-fit:cover;border-radius:12px;margin-bottom:8px;
}
.filechip{
 display:inline-flex;background:#ffffff26;border-radius:10px;
 padding:5px 10px;font-size:12px;margin-bottom:8px;direction:ltr;
}
code.inl{
 background:var(--line);border-radius:6px;padding:1px 6px;
 font:12.5px monospace;direction:ltr;unicode-bidi:embed;
}
.code{
 background:var(--codebg);border:1px solid var(--line);
 border-radius:12px;margin:8px 0;overflow:hidden;
}
.codebar{
 display:flex;justify-content:space-between;align-items:center;
 direction:ltr;padding:7px 8px;background:var(--line);
 font-size:11px;color:var(--muted);
}
.copy{background:var(--line);border-radius:8px;padding:4px 10px;color:var(--text)}
.code pre{
 margin:0;padding:12px;overflow-x:auto;direction:ltr;text-align:left;
 font:12.5px/1.65 monospace;color:var(--text);
}
.actions{display:flex;gap:2px;margin-top:3px;opacity:.85}
.actions button{
 background:transparent;color:var(--muted);font-size:12px;
 padding:3px 8px;border-radius:8px;
}
.actions button:active{background:var(--line);color:var(--text)}
.typing{display:inline-flex;gap:5px;padding:6px}
.typing i{
 width:7px;height:7px;border-radius:50%;
 background:var(--muted);animation:bounce 1.2s infinite;
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{
 0%,60%,100%{transform:translateY(0);opacity:.5}
 30%{transform:translateY(-5px);opacity:1}
}
#toBottom{
 position:fixed;left:50%;transform:translateX(-50%);bottom:130px;
 width:38px;height:38px;border-radius:50%;z-index:20;
 background:var(--panel);border:1px solid var(--line);
 box-shadow:0 6px 20px #0005;display:none;place-items:center;font-size:17px;
}
#toBottom.show{display:grid}

/* پایین */
footer{
 padding:8px 12px calc(14px + env(safe-area-inset-bottom) + var(--bo,0px));
 background:var(--bar);backdrop-filter:blur(16px);
 border-top:1px solid var(--line);
}
.wrap{max-width:820px;margin:0 auto}
#tray{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px}
#tray:empty{display:none}
.chip{
 position:relative;flex:none;height:56px;min-width:56px;
 border-radius:12px;overflow:hidden;background:var(--panel2);
 border:1px solid var(--line);display:flex;align-items:center;
}
.chip img{width:56px;height:56px;object-fit:cover}
.chip span{padding:0 12px;font-size:12px;direction:ltr}
.chip .x{
 position:absolute;top:3px;left:3px;width:20px;height:20px;
 border-radius:50%;background:#000a;color:#fff;
}
form{
 display:flex;align-items:flex-end;gap:2px;padding:5px;
 background:var(--panel);border:1px solid var(--line);border-radius:24px;
}
form:focus-within{border-color:var(--accent)}
textarea{
 flex:1;min-width:0;resize:none;height:42px;max-height:140px;
 padding:10px 6px;background:transparent;border:0;
 outline:0;color:var(--text);font-size:15px;
}
textarea::placeholder{color:var(--muted)}
#send{
 width:42px;height:42px;border-radius:50%;flex:none;
 font-size:18px;color:#fff;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
}
#send:disabled{opacity:.45;cursor:not-allowed}
#send.stop{background:linear-gradient(135deg,#ff7b8a,#e0445a)}
#send span{display:inline-block}
#send:not(.stop) span{transform:scaleX(-1)}
#mic.rec{color:#fff;background:#e0445a;animation:pulse 1s infinite}
#quotaInfo{text-align:center;font-size:11px;color:var(--muted);padding:7px 0 1px}
#quotaInfo.finished{color:var(--danger)}
#quotaInfo a{color:var(--accent)}

/* گالری عکس زیر پاسخ */
.gallery{
 display:grid;grid-template-columns:repeat(2,1fr);gap:6px;
 margin-top:6px;width:min(100%,340px);
}
.gallery figure{margin:0;border-radius:14px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.gallery a{display:block}
.gallery img{display:block;width:100%;height:130px;object-fit:cover}
.gallery figcaption{
 padding:4px 8px;font-size:10.5px;line-height:1.5;color:var(--muted);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* منوی سنجاق: ارسال فایل + حالت تفکر */
.wrap{position:relative}
#attach{position:relative}
#attach.badge::after{
 content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;
 border-radius:50%;background:#ff9d4d;border:2px solid var(--panel);
}
#pinMenu{
 position:absolute;right:0;bottom:100%;margin-bottom:6px;z-index:40;
 width:min(100%,330px);padding:8px;border-radius:18px;
 background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px #0006;
}
#pinMenu[hidden]{display:none}
.pin-item{
 display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;
 border-radius:12px;background:transparent;color:var(--text);font-size:14px;text-align:right;
}
.pin-item:active{background:var(--line)}
.pin-item.on{color:var(--accent);background:var(--panel2)}
.pin-title{font-size:12.5px;color:var(--muted);padding:8px 10px 6px;border-top:1px solid var(--line);margin-top:4px}
#thinkOpts{display:flex;gap:6px;padding:0 2px 2px}
#thinkOpts button{
 flex:1;padding:8px 4px;border-radius:12px;font-size:12px;line-height:1.5;
 background:var(--panel2);border:1px solid var(--line);color:var(--muted);
}
#thinkOpts button.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent2))}
#thinkOpts button.on.max{background:linear-gradient(135deg,#ff9d4d,#e0445a)}
#thinkOpts button:disabled{opacity:.4;cursor:not-allowed}
#thinkConfirm,#buyConfirm{
 position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
 padding:20px;background:#000a;
}
#thinkConfirm[hidden],#buyConfirm[hidden]{display:none}
.tc-card{
 width:100%;max-width:360px;max-height:90dvh;overflow-y:auto;padding:20px 18px 16px;
 border-radius:22px;background:var(--panel);border:1px solid var(--line);
 box-shadow:0 20px 70px #0008;
}
.tc-card h3{margin:0 0 10px;font-size:18px}
.tc-card p{margin:0 0 10px;font-size:13.5px;line-height:2}
.tc-card .tc-desc{color:var(--muted)}
.tc-card .tc-warn{
 padding:8px 12px;border-radius:12px;font-weight:bold;
 background:#ffc85722;border:1px solid #ffc85766;
}
.tc-btns{display:flex;gap:8px;margin-top:6px}
.tc-btns button{flex:1;height:44px;border-radius:12px;font-size:13.5px;font-weight:bold}
#tcNo{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
#tcYes{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
#tcYes.max{background:linear-gradient(135deg,#ff9d4d,#e0445a)}
#bcNo{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
#bcYes{color:#fff;background:linear-gradient(135deg,#2fb27a,#1f8f9e)}
#bcYes:disabled{opacity:.5}

/* پنجره‌ی تأیید خرید */
.bc-box{
 margin:0 0 10px;padding:4px 12px;border-radius:14px;
 background:var(--panel2);border:1px solid var(--line);
}
.bc-row{
 display:flex;justify-content:space-between;gap:10px;padding:8px 0;
 border-top:1px solid var(--line);font-size:13.5px;
}
.bc-row:first-child{border-top:0}
.bc-row span:first-child{color:var(--muted)}
.bc-row b{text-align:left}

/* فهرست فروشگاه داخل چت */
.shopbox{
 width:min(100%,340px);margin-top:6px;padding:10px 12px;border-radius:16px;
 background:var(--panel);border:1px solid var(--line);
}
.shopbox h4{margin:0 0 4px;font-size:13.5px}
.shopbox .it{
 display:flex;align-items:center;gap:8px;padding:7px 0;
 border-top:1px solid var(--line);font-size:13px;
}
.shopbox h4 + .it{border-top:0}
.shopbox .sw{
 flex:none;width:28px;height:28px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:15px;
 border:1px solid var(--line);
}
.shopbox .nm{flex:1;min-width:0}
.shopbox .pr{flex:none;color:var(--muted);font-size:12px;white-space:nowrap}
.shopbox .own{color:var(--ok)}
.shopbox .hint{margin:6px 0 0;font-size:11.5px;line-height:1.8;color:var(--muted)}

/* یادداشت کوتاه سیستم زیر چت (خرید لغو شد، سکه کافی نیست و ...) */
.ai .msg.note{font-size:13px;color:var(--muted);padding:8px 13px}

/* منو و تنظیمات */
#scrim{
 position:fixed;inset:0;background:#0009;z-index:50;
 opacity:0;pointer-events:none;transition:.2s;
}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{
 position:fixed;top:0;bottom:0;right:0;width:min(86vw,330px);z-index:60;
 background:var(--bg);border-left:1px solid var(--line);
 transform:translateX(105%);transition:transform .25s;
 display:flex;flex-direction:column;
 padding-bottom:env(safe-area-inset-bottom);
}
#drawer.open{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.dr-head h3{margin:0;font-size:16px}
#newChat{
 margin:4px 14px 8px;height:44px;border-radius:13px;font-weight:bold;color:#fff;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
}
#convSearch{
 margin:0 14px 8px;height:40px;padding:0 12px;border-radius:12px;
 border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0;
}
#convList{flex:1;overflow-y:auto;padding:0 8px 10px}
.conv{
 display:flex;align-items:center;gap:4px;padding:4px 6px 4px 4px;
 border-radius:12px;margin-bottom:2px;
}
.conv.on{background:var(--panel2)}
.conv .t{
 flex:1;min-width:0;text-align:right;background:transparent;padding:9px 8px;
 font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);
}
.conv .m{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.conv .b{background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:14px}
.conv .b:active{background:var(--line)}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:24px 10px}
.dr-foot{padding:8px 14px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
.dr-foot button{
 flex:1;height:40px;border-radius:12px;font-size:12.5px;
 background:var(--panel2);border:1px solid var(--line);color:var(--text);
}

#sheet{
 position:fixed;left:50%;top:50%;z-index:70;
 transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;
 width:min(92vw,380px);max-height:86dvh;overflow-y:auto;
 background:var(--panel);border:1px solid var(--line);border-radius:22px;
 padding:18px 18px 14px;box-shadow:0 20px 70px #0007;transition:.2s;
}
#sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#sheet h3{margin:0 0 12px;font-size:17px}
.set{margin-bottom:14px}
.set label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;gap:6px}
.seg button{
 flex:1;padding:8px 4px;border-radius:10px;font-size:12.5px;
 background:var(--panel2);border:1px solid var(--line);color:var(--muted);
}
.seg button.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:13.5px}
.sw input{width:20px;height:20px;accent-color:var(--accent)}
.buy-btn{
 flex:none;padding:7px 12px;border-radius:10px;font-size:12px;white-space:nowrap;
 color:#fff;background:linear-gradient(135deg,#f2b84b,#e08a2c);font-weight:bold;
}
.buy-btn:disabled{opacity:.45;cursor:not-allowed}
.set small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}
#closeSheet{
 width:100%;height:42px;border-radius:12px;margin-top:4px;color:#fff;font-weight:bold;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
}

#toast{
 position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
 background:#000d;color:#fff;padding:9px 16px;max-width:90vw;text-align:center;
 border-radius:12px;font-size:13px;opacity:0;
 pointer-events:none;transition:.25s;z-index:100000;
}
#toast.show{opacity:1}
</style>
</head>

<body>

<div id="accessGate">
 <div class="gate-card">
  <div class="gate-logo">🔐</div>
  <h2>ورود به دومیتو لازم است</h2>
  <p>برای استفاده از دستیار، ابتدا با حساب خودت وارد دومیتو شو.</p>
  <a id="goDomitoLogin" href="./index.html">رفتن به صفحه ورود دومیتو</a>
 </div>
</div>

<header>
 <div class="brand">
  <a class="icon" href="index.html" title="بازگشت" style="font-size:22px">→</a>
  <div class="logo">🎲</div>
  <div class="titles">
   <h1 id="convTitle">دستیار دومیتو</h1>
   <div class="sub"><span class="dot" id="dot"></span><span id="statusEl">آماده</span></div>
  </div>
 </div>
 <div class="hdr-actions">
  <button class="icon" id="menuBtn" title="گفتگوها">☰</button>
  <button class="icon" id="settingsBtn" title="تنظیمات">⚙️</button>
 </div>
</header>

<div id="personas"></div>

<main id="chat"></main>
<button id="toBottom" type="button" title="رفتن به پایین">⬇</button>

<footer>
 <div class="wrap">
  <div id="tray"></div>

function inline(s){
 return s.split(/(`[^`\n]+`)/g).map((part, i) => {
  if(i % 2 === 1) return '<code class="inl">' + part.slice(1, -1) + "</code>";
  return part
   // لینک بازی‌های خود دومیتو (فقط همین الگوی امن)؛ در همین تب باز می‌شود
   .replace(/\[([^\]\n]+)\]\((\.\/games\/[a-z0-9_-]+\.html(?:\?solo=1)?)\)/gi,
    '<a href="$2">$1</a>')
   .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
   .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
   .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<i>$2</i>");
 }).join("");
}

function renderText(p){
 const lines = esc(p).split("\n");
 const out = [];
 let list = null;
 const close = () => { if(list){ out.push("</" + list + ">"); list = null; } };

 for(const raw of lines){
  const line = raw.replace(/\s+$/, "");
  let m;
  if((m = line.match(/^(#{1,3})\s+(.*)$/))){
   close();
   const tag = ["h3","h4","h5"][m[1].length - 1];
   out.push("<" + tag + ">" + inline(m[2]) + "</" + tag + ">");
  }else if((m = line.match(/^\s*[-*•]\s+(.*)$/))){
   if(list !== "ul"){ close(); out.push("<ul>"); list = "ul"; }
   out.push("<li>" + inline(m[1]) + "</li>");
  }else if((m = line.match(/^\s*(\d+)[.)]\s+(.*)$/))){
   if(list !== "ol"){ close(); out.push("<ol>"); list = "ol"; }
   out.push("<li>" + inline(m[2]) + "</li>");
  }else if((m = line.match(/^&gt;\s?(.*)$/))){
   close();
   out.push("<blockquote>" + inline(m[1]) + "</blockquote>");
  }else if(line.trim() === ""){
   close();
  }else{
   close();
   out.push("<p>" + inline(line) + "</p>");
  }
 }
 close();
 return out.join("");
}

function render(text){
 return String(text).split("```").map((p, i) => {
  if(i % 2 === 1){
   const nl = p.indexOf("\n");
   const lang = nl > -1 ? p.slice(0, nl).trim() : "";
   const code = nl > -1 ? p.slice(nl + 1) : p;
   return '<div class="code"><div class="codebar"><span>' + (esc(lang) || "code") +
    '</span><button type="button" class="copy">کپی</button></div><pre><code>' +
    esc(code.replace(/\n$/, "")) + "</code></pre></div>";
  }
  return renderText(p);
 }).join("");
}

let convs = [];
let conv = null;

function storeKey(){ return "domito_ai_chats_v1_" + uid; }

function loadConvs(){
 try{
  const raw = JSON.parse(localStorage.getItem(storeKey()) || "[]");
  convs = Array.isArray(raw) ? raw.filter(c => c && c.id && Array.isArray(c.messages)) : [];
 }catch(e){ convs = []; }
}
function saveConvs(){
 convs.sort((a, b) => b.updated - a.updated);
 convs = convs.slice(0, MAX_CONVS);
 try{ localStorage.setItem(storeKey(), JSON.stringify(convs)); }
 catch(e){ toast("ذخیره گفتگو انجام نشد (حافظه مرورگر پر است)."); }
 renderConvList();
}
function newConv(){
 conv = { id:makeId(), title:"گفتگوی جدید", persona:settings.persona, updated:Date.now(), messages:[] };
 return conv;
}
function openConv(id){
 const c = convs.find(x => x.id === id);
 if(!c) return;
 conv = c;
 if(!PERSONAS[conv.persona]) conv.persona = "friend";
 settings.persona = conv.persona;
 saveSettings();
 renderPersonas();
 renderConversation();
}
function persistCurrent(){
 if(!conv || !conv.messages.length) return;
 conv.updated = Date.now();
 if(conv.messages.length > MAX_MSGS) conv.messages = conv.messages.slice(-MAX_MSGS);
 if(!convs.includes(conv)) convs.push(conv);
 saveConvs();
}
function makeTitle(text){
 const t = String(text).replace(/\s+/g, " ").trim();
 return t.length > 32 ? t.slice(0, 32) + "…" : (t || "گفتگوی جدید");
}

function fmtDate(t){
 try{
  return new Intl.DateTimeFormat("fa-IR", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }).format(new Date(t));
 }catch(e){ return ""; }
}

function renderConvList(){
 const box = $("convList");
 const q = $("convSearch").value.trim().toLowerCase();
 const list = convs.filter(c => !q ||
  c.title.toLowerCase().includes(q) ||
  c.messages.some(m => String(m.content).toLowerCase().includes(q)));
 if(!list.length){
  box.innerHTML = '<div class="empty">' + (q ? "چیزی پیدا نشد." : "هنوز گفتگویی ذخیره نشده.") + "</div>";
  return;
 }
 box.innerHTML = "";
 list.forEach(c => {
  const row = document.createElement("div");
  row.className = "conv" + (conv && c.id === conv.id ? " on" : "");
  const p = PERSONAS[c.persona] || PERSONAS.friend;

  const t = document.createElement("button");
  t.type = "button";
  t.className = "t";
  t.innerHTML = p.icon + " " + esc(c.title) + '<span class="m">' + esc(fmtDate(c.updated)) + "</span>";
  t.onclick = () => { if(busy) return toast("صبر کن پاسخ تموم شه."); openConv(c.id); closeAll(); };

  const ren = document.createElement("button");
  ren.type = "button"; ren.className = "b"; ren.textContent = "✏️"; ren.title = "تغییر نام";
  ren.onclick = () => {
   const name = prompt("نام جدید گفتگو:", c.title);
   if(name && name.trim()){ c.title = name.trim().slice(0, 60); saveConvs(); if(conv === c) updateHeader(); }
  };

  const del = document.createElement("button");
  del.type = "button"; del.className = "b"; del.textContent = "🗑"; del.title = "حذف";
  del.onclick = () => {
   if(busy) return toast("صبر کن پاسخ تموم شه.");
   if(!confirm("این گفتگو حذف شود؟")) return;
   convs = convs.filter(x => x !== c);
   if(conv === c){ newConv(); renderConversation(); }
   saveConvs();
  };

  row.append(t, ren, del);
  box.appendChild(row);
 });
}

let authReady = false;

let busy = false;

function quotaRemaining(){ return Math.max(0, Number(quotaState?.remaining) || 0); }
function canSendMessage(){ return authReady && !!uid && !!quotaState && quotaRemaining() > 0; }

function updateQuotaDisplay(){
 const info = $("quotaInfo");
 if(!authReady){
  info.textContent = "برای استفاده، با حساب دومیتو وارد شو.";
  info.className = "";
 }else if(!quotaState){
  info.textContent = "در حال دریافت سهمیه روزانه...";
  info.className = "";
 }else{
  const r = quotaRemaining();
  const limit = Number(quotaState.limit) || 5;
  if(quotaState.unlimited){
   info.textContent = "🤖 سهمیه امروز: نامحدود";
   info.className = "";
  }else if(r > 0){
   info.textContent = "🤖 سهمیه امروز: " + r + " از " + limit + " سؤال باقی مانده • با برد در بازی تک‌نفره +۱ سؤال";
   info.className = "";
  }else{
   info.innerHTML = 'سهمیه امروز تمام شده؛ یکی از بازی‌های تک‌نفره رو ببر یا از تنظیمات (⚙️) با سکه سؤال بخر. <a href="./index.html">برو به بازی‌ها</a>';
   info.className = "finished";
  }
 }
 updateSendButton();
 updateThinkBar();
}

// عکس‌های پیدا‌شده از اینترنت؛ فقط آدرس‌های https پذیرفته می‌شوند.
function cleanImages(list){
 if(!Array.isArray(list)) return [];
 return list
  .filter(x => x && /^https:\/\//i.test(x.thumb || "") && /^https:\/\//i.test(x.link || ""))
  .slice(0, 4)
  .map(x => ({
   thumb:String(x.thumb), link:String(x.link),
   title:String(x.title || "").slice(0, 80), credit:String(x.credit || "").slice(0, 60)
  }));
}

function makeGallery(images){
 const box = document.createElement("div");
 box.className = "gallery";
 images.forEach(im => {
  const fig = document.createElement("figure");
  const a = document.createElement("a");
  a.href = im.link; a.target = "_blank"; a.rel = "noopener noreferrer";
  const img = document.createElement("img");
  img.src = im.thumb; img.alt = im.title; img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  img.onerror = () => { fig.remove(); if(!box.children.length) box.remove(); };
  a.appendChild(img);
  fig.appendChild(a);
  const cap = (im.credit || im.title);
  if(cap){
   const fc = document.createElement("figcaption");
   fc.textContent = "📷 " + cap;
   fig.appendChild(fc);
  }
  box.appendChild(fig);
 });
 return box;
}

function applyAccessGate(){

 input.disabled = !g.open;
 input.placeholder = g.open ? "پیامت رو بنویس..." : GATE_TEXT[g.reason];
 if(!g.open){

  pending = [];
  renderTray();

 if(!can("web")) searchOn = false;
 if(!can("think")) thinkMode = "low";

const CONTEXT_WAIT = 4500;
let myProfile = null;
let friendNamesCache = { at: 0, names: [] };
let turnContext = "";

function withTimeout(promise, ms){
 return Promise.race([
  promise,
  new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
 ]);
}

async function refreshMyProfile(){
 try{
  const p = await withTimeout(getPublicProfile(userName), CONTEXT_WAIT);
  if(p) myProfile = p;
 }catch(e){ /* پروفایل قبلی می‌ماند */ }
 return myProfile;
}

async function loadFriendNames(){
 if(Date.now() - friendNamesCache.at < 60000) return friendNamesCache.names;
 try{
  const names = await withTimeout(getFriendNames(userName), CONTEXT_WAIT);
  friendNamesCache = { at:Date.now(), names };
 }catch(e){ /* همان فهرست قبلی */ }
 return friendNamesCache.names;
}

function lastAssistantShowedShop(){
 for(let i = conv.messages.length - 1; i >= 0; i--){
  if(conv.messages[i].role === "assistant") return Array.isArray(conv.messages[i].shop);
 }
 return false;
}

// هر مرحله جدا try/catch دارد تا خطای شبکه هیچ‌وقت جلوی پاسخ را نگیرد.
async function buildTurnContext(){
 const dataLines = [];
 let catalog = "";
 try{
  const userTexts = conv.messages.filter(m => m.role === "user").slice(-2).map(m => String(m.content));
  const lastText = userTexts[userTexts.length - 1] || "";
  // فهرست آیتم‌ها فقط وقتی به مدل داده می‌شود که کاربر خودش از فروشگاه/خرید گفته؛
  // بعد از نمایش فهرست هم فقط برای جمله‌های خرید («اولی رو بخر»).
  const wantsCatalog = needsCatalog([lastText]) ||
   (lastAssistantShowedShop() && /(بخر|بگیر|اولی|دومی|سومی|همین|اون)/.test(lastText));
  turnIntent = detectIntent(lastText, GAMES);
  const hint = intentHint(turnIntent);
  if(hint) dataLines.push(hint);
  const wantsSelf = wantsCatalog || needsSelfInfo(userTexts);
  turnIsAdmin = false;

  // ادمین بودن را خود برنامه از Firebase چک می‌کند، نه حرف کاربر.
  try{
   if(await withTimeout(isAdminUser(), CONTEXT_WAIT)){ turnIsAdmin = true; dataLines.push(describeAdmin(userName)); }
  }catch(e){ /* ادمین شناخته نمی‌شود */ }

  if(wantsSelf){
   const me = await refreshMyProfile();
   dataLines.push(describeSelf(userName, me));
   if(wantsCatalog) catalog = buildCatalogText(me);
  }

  const names = await loadFriendNames();
  let targets = matchFriendNames(userTexts.join(" "), names, 3);
  const wantsFriends = asksAboutFriends(userTexts);
  if(!targets.length && wantsFriends) targets = names.slice(0, 8);

  if(targets.length || wantsFriends){
   if(!names.length){
    dataLines.push("- کاربر هنوز دوستی در دومیتو ندارد.");
   }else{
    dataLines.push("- دوستان کاربر: " + names.slice(0, 30).map(n => cleanText(n, 30)).join("، "));
   }
  }

  for(const name of targets){
   try{
    const p = await withTimeout(getPublicProfile(name), CONTEXT_WAIT);
    // دوستی باید از هر دو طرف ثبت شده باشد؛ وگرنه مثل غریبه حساب می‌شود.
    if(!isMutualFriend(userName, p)) continue;
    dataLines.push(describeFriend(name, p).line);
   }catch(e){
    dataLines.push("- " + cleanText(name, 30) + ": خواندن اطلاعات ممکن نشد.");
   }
  }
 }catch(e){
  console.warn("Assistant context:", e);
 }
 return buildDomitoContext({
  rules:buildAssistantRules(),
  games:buildGameGuide(GAMES),
  dataLines,
  catalog
 });
}

const HEX = /^#[0-9a-f]{3,8}$/i;

function swatchFor(item){
 const s = document.createElement("span");
 s.className = "sw";
 const c = item.colors;
 if(c && HEX.test(c[0]) && HEX.test(c[1])){
  s.style.background = "linear-gradient(135deg," + c[0] + "," + c[1] + ")";
 }else{
  s.style.background = "var(--panel2)";
 }
 if(item.emoji) s.textContent = item.emoji;
 else if(item.category === "title") s.textContent = "👑";
 else if(item.category === "effect") s.textContent = "✨";
 return s;
}

 box.className = "shopbox";

 box.appendChild(hint);

let purchasing = false;

function confirmBuy({ title, ask, rows, note, yes }){
 return new Promise(resolve => {
  const box = $("buyConfirm");
  $("bcTitle").textContent = title;
  $("bcAsk").textContent = ask;
  $("bcNote").textContent = note || "";
  $("bcYes").textContent = yes || "تأیید و خرید";
  const list = $("bcBox");
  list.textContent = "";
  rows.forEach(([label, value]) => {
   const r = document.createElement("div");
   r.className = "bc-row";
   const a = document.createElement("span");
   a.textContent = label;
   const b = document.createElement("b");
   b.textContent = value;
   r.append(a, b);
   list.appendChild(r);
  });
  box.hidden = false;
  const close = v => {
   box.hidden = true;
   $("bcYes").onclick = null;
   $("bcNo").onclick = null;
   box.onclick = null;
   resolve(v);
  };
  $("bcYes").onclick = e => { if(e.isTrusted) close(true); };
  $("bcNo").onclick = () => close(false);
  box.onclick = e => { if(e.target === box) close(false); };
 });
}

function addNote(text){
 const { row, msg } = makeRow("ai", text, false);
 msg.classList.add("note");
 chat.appendChild(row);
 scrollDown(true);
}

async function proposeItem(itemId){
 const item = ITEM_BY_ID[itemId];
 if(!item) return;
 if(!can("buy")){ addNote("خرید برای حساب تو بسته شده."); return; }
 const profile = await refreshMyProfile();
 if(!profile){ addNote("پروفایلت خوانده نشد؛ دوباره امتحان کن."); return; }
 if(readShop(profile).purchased[item.id]){
  addNote("«" + item.name + "» رو از قبل داری.");
  return;
 }
 const coins = Math.max(0, Math.floor(Number(profile.coins) || 0));
 if(coins < item.price){
  addNote("سکه‌ات برای «" + item.name + "» کافی نیست؛ " + toFa(coins) + " سکه داری و " + toFa(item.price) + " لازمه.");
  return;
 }
 const ok = await confirmBuy({
  title:"🛒 تأیید خرید",
  ask:"می‌خوای «" + item.name + "» رو بخری؟",

let pending = [];

function toImage(file){
 return new Promise((resolve, reject) => {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
   const max = 1024;
   let w = img.width, h = img.height;
   const s = Math.min(1, max / Math.max(w, h));
   w = Math.round(w * s); h = Math.round(h * s);
   const c = document.createElement("canvas");
   c.width = w; c.height = h;
   const ctx = c.getContext("2d");
   ctx.fillStyle = "#fff";
   ctx.fillRect(0, 0, w, h);
   ctx.drawImage(img, 0, 0, w, h);
   URL.revokeObjectURL(url);
   resolve(c.toDataURL("image/jpeg", 0.82));
  };
  img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("عکس خوانده نشد")); };
  img.src = url;
 });
}

async function addFiles(files){
 if(!canSendMessage()){ showLimitMessage(); return; }
 for(const f of files){
  if(pending.length >= MAX_FILES){ toast("حداکثر " + MAX_FILES + " فایل در هر پیام"); break; }
  try{
   if(f.type.startsWith("image/")){
    pending.push({ kind:"image", name:f.name, dataUrl:await toImage(f) });
   }else{
    if(f.size > 2 * 1024 * 1024){ toast("فایل بزرگ‌تر از ۲ مگابایت است"); continue; }
    let text = await f.text();
    if(text.includes("\u0000")){ toast("این نوع فایل پشتیبانی نمی‌شود"); continue; }
    if(text.length > MAX_TEXT) text = text.slice(0, MAX_TEXT) + "\n...[ادامه فایل بریده شد]";
    pending.push({ kind:"text", name:f.name, text });
   }
  }catch(err){ toast(err.message || "فایل خوانده نشد"); }
 }
 renderTray();
}

function renderTray(){
 tray.innerHTML = "";
 pending.forEach((a, i) => {
  const c = document.createElement("div");
  c.className = "chip";
  if(a.kind === "image"){
   const im = document.createElement("img");
   im.src = a.dataUrl;
   c.appendChild(im);
  }else{
   const s = document.createElement("span");

  }

function typewrite(box, text){
 return new Promise(resolve => {
  if(!settings.typewriter || text.length < 40){
   box.innerHTML = render(text);
   return resolve();
  }
  let i = 0;
  const step = Math.max(3, Math.ceil(text.length / 260));
  const id = setInterval(() => {
   i = Math.min(text.length, i + step);
   box.innerHTML = render(text.slice(0, i));
   scrollDown(false);
   if(i >= text.length) done();
  }, 22);
  function done(){
   clearInterval(id);
   typer = null;
   box.innerHTML = render(text);
   resolve();
  }
  typer = { finish: done };
 });
}

async function runAssistant(reservationId, lastContent, mode, search){
 mode = THINK[mode] ? mode : "low";
 search = !!search;
 lastThink = mode;
 lastSearch = search;
 setBusy(true);
 if(mode !== "low") setStatus("در حال فکر کردن...", "busy");
 if(search) setStatus("در حال جستجو در وب...", "busy");
 const { row, msg } = addTyping();
 // اطلاعات دوستان، فروشگاه و بازی‌ها؛ اگر خواندنشان خراب شود پاسخ بدون آن‌ها هم کار می‌کند.
 turnContext = await buildTurnContext();
 let proposal = null;
 const ctrl = new AbortController();
 abortCtrl = ctrl;
 const limitMs = (mode === "max" ? 130000 : mode === "medium" ? 100000 : 70000) + (search ? 20000 : 0);
 const timer = setTimeout(() => ctrl.abort(), limitMs);
 let timedOut = false;
 const timeoutWatch = setTimeout(() => { timedOut = true; }, limitMs - 100);
 let success = false;
 let failedStatus = false;

 try{
  const res = await fetch(API, {
   method:"POST",
   headers:{ "Content-Type":"application/json" },
   body:JSON.stringify({ messages:payload(lastContent), think:mode, search }),
   signal:ctrl.signal
  });
  clearTimeout(timer);
  clearTimeout(timeoutWatch);

  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error || "HTTP " + res.status);

  const rawAnswer = (data.choices?.[0]?.message?.content || "").trim();
  if(!rawAnswer) throw new Error("پاسخ خالی بود");

  // برچسب‌های [[SHOP]] و [[BUY]] از متن جدا می‌شوند و هیچ‌وقت نمایش یا ذخیره نمی‌شوند.
  const parsed = extractActions(rawAnswer);
  // فروشگاه و خرید فقط وقتی اجرا می‌شوند که کاربر در آخرین پیامش خودش از فروشگاه یا خرید حرف زده باشد؛
  // اگر مدل بی‌جا برچسب گذاشت (مثلاً برای درخواست بازی)، نادیده گرفته می‌شود.
  const lastUser = [...conv.messages].reverse().find(m => m.role === "user");
  const lastText = lastUser ? String(lastUser.content) : "";
  const shopOk = needsCatalog([lastText]) && /(بخر|خرید)/.test(lastText);
  // تغییر دسترسی: فقط وقتی خود برنامه ادمین بودن را تأیید کرده و پیام کاربر درباره‌ی دسترسی بوده.
  const accessOk = turnIsAdmin && asksAccessChange(lastText);
  // برچسب فروشگاه مدل نادیده گرفته می‌شود؛ فهرست فقط با قصد خود کاربر (turnIntent) نمایش داده می‌شود.
  parsed.actions = parsed.actions.filter(a =>
   a.type === "shop" ? false : a.type.startsWith("access") ? accessOk : shopOk
  );
  const answer = parsed.text || fallbackTextFor(parsed.actions) || intentFallback(turnIntent) || "منظورت رو متوجه نشدم؛ دوباره بگو.";

  abortCtrl = null;
  const found = can("images") ? cleanImages(data.images) : [];
  const reply = { role:"assistant", content:answer, t:Date.now(), think:mode, search };
  if(found.length) reply.images = found;
  const shopCategories =
   turnIntent && turnIntent.kind === "shop-all" ? SHOP_CATEGORIES.map(c => c.id) :
   turnIntent && turnIntent.kind === "shop-cat" ? [turnIntent.category] : [];
  if(shopCategories.length){
   reply.shop = shopCategories;
   await refreshMyProfile(); // تا «✅ داری» در فهرست درست باشد
  }
  proposal = parsed.actions.find(a => a.type === "buy" || a.type === "buyq" || a.type.startsWith("access")) || null;
  conv.messages.push(reply);
  persistCurrent();
  success = true;

  await typewrite(msg, answer);
 }catch(err){
  clearTimeout(timer);
  clearTimeout(timeoutWatch);
  abortCtrl = null;
  row.remove();
  const stoppedByUser = err.name === "AbortError" && !timedOut;
  let text;
  if(stoppedByUser) text = "پاسخ متوقف شد.";
  else if(err.name === "AbortError") text = "زمان اتصال تمام شد. دوباره امتحان کن.";
  else if(err.name === "TypeError") text = "اتصال برقرار نشد. اینترنتت رو بررسی کن.";
  else text = "خطا: " + err.message;
  addRetryBubble(text);
  failedStatus = !stoppedByUser;
 }

 // فقط پاسخ موفق سهمیه مصرف می‌کند؛ در غیر این صورت رزرو آزاد می‌شود.
 try{
  quotaState = await finishAIQuestion(reservationId, success);
  updateQuotaDisplay();
 }catch(qe){
  console.error("AI quota finish:", qe);
 }

 setBusy(false);
 if(success) renderConversation();
 if(failedStatus) setStatus("خطا در اتصال", "err");
 // پیشنهاد خرید دستیار: پنجره‌ی تأیید باز می‌شود و فقط با دکمه‌ی خود کاربر خرید انجام می‌شود.
 if(success && proposal) await handleProposal(proposal);
 if(success) await runIntent(turnIntent);
 input.focus();
}

$("form").addEventListener("submit", async e => {
 e.preventDefault();

 if(busy){ stopGeneration(); return; }

 if(!authReady || !uid){
  toast("ابتدا با حساب دومیتو وارد شو.");
  location.href = "./index.html";
  return;
 }

 const text = input.value.trim();
 if(!text && !pending.length) return;

 await refreshAccess();
 if(!applyAccessGate()){ toast(GATE_TEXT[assistantGate(myAccess).reason]); return; }
 const mode = can("think") ? thinkMode : "low";
 const search = searchOn && can("web");
 const reservationId = await tryReserve(THINK[mode].cost);
 if(!reservationId) return;
 thinkMode = "low";
 searchOn = false;
 renderThinkBar();

 const atts = pending;
 pending = [];
 renderTray();
 input.value = "";
 autoGrow();

 const w = $("welcome");
 if(w) w.remove();

 // در ذخیره‌سازی فقط متن می‌ماند؛ عکس‌ها به‌صورت یادداشت ذخیره می‌شوند.
 const stored = (text + atts.map(a => a.kind === "image" ? "\n[عکس: " + a.name + "]" : "\n[فایل: " + a.name + "]").join("")).trim();
 const content = buildContent(text, atts);
 if(!conv) newConv();
 if(!conv.messages.length) conv.title = makeTitle(text || (atts[0] && atts[0].name) || "");
 conv.persona = settings.persona;
 conv.messages.push({ role:"user", content:stored, t:Date.now() });
 persistCurrent();

 // نمایش پیام کاربر (با پیش‌نمایش عکس)
 const { row, msg } = makeRow("user", "", false);
 atts.forEach(a => {
  if(a.kind === "image"){
   const im = document.createElement("img");
   im.className = "thumb"; im.src = a.dataUrl;
   msg.appendChild(im);
  }else{
   const c = document.createElement("div");
   c.className = "filechip"; c.textContent = "📄 " + a.name;
   msg.appendChild(c);
  }
 });
 if(text){ const t = document.createElement("div"); t.textContent = text; msg.appendChild(t); }
 chat.appendChild(row);
 updateHeader();
 scrollDown(true);

 await runAssistant(reservationId, Array.isArray(content) ? content : null, mode, search);
});

async function regenerate(){
 if(busy) return;
 if(!conv || !conv.messages.length) return;
 if(!canSendMessage()){ showLimitMessage(); return; }
 // پاسخ دوباره با همان حالت تفکر قبلی انجام می‌شود (و همان هزینه را دارد).
 const prev = conv.messages[conv.messages.length - 1];
 const mode = THINK[prev.think] ? prev.think : (THINK[lastThink] ? lastThink : "low");
 const search = prev.role === "assistant" && "search" in prev ? !!prev.search : lastSearch;
 if(mode !== "low"){
  if(!quotaState.unlimited && quotaRemaining() < THINK[mode].cost){
   toast("سهمیه‌ات برای پاسخ دوباره با این حالت کافی نیست.");
   return;
  }
  if(!quotaState.unlimited && !(await confirmThink(mode))) return;
 }
 const reservationId = await tryReserve(THINK[mode].cost);
 if(!reservationId) return;
 if(conv.messages[conv.messages.length - 1].role === "assistant") conv.messages.pop();
 if(!conv.messages.length || conv.messages[conv.messages.length - 1].role !== "user"){
  await finishAIQuestion(reservationId, false).catch(() => {});
  return;
 }
 persistCurrent();
 renderConversation();
 // renderConversation بالا برای پیام بی‌پاسخ حباب خطا می‌گذارد؛ آن را برمی‌داریم.
 const last = chat.lastElementChild;
 if(last && last.querySelector(".msg.error")) last.remove();
 await runAssistant(reservationId, null, mode, search);
}

// ورودی
// ======================================

function autoGrow(){
 input.style.height = "42px";
 input.style.height = Math.min(input.scrollHeight, 140) + "px";
}
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e => {
 if(e.key === "Enter" && !e.shiftKey && settings.enterSend && window.innerWidth > 700){
  e.preventDefault();
  $("form").requestSubmit();
 }
});

// شروع
// ======================================

async function initializeDomitoAccount(){
 loadSettings();
 applySettings();
 renderPersonas();
 renderThinkBar();
 try{
  const authUser = await waitForUser();
  const name = String(getSavedName() || "").trim();
  const id = currentUid();
  if(!authUser || !name || !id){
   authReady = false;
   gate.hidden = false;
   updateQuotaDisplay();
   return;
  }
  uid = id;
  userName = name;
  authReady = true;
  gate.hidden = true;
  loadConvs();
  newConv();
  renderConversation();
  updateSendButton();
  // برای نشان‌دادن «✅ داری» در فهرست فروشگاه؛ منتظرش نمی‌مانیم.
  refreshMyProfile();
  await refreshQuota();
  await refreshAccess();
 }catch(error){
  console.error("Domito account/quota init:", error);
  if(!authReady) gate.hidden = false;
  updateQuotaDisplay();
  toast("اتصال به حساب دومیتو یا سهمیه برقرار نشد.");
 }
}

chat.innerHTML = "";
updateSendButton();
initializeDomitoAccount();
</script>
