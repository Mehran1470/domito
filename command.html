<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>دستور دومیتو</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;

      color: #fff;

      background:
        radial-gradient(
          circle at top right,
          rgba(70, 120, 255, .20),
          transparent 38%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(150, 70, 255, .18),
          transparent 38%
        ),
        #070b14;
    }

    .command-page {
      width: min(460px, 100%);

      padding: 25px;

      border-radius: 28px;

      background:
        rgba(20, 25, 38, .86);

      border:
        1px solid
        rgba(255,255,255,.12);

      box-shadow:
        0 25px 80px
        rgba(0,0,0,.50);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      animation:
        commandAppear .25s ease;
    }

    @keyframes commandAppear {

      from {
        opacity: 0;
        transform:
          scale(.95)
          translateY(10px);
      }

      to {
        opacity: 1;
        transform:
          scale(1)
          translateY(0);
      }

    }

    .command-icon {

      width: 70px;
      height: 70px;

      margin: 0 auto 16px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 22px;

      font-size: 34px;

      background:
        rgba(255,255,255,.08);

      border:
        1px solid
        rgba(255,255,255,.12);

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);

    }

    h1 {

      margin: 0;

      text-align: center;

      font-size: 24px;

      font-weight: 800;

    }

    .subtitle {

      margin:
        8px 0 20px;

      text-align: center;

      color:
        rgba(255,255,255,.58);

      font-size: 13px;

    }

    .input-wrap {

      display: flex;

      gap: 9px;

    }

    #commandInput {

      flex: 1;

      min-width: 0;

      height: 52px;

      padding:
        0 15px;

      border-radius: 16px;

      border:
        1px solid
        rgba(255,255,255,.12);

      outline: none;

      background:
        rgba(0,0,0,.28);

      color: #fff;

      font-size: 15px;

      direction: ltr;

      text-align: left;

      transition:
        border .2s ease,
        box-shadow .2s ease;

    }

    #commandInput:focus {

      border-color:
        rgba(100,150,255,.65);

      box-shadow:
        0 0 0 3px
        rgba(100,150,255,.10);

    }

    #commandInput::placeholder {

      color:
        rgba(255,255,255,.35);

    }

    button {

      border: 0;

      outline: 0;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }

    #runButton {

      width: 82px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #477cff,
          #7557ff
        );

      color: #fff;

      font-size: 14px;

      font-weight: 800;

      box-shadow:
        0 10px 25px
        rgba(70,100,255,.25);

    }

    #runButton:active {

      transform:
        scale(.97);

    }

    .message {

      min-height: 50px;

      margin-top: 14px;

      padding:
        13px 15px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.08);

      color:
        rgba(255,255,255,.85);

      font-size: 13px;

      line-height: 1.8;

      white-space: pre-wrap;

      word-break: break-word;

    }

    .result {

      max-height: 330px;

      overflow: auto;

      margin-top: 12px;

      padding: 14px;

      border-radius: 16px;

      background:
        rgba(0,0,0,.30);

      border:
        1px solid
        rgba(255,255,255,.08);

      direction: ltr;

      text-align: left;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 12px;

      line-height: 1.7;

      white-space: pre-wrap;

      display: none;

    }

    .result.show {

      display: block;

    }

    #backButton {

      width: 100%;

      height: 48px;

      margin-top: 14px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid
        rgba(255,255,255,.10);

      color: #fff;

      font-weight: 700;

    }

    #backButton:active {

      transform:
        scale(.98);

    }

    @media (max-width: 390px) {

      .command-page {

        padding: 19px;

        border-radius: 23px;

      }

      #runButton {

        width: 72px;

      }

    }

  </style>

</head>


<body>


  <main class="command-page">


    <!-- لوگوی پنل -->

    <div class="command-icon">
      🛠️
    </div>


    <h1>
      پنل دستورات دومیتو
    </h1>


    <div class="subtitle">
      دستور را وارد کنید
    </div>


    <div class="input-wrap">


      <input
        id="commandInput"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="/11"
      >


      <button
        id="runButton"
      >
        تأیید
      </button>


    </div>


    <div
      id="message"
      class="message"
    >
      آماده اجرای دستور.
    </div>


    <pre
      id="result"
      class="result"
    ></pre>


    <button
      id="backButton"
    >
      ← بازگشت
    </button>


  </main>



  <script type="module">


    import {

      waitForUser,

      getSavedName,

      logoutUser,

      profileRef,

      roomRef,

      remove,

      get,

      removeFriend,

      sendFriendRequest,

      createRoom,

      joinRoomByCode,

      leaveLobby

    } from "./js/app.js";



    const input =
      document.getElementById(
        "commandInput"
      );


    const runButton =
      document.getElementById(
        "runButton"
      );


    const backButton =
      document.getElementById(
        "backButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    const resultBox =
      document.getElementById(
        "result"
      );



    // ==========================================================
    // پیام
    // ==========================================================

    function showMessage(text) {

      message.textContent =
        String(text || "");

    }



    // ==========================================================
    // نتیجه
    // ==========================================================

    function showResult(value) {

      let output = "";


      if (
        value === undefined ||
        value === null
      ) {

        output =
          "مقداری وجود ندارد.";

      }

      else if (
        typeof value === "string"
      ) {

        output =
          value;

      }

      else {

        output =
          JSON.stringify(
            value,
            null,
            2
          );

      }


      resultBox.textContent =
        output;


      resultBox.classList.add(
        "show"
      );


      resultBox.scrollTop = 0;

    }



    function clearResult() {

      resultBox.textContent =
        "";

      resultBox.classList.remove(
        "show"
      );

    }



    // ==========================================================
    // آرگومان دستور
    // ==========================================================

    function requireArgument(
      command,
      prefix,
      label
    ) {

      const value =
        command
          .slice(prefix.length)
          .trim();


      if (!value) {

        showMessage(
          `❌ ${label} را وارد کن.`
        );

        return null;

      }


      return value;

    }



    // ==========================================================
    // خواندن پروفایل
    // ==========================================================

    async function readProfile(
      name
    ) {

      const snap =
        await get(
          profileRef(name)
        );


      if (
        !snap.exists()
      ) {

        return null;

      }


      return snap.val();

    }



    // ==========================================================
    // اجرای دستور
    // ==========================================================

    async function runCommand() {


      const command =
        String(
          input.value || ""
        ).trim();


      clearResult();



      if (!command) {

        showMessage(
          "❌ یک دستور وارد کن."
        );

        input.focus();

        return;

      }



      if (
        !command.startsWith("/")
      ) {

        showMessage(
          "❌ دستور باید با / شروع شود."
        );

        return;

      }



      const myName =
        getSavedName();



      if (!myName) {

        showMessage(
          "❌ کاربر وارد حساب نشده است."
        );

        return;

      }



      try {


        // ======================================================
        // /0
        // ======================================================

        if (
          command === "/0"
        ) {


          const ok =
            confirm(
              "مطمئنی می‌خوای از حسابت خارج بشی؟"
            );


          if (!ok) {

            showMessage(
              "❌ خروج لغو شد."
            );

            return;

          }


          runButton.disabled =
            true;


          input.disabled =
            true;


          showMessage(
            "⏳ در حال خروج از حساب..."
          );


          await logoutUser();


          showMessage(
            "✅ با موفقیت خارج شدی."
          );


          setTimeout(
            () => {

              window.location.href =
                "index.html";

            },
            700
          );


          return;

        }



        // ======================================================
        // /01=نام
        // ======================================================

        if (
          command.startsWith(
            "/01="
          )
        ) {


          const friendName =
            requireArgument(
              command,
              "/01=",
              "نام دوست"
            );


          if (!friendName) {

            return;

          }


          const result =
            await removeFriend(
              myName,
              friendName
            );


          if (!result.ok) {

            showMessage(

              result.reason ===
              "not-friend"

                ? "❌ این شخص دوستت نیست."

                : "❌ حذف دوست انجام نشد."

            );


            return;

          }


          showMessage(
            `✅ ${friendName} از دوستانت حذف شد.`
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /02=نام
        // ======================================================

        if (
          command.startsWith(
            "/02="
          )
        ) {


          const targetName =
            requireArgument(
              command,
              "/02=",
              "نام کاربر"
            );


          if (!targetName) {

            return;

          }


          const result =
            await sendFriendRequest(
              myName,
              targetName
            );


          const messages = {

            invalid:
              "❌ نام کاربر نامعتبر است.",

            "not-found":
              "❌ این کاربر پیدا نشد.",

            "already-friends":
              "❌ این شخص از قبل دوستت است.",

            "request-pending":
              "⚠️ درخواست دوستی قبلاً ارسال شده است."

          };


          if (!result.ok) {

            showMessage(

              messages[
                result.reason
              ] ||

              "❌ ارسال درخواست انجام نشد."

            );


            return;

          }


          showMessage(
            `✅ درخواست دوستی برای ${targetName} ارسال شد.`
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /03=نام
        // ======================================================

        if (
          command.startsWith(
            "/03="
          )
        ) {


          const targetName =
            requireArgument(
              command,
              "/03=",
              "نام کاربر"
            );


          if (!targetName) {

            return;

          }


          await remove(

            profileRef(
              targetName,
              `friendRequests/${myName}`
            )

          );


          const result =
            await sendFriendRequest(
              myName,
              targetName
            );


          if (!result.ok) {

            showMessage(
              "❌ ارسال دوباره درخواست انجام نشد."
            );

            return;

          }


          showMessage(
            `✅ درخواست دوستی دوباره برای ${targetName} ارسال شد.`
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /04=نام
        // پروفایل
        // ======================================================

        if (
          command.startsWith(
            "/04="
          )
        ) {


          const name =
            requireArgument(
              command,
              "/04=",
              "نام کاربر"
            );


          if (!name) {

            return;

          }


          showMessage(
            `⏳ در حال خواندن پروفایل ${name}...`
          );


          const profile =
            await readProfile(
              name
            );


          if (!profile) {

            showMessage(
              "❌ این کاربر پیدا نشد."
            );

            return;

          }


          showMessage(
            `✅ پروفایل ${name} دریافت شد.`
          );


          showResult(
            profile
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /05=نام
        // دوستان
        // ======================================================

        if (
          command.startsWith(
            "/05="
          )
        ) {


          const name =
            requireArgument(
              command,
              "/05=",
              "نام کاربر"
            );


          if (!name) {

            return;

          }


          const profile =
            await readProfile(
              name
            );


          if (!profile) {

            showMessage(
              "❌ این کاربر پیدا نشد."
            );

            return;

          }


          const friends =
            Object.keys(
              profile.friends || {}
            );


          showMessage(
            `👥 تعداد دوستان: ${friends.length}`
          );


          showResult(
            friends.length
              ? friends
              : "لیست دوستان خالی است."
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /06=نام
        // درخواست‌ها
        // ======================================================

        if (
          command.startsWith(
            "/06="
          )
        ) {


          const name =
            requireArgument(
              command,
              "/06=",
              "نام کاربر"
            );


          if (!name) {

            return;

          }


          const profile =
            await readProfile(
              name
            );


          if (!profile) {

            showMessage(
              "❌ این کاربر پیدا نشد."
            );

            return;

          }


          const requests =
            Object.keys(
              profile.friendRequests || {}
            );


          showMessage(
            `📨 تعداد درخواست‌ها: ${requests.length}`
          );


          showResult(
            requests.length
              ? requests
              : "درخواستی وجود ندارد."
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /07=نام
        // دعوت‌ها
        // ======================================================

        if (
          command.startsWith(
            "/07="
          )
        ) {


          const name =
            requireArgument(
              command,
              "/07=",
              "نام کاربر"
            );


          if (!name) {

            return;

          }


          const profile =
            await readProfile(
              name
            );


          if (!profile) {

            showMessage(
              "❌ این کاربر پیدا نشد."
            );

            return;

          }


          showMessage(
            "📩 دعوت‌های کاربر:"
          );


          showResult(
            profile.invites || {}
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /08=نام
        // انتقال‌ها
        // ======================================================

        if (
          command.startsWith(
            "/08="
          )
        ) {


          const name =
            requireArgument(
              command,
              "/08=",
              "نام کاربر"
            );


          if (!name) {

            return;

          }


          const profile =
            await readProfile(
              name
            );


          if (!profile) {

            showMessage(
              "❌ این کاربر پیدا نشد."
            );

            return;

          }


          showMessage(
            "💰 انتقال‌های دریافتی:"
          );


          showResult(
            profile.incomingTransfers ||
            {}
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /11
        // ساخت اتاق
        // ======================================================

        if (
          command === "/11"
        ) {


          showMessage(
            "⏳ در حال ساخت اتاق..."
          );


          const code =
            await createRoom();


          showMessage(
            `✅ اتاق ${code} ساخته شد.`
          );


          input.value =
            "";


          setTimeout(
            () => {

              window.location.href =
                "lobby.html";

            },
            700
          );


          return;

        }



        // ======================================================
        // /12=کد
        // ورود به اتاق
        // ======================================================

        if (
          command.startsWith(
            "/12="
          )
        ) {


          const code =
            requireArgument(
              command,
              "/12=",
              "کد اتاق"
            );


          if (!code) {

            return;

          }


          showMessage(
            "⏳ در حال ورود به اتاق..."
          );


          const result =
            await joinRoomByCode(
              code.toUpperCase()
            );


          if (!result.ok) {


            const messages = {

              "invalid-code":
                "❌ کد اتاق نامعتبر است.",

              "not-found":
                "❌ چنین اتاقی پیدا نشد.",

              kicked:
                "🚫 از این اتاق اخراج شده‌ای."

            };


            showMessage(

              messages[
                result.reason
              ] ||

              "❌ ورود به اتاق انجام نشد."

            );


            return;

          }


          showMessage(
            `✅ وارد اتاق ${result.code} شدی.`
          );


          input.value =
            "";


          setTimeout(
            () => {

              window.location.href =
                "lobby.html";

            },
            700
          );


          return;

        }



        // ======================================================
        // /14
        // ======================================================

        if (
          command === "/14"
        ) {


          showMessage(
            "⏳ در حال خروج از اتاق..."
          );


          await leaveLobby();


          showMessage(
            "✅ از اتاق خارج شدی."
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /15=کد
        // اطلاعات اتاق
        // ======================================================

        if (
          command.startsWith(
            "/15="
          )
        ) {


          const code =
            requireArgument(
              command,
              "/15=",
              "کد اتاق"
            );


          if (!code) {

            return;

          }


          const snap =
            await get(
              roomRef(
                code.toUpperCase()
              )
            );


          if (!snap.exists()) {

            showMessage(
              "❌ این اتاق پیدا نشد."
            );

            return;

          }


          showMessage(
            `✅ اطلاعات اتاق ${code.toUpperCase()}`
          );


          showResult(
            snap.val()
          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /16=کد
        // بازیکنان
        // ======================================================

        if (
          command.startsWith(
            "/16="
          )
        ) {


          const code =
            requireArgument(
              command,
              "/16=",
              "کد اتاق"
            );


          if (!code) {

            return;

          }


          const snap =
            await get(
              roomRef(
                code.toUpperCase(),
                "players"
              )
            );


          showMessage(
            "👥 بازیکنان اتاق:"
          );


          showResult(

            snap.exists()
              ? snap.val()
              : "بازیکنی پیدا نشد."

          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /17=کد
        // رأی‌ها
        // ======================================================

        if (
          command.startsWith(
            "/17="
          )
        ) {


          const code =
            requireArgument(
              command,
              "/17=",
              "کد اتاق"
            );


          if (!code) {

            return;

          }


          const snap =
            await get(
              roomRef(
                code.toUpperCase(),
                "votes"
              )
            );


          showMessage(
            "🗳️ رأی‌های اتاق:"
          );


          showResult(

            snap.exists()
              ? snap.val()
              : "رأیی ثبت نشده است."

          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /18=کد
        // نتایج
        // ======================================================

        if (
          command.startsWith(
            "/18="
          )
        ) {


          const code =
            requireArgument(
              command,
              "/18=",
              "کد اتاق"
            );


          if (!code) {

            return;

          }


          const snap =
            await get(
              roomRef(
                code.toUpperCase(),
                "results"
              )
            );


          showMessage(
            "🏆 نتایج بازی:"
          );


          showResult(

            snap.exists()
              ? snap.val()
              : "نتیجه‌ای ثبت نشده است."

          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /19=کد
        // بازی فعلی
        // ======================================================

        if (
          command.startsWith(
            "/19="
          )
        ) {


          const code =
            requireArgument(
              command,
              "/19=",
              "کد اتاق"
            );


          if (!code) {

            return;

          }


          const snap =
            await get(
              roomRef(
                code.toUpperCase(),
                "currentGame"
              )
            );


          showMessage(
            "🎮 وضعیت بازی فعلی:"
          );


          showResult(

            snap.exists()
              ? snap.val()
              : "بازی فعالی ثبت نشده است."

          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // /1A=کد
        // چت
        // ======================================================

        if (
          command.startsWith(
            "/1A="
          )
        ) {


          const code =
            requireArgument(
              command,
              "/1A=",
              "کد اتاق"
            );


          if (!code) {

            return;

          }


          const snap =
            await get(
              roomRef(
                code.toUpperCase(),
                "chat/messages"
              )
            );


          showMessage(
            "💬 پیام‌های چت:"
          );


          showResult(

            snap.exists()
              ? snap.val()
              : "پیامی وجود ندارد."

          );


          input.value =
            "";


          return;

        }



        // ======================================================
        // دستور نامعتبر
        // ======================================================

        showMessage(
          "❌ این دستور وجود ندارد."
        );


      }

      catch (error) {


        console.error(
          "Domito Command Error:",
          error
        );


        showMessage(
          "❌ اجرای دستور با خطا مواجه شد."
        );


        showResult(
          error?.message ||
          String(error)
        );

      }

    }



    // ==========================================================
    // اجرا با دکمه
    // ==========================================================

    runButton.addEventListener(
      "click",
      runCommand
    );



    // ==========================================================
    // اجرا با Enter
    // ==========================================================

    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          runCommand();

        }

      }
    );



    // ==========================================================
    // بازگشت
    // ==========================================================

    backButton.addEventListener(
      "click",
      () => {

        window.history.back();

      }
    );



    // ==========================================================
    // Auto Login
    // ==========================================================

    waitForUser()

      .then(
        user => {

          if (!user) {

            window.location.href =
              "index.html";

            return;

          }


          input.focus();

        }
      )

      .catch(
        error => {

          console.error(
            "Command Auth Error:",
            error
          );


          showMessage(
            "❌ بررسی حساب کاربری انجام نشد."
          );

        }
      );


  </script>

</body>

</html>
