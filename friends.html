<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>دوستان | دومیتو</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

.friend-row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.friend-name-link {
  flex: 1;
  text-decoration: none;
}

.friend-status {
  font-size: 12px;
  white-space: nowrap;
}

.friend-action {
  min-width: 95px;
}

.search-result {
  margin-top: 10px;
}

.friend-check {
  border-radius: 14px;
  padding: 12px;
  margin-top: 10px;
}

.friend-check.friend {
  background: rgba(76, 217, 123, .12);
  border: 1px solid rgba(76, 217, 123, .25);
}

.friend-check.pending {
  background: rgba(255, 200, 69, .12);
  border: 1px solid rgba(255, 200, 69, .25);
}

</style>

</head>


<body>

<div class="wrap">


  <!-- ================================================= -->
  <!-- BRAND -->
  <!-- ================================================= -->

  <div class="brand">

    <div class="brand-mark">
      👥
    </div>

    <h1>
      دوستان من
    </h1>

  </div>


  <!-- ================================================= -->
  <!-- LOGIN -->
  <!-- ================================================= -->

  <div
    class="card"
    id="noNameCard"
    style="display:none"
  >

    <p class="status-line">
      هنوز وارد نشدی.
    </p>

    <a
      href="index.html"
      class="btn btn-full"
    >
      ورود
    </a>

  </div>


  <!-- ================================================= -->
  <!-- CONTENT -->
  <!-- ================================================= -->

  <div
    id="content"
    style="display:none"
  >


    <!-- ================================================= -->
    <!-- ADD FRIEND -->
    <!-- ================================================= -->

    <div class="card">

      <h2>
        ➕ اضافه کردن دوست
      </h2>

      <input
        type="text"
        id="friendInput"
        placeholder="نام‌کاربری"
        maxlength="20"
        autocomplete="off"
      >

      <button
        id="addFriendBtn"
        class="btn-full"
      >
        ارسال درخواست دوستی
      </button>

      <div
        id="friendCheck"
        class="search-result"
        style="display:none"
      ></div>

      <p
        class="status-line"
        id="addStatus"
      ></p>

    </div>


    <!-- ================================================= -->
    <!-- REQUESTS -->
    <!-- ================================================= -->

    <div
      class="card"
      id="requestsCard"
      style="display:none"
    >

      <h2>
        📩 درخواست‌های دریافتی
      </h2>

      <div
        id="requestList"
      ></div>

    </div>


    <!-- ================================================= -->
    <!-- FRIEND LIST -->
    <!-- ================================================= -->

    <div class="card">

      <h2>

        👥 لیست دوستان

        (
        <span id="friendCount">
          0
        </span>
        )

      </h2>

      <div
        id="friendList"
      ></div>

      <p
        class="muted"
        id="noFriends"
        style="display:none"
      >
        هنوز دوستی اضافه نکردی
      </p>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- BACK -->
  <!-- ================================================= -->

  <a
    href="index.html"
    class="link-back"
  >
    ← بازگشت به خانه
  </a>

</div>


<script type="module">

import {

  getSavedName,
  waitForUser,

  sendFriendRequest,
  getFriendStatus,

  listenFriends,

  getSavedRoom,
  createRoom,
  inviteFriendToRoom,

  listenFriendRequests,
  acceptFriendRequest,
  rejectFriendRequest

} from "./js/app.js";


const noNameCard =
  document.getElementById(
    "noNameCard"
  );

const content =
  document.getElementById(
    "content"
  );

const friendInput =
  document.getElementById(
    "friendInput"
  );

const addFriendBtn =
  document.getElementById(
    "addFriendBtn"
  );

const addStatus =
  document.getElementById(
    "addStatus"
  );

const friendCheck =
  document.getElementById(
    "friendCheck"
  );


let myName = "";


// =====================================================
// بررسی نام واردشده
// =====================================================

async function checkFriendInput() {

  const targetName =
    friendInput.value.trim();


  friendCheck.style.display =
    "none";

  addStatus.textContent =
    "";

  addFriendBtn.disabled =
    false;

  addFriendBtn.textContent =
    "ارسال درخواست دوستی";


  if (!targetName) {
    return;
  }


  if (
    targetName === myName
  ) {

    addFriendBtn.disabled =
      true;

    friendCheck.style.display =
      "block";

    friendCheck.className =
      "friend-check";

    friendCheck.textContent =
      "🙂 این خودت هستی!";

    return;

  }


  try {

    const status =
      await getFriendStatus(
        myName,
        targetName
      );


    if (status.isFriend) {

      addFriendBtn.disabled =
        true;

      friendCheck.style.display =
        "block";

      friendCheck.className =
        "friend-check friend";

      friendCheck.innerHTML =
        "✅ این کاربر از قبل دوست شماست";

      return;

    }


    if (
      status.requestPending
    ) {

      addFriendBtn.disabled =
        true;

      friendCheck.style.display =
        "block";

      friendCheck.className =
        "friend-check pending";

      friendCheck.innerHTML =
        "⏳ درخواست دوستی قبلاً ارسال شده";

      return;

    }

  } catch (error) {

    console.error(
      "Friend status error:",
      error
    );

  }

}


// =====================================================
// AUTH
// =====================================================

waitForUser().then(
  (user) => {

    myName =
      getSavedName();


    if (
      !user ||
      !myName
    ) {

      noNameCard.style.display =
        "block";

      return;

    }


    content.style.display =
      "block";


    // =================================================
    // بررسی هنگام تایپ
    // =================================================

    friendInput.addEventListener(
      "input",
      () => {

        clearTimeout(
          friendInput._checkTimer
        );

        friendInput._checkTimer =
          setTimeout(
            checkFriendInput,
            300
          );

      }
    );


    // =================================================
    // ارسال درخواست
    // =================================================

    addFriendBtn.addEventListener(
      "click",
      async () => {

        const targetName =
          friendInput.value.trim();


        if (!targetName) {

          addStatus.textContent =
            "نام‌کاربری رو بنویس";

          return;

        }


        if (
          targetName === myName
        ) {

          addStatus.textContent =
            "نمی‌تونی خودتو اضافه کنی";

          return;

        }


        addFriendBtn.disabled =
          true;

        addStatus.textContent =
          "در حال ارسال...";


        try {

          const res =
            await sendFriendRequest(
              myName,
              targetName
            );


          if (res.ok) {

            addStatus.textContent =
              "✅ درخواست دوستی ارسال شد!";

            friendInput.value =
              "";

            friendCheck.style.display =
              "none";

          }

          else if (
            res.reason ===
            "not-found"
          ) {

            addStatus.textContent =
              "❌ همچین کاربری پیدا نشد";

          }

          else if (
            res.reason ===
            "already-friends"
          ) {

            addStatus.textContent =
              "✅ این کاربر از قبل دوست شماست";

          }

          else if (
            res.reason ===
            "request-pending"
          ) {

            addStatus.textContent =
              "⏳ درخواست قبلاً ارسال شده";

          }

          else {

            addStatus.textContent =
              "❌ ارسال درخواست انجام نشد";

          }


        } catch (error) {

          console.error(
            error
          );

          addStatus.textContent =
            "❌ خطا در ارسال درخواست";

        }


        await checkFriendInput();

      }
    );


    // =================================================
    // درخواست‌های دریافتی
    // =================================================

    listenFriendRequests(
      myName,
      (requesters) => {

        const card =
          document.getElementById(
            "requestsCard"
          );

        const list =
          document.getElementById(
            "requestList"
          );


        if (
          requesters.length === 0
        ) {

          card.style.display =
            "none";

          return;

        }


        card.style.display =
          "block";

        list.innerHTML =
          "";


        requesters.forEach(
          (fromName) => {

            const row =
              document.createElement(
                "div"
              );

            row.className =
              "request-row";


            row.innerHTML = `
              <span class="txt">
                👤 ${fromName}
              </span>
            `;


            const actions =
              document.createElement(
                "div"
              );

            actions.className =
              "actions";


            const acceptBtn =
              document.createElement(
                "button"
              );

            acceptBtn.textContent =
              "قبول";


            acceptBtn.addEventListener(
              "click",
              async () => {

                try {

                  await acceptFriendRequest(
                    myName,
                    fromName
                  );

                } catch (error) {

                  console.error(
                    error
                  );

                }

              }
            );


            const rejectBtn =
              document.createElement(
                "button"
              );

            rejectBtn.textContent =
              "رد";

            rejectBtn.className =
              "btn-ghost";


            rejectBtn.addEventListener(
              "click",
              async () => {

                try {

                  await rejectFriendRequest(
                    myName,
                    fromName
                  );

                } catch (error) {

                  console.error(
                    error
                  );

                }

              }
            );


            actions.appendChild(
              acceptBtn
            );

            actions.appendChild(
              rejectBtn
            );


            row.appendChild(
              actions
            );

            list.appendChild(
              row
            );

          }
        );

      }
    );


    // =================================================
    // دوستان
    // =================================================

    listenFriends(
      myName,
      (list) => {

        const friendList =
          document.getElementById(
            "friendList"
          );

        const noFriends =
          document.getElementById(
            "noFriends"
          );

        const friendCount =
          document.getElementById(
            "friendCount"
          );


        friendCount.textContent =
          list.length;


        if (
          list.length === 0
        ) {

          noFriends.style.display =
            "block";

          friendList.innerHTML =
            "";

          return;

        }


        noFriends.style.display =
          "none";

        friendList.innerHTML =
          "";


        // آنلاین‌ها اول
        list.sort(
          (a, b) => {

            if (
              a.online &&
              !b.online
            ) return -1;

            if (
              !a.online &&
              b.online
            ) return 1;

            return 0;

          }
        );


        list.forEach(
          (f) => {

            const row =
              document.createElement(
                "div"
              );

            row.className =
              "friend-row";


            const nameLink =
              document.createElement(
                "a"
              );

            nameLink.href =
              `profile.html?user=${encodeURIComponent(f.name)}`;

            nameLink.className =
              "friend-name-link";

            nameLink.textContent =
              f.name;


            row.appendChild(
              nameLink
            );


            const status =
              document.createElement(
                "span"
              );

            status.className =
              "friend-status";


            const dot =
              document.createElement(
                "span"
              );

            dot.className =
              "fdot" +
              (
                f.online
                  ? ""
                  : " off"
              );


            row.appendChild(
              dot
            );


            if (f.online) {

              status.textContent =
                "آنلاین";

              row.appendChild(
                status
              );


              const btn =
                document.createElement(
                  "button"
                );

              btn.className =
                "friend-action";

              btn.textContent =
                "دعوت به اتاق";


              btn.addEventListener(
                "click",
                async () => {

                  try {

                    btn.disabled =
                      true;

                    btn.textContent =
                      "در حال ارسال...";


                    let code =
                      getSavedRoom();


                    if (!code) {

                      code =
                        await createRoom();

                    }


                    await inviteFriendToRoom(
                      myName,
                      f.name,
                      code
                    );


                    btn.textContent =
                      "دعوت شد ✓";


                  } catch (error) {

                    console.error(
                      error
                    );

                    btn.disabled =
                      false;

                    btn.textContent =
                      "دعوت به اتاق";

                  }

                }
              );


              row.appendChild(
                btn
              );

            }

            else {

              status.textContent =
                "آفلاین";

              row.appendChild(
                status
              );

            }


            friendList.appendChild(
              row
            );

          }
        );

      }
    );

  }
);

</script>

</body>

</html>
