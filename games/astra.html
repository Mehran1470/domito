<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Domito Astra</title>
<link rel="stylesheet" href="astra.css">
</head>
<body class="astra-body">

  <div class="astra-rotate-screen" id="astraRotateScreen">
    <div class="icon">📱</div>
    <h2>گوشیتو بچرخون</h2>
    <p>Domito Astra فقط در حالت افقی (landscape) بازی می‌شه</p>
  </div>

  <div class="astra-game-root">
    <div class="astra-hud-top">
      <div class="astra-hud-player p1">
        <div class="astra-hud-name p1">🚀 <span id="p1Label">تو</span></div>
        <div class="astra-fuel-bar"><div class="astra-fuel-fill p1" id="fuelP1" style="width:0%"></div></div>
        <div class="astra-hud-sub">📦 <span id="cargoP1">0</span></div>
      </div>
      <div class="astra-hud-center">
        <div class="astra-title" id="astraModeTitle">🚀 ASTRA</div>
        <div class="astra-mode-badge" id="astraModeBadge"></div>
      </div>
      <div class="astra-hud-others" id="othersHud"></div>
    </div>

    <div class="astra-arena-box" id="astraArenaBox">
      <canvas id="astraCanvas"></canvas>
      <div class="astra-overlay-msg" id="astraOverlayMsg" style="display:none;"></div>

      <div class="astra-joystick-base left" id="astraJoyBaseP1">
        <div class="astra-joystick-knob left" id="astraJoyKnobP1"></div>
      </div>

      <button class="astra-fullscreen-btn" id="astraFullscreenBtn">⛶ تمام‌صفحه</button>
      <button class="astra-mute-btn" id="astraMuteBtn">🔊</button>
      <div class="astra-result" id="astraResult" style="display:none;"></div>
    </div>
  </div>

<script type="module" src="astra.js"></script>
</body>
</html>
