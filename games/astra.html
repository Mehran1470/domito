<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <title>دومیتو استرا</title>

  <link rel="stylesheet" href="astra.css">
</head>

<body>

  <!-- حالت عمودی -->
  <div id="rotateScreen" class="rotate-screen">
    <div class="rotate-icon">📱</div>
    <h2>گوشی را بچرخان</h2>
    <p>دومیتو استرا در حالت افقی اجرا می‌شود</p>
  </div>

  <main class="astra">

    <!-- HUD -->
    <header class="hud">

      <div class="logo">
        🚀 ASTRA
      </div>

      <div class="hud-box">
        <span>⛽</span>
        <b id="fuel">0%</b>
      </div>

      <div class="hud-box">
        <span>📦</span>
        <b id="cargo">0</b>
      </div>

      <div class="hud-box">
        <span>⚡</span>
        <b id="powerup">0</b>
      </div>

      <div class="hud-box">
        <span>👥</span>
        <b id="playerCount">1</b>
      </div>

      <div id="objective" class="objective">
        💎 منابع را جمع کن
      </div>

    </header>


    <!-- بازی -->
    <section id="arena" class="arena">

      <canvas id="canvas"></canvas>


      <!-- پیام شروع -->
      <div id="startMessage" class="start-message">
        <strong id="messageTitle">
          🚀 آماده‌ای؟
        </strong>

        <span id="messageText">
          منابع انرژی را جمع کن
        </span>
      </div>


      <!-- بازیکنان -->
      <div id="players" class="players"></div>


      <!-- جوی‌استیک -->
      <div id="joystick" class="joystick">
        <div id="knob" class="knob"></div>
      </div>


      <!-- توربو -->
      <button
        id="boost"
        class="boost"
        type="button"
      >
        ⚡
        <small>توربو</small>
      </button>


      <!-- پرتاب -->
      <button
        id="launch"
        class="launch"
        type="button"
      >
        🚀 پرتاب
      </button>


      <!-- فول‌اسکرین -->
      <button
        id="fullscreen"
        class="small-btn fullscreen"
        type="button"
      >
        ⛶
      </button>


      <!-- صدا -->
      <button
        id="mute"
        class="small-btn mute"
        type="button"
      >
        🔊
      </button>


      <!-- نتیجه -->
      <div
        id="result"
        class="result hidden"
      >

        <div id="resultIcon" class="result-icon">
          🏆
        </div>

        <h1 id="resultTitle">
          WORLD 2
        </h1>

        <p id="resultText">
          برنده شدی!
        </p>

        <div id="resultStats" class="result-stats"></div>

        <button
          id="back"
          class="back"
          type="button"
        >
          برگشت
        </button>

      </div>

    </section>

  </main>

  <script
    type="module"
    src="astra.js"
  ></script>

</body>
</html>
