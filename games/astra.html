<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Domito Astra</title>

  <link rel="stylesheet" href="astra.css">
</head>

<body class="astra-body">

  <!-- حالت عمودی -->
  <div class="astra-rotate-screen" id="astraRotateScreen">
    <div class="icon">📱</div>
    <h2>گوشیتو بچرخون</h2>
    <p>Domito Astra فقط در حالت افقی (Landscape) بازی می‌شه</p>
  </div>


  <main class="astra-game-root">

    <!-- HUD -->
    <header class="astra-hud">

      <div class="astra-brand">
        🚀 ASTRA
      </div>

      <div class="astra-mode" id="hudMode">
        تک‌نفره
      </div>

      <div class="astra-time">
        ⏱ <span id="hudTimer">--</span>
      </div>

      <div class="astra-race-title">
        RACE TO WORLD 2
      </div>

      <button
        id="astraMuteBtn"
        class="hud-button"
        type="button"
      >
        🔊
      </button>

      <button
        id="astraFullscreenBtn"
        class="hud-button"
        type="button"
      >
        ⛶
      </button>

    </header>


    <!-- اطلاعات بازیکنان -->
    <section
      class="players-hud"
      id="playersHud"
    ></section>


    <!-- Arena -->
    <section
      class="astra-arena-box"
      id="astraArenaBox"
    >

      <canvas id="astraCanvas"></canvas>


      <!-- پیام وسط -->
      <div
        class="astra-overlay-msg"
        id="astraOverlayMsg"
      >
        <div class="big">🚀 ASTRA</div>
        <div class="sub">
          در حال آماده‌سازی بازی...
        </div>
      </div>


      <!-- کنترل P1 -->
      <div
        class="astra-control p1-control"
        id="p1Control"
      >

        <div
          class="astra-joystick-base"
          id="p1JoyBase"
        >
          <div
            class="astra-joystick-knob"
            id="p1JoyKnob"
          ></div>
        </div>

        <div class="player-control-label">
          🔵 P1
        </div>

        <button
          class="action-button"
          id="p1Boost"
          type="button"
        >
          🚀
        </button>

      </div>


      <!-- کنترل P2 -->
      <div
        class="astra-control p2-control"
        id="p2Control"
      >

        <div
          class="astra-joystick-base"
          id="p2JoyBase"
        >
          <div
            class="astra-joystick-knob"
            id="p2JoyKnob"
          ></div>
        </div>

        <div class="player-control-label">
          🟣 P2
        </div>

        <button
          class="action-button"
          id="p2Boost"
          type="button"
        >
          🚀
        </button>

      </div>


      <!-- اسلات پاورآپ -->
      <div
        class="powerup-indicator"
        id="powerupIndicator"
      >
        ⚡
      </div>


      <!-- نتیجه -->
      <div
        class="astra-result"
        id="astraResult"
      ></div>

    </section>

  </main>


  <script
    type="module"
    src="astra.js"
  ></script>

</body>
</html>
