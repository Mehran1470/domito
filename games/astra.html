<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Astra | دومیتو</title>
  <link rel="stylesheet" href="astra.css">
</head>

<body class="astra-body">

  <div id="astraRotateScreen">
    <div>📱 لطفاً گوشی را افقی کنید</div>
  </div>

  <main class="astra-game-root">

    <header class="astra-hud">
      <div id="hudMode">🤖 بازی با ربات</div>
      <div id="hudTimer">03:00</div>

      <div class="hud-buttons">
        <button id="muteBtn">🔊</button>
        <button id="fullscreenBtn">⛶</button>
      </div>
    </header>

    <div id="playersHud" class="players-hud"></div>

    <section id="astraArenaBox" class="astra-arena">
      <canvas id="astraCanvas"></canvas>

      <div id="astraOverlayMsg" class="astra-overlay-msg">
        <div class="loader"></div>
        <div>در حال آماده‌سازی بازی...</div>
      </div>

      <div id="astraResult" class="astra-result hidden"></div>

      <div id="powerupIndicator" class="powerup-indicator hidden"></div>

      <div id="p1JoyBase" class="joystick">
        <div id="p1JoyKnob" class="joystick-knob"></div>
      </div>

      <button id="p1Boost" class="boost-btn">🚀</button>

      <div id="p2JoyBase" class="joystick p2">
        <div id="p2JoyKnob" class="joystick-knob"></div>
      </div>

      <button id="p2Boost" class="boost-btn p2-boost">🚀</button>
    </section>

  </main>

  <script type="module" src="astra.js"></script>
</body>
</html>
