<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Domito Astra</title>

  <link rel="stylesheet" href="astra.css">
</head>

<body class="astra-body">

  <!-- Portrait warning -->
  <div id="astraRotateScreen" class="astra-rotate-screen">
    <div class="rotate-icon">📱</div>
    <h2>گوشیتو بچرخون</h2>
    <p>
      دومیتو استرا فقط در حالت افقی بازی می‌شه
    </p>
  </div>


  <main class="astra-root">

    <!-- HUD -->
    <header class="astra-hud">

      <div class="hud-brand">
        🚀 ASTRA
      </div>

      <div class="hud-item">
        <span id="hudMode">تک‌نفره</span>
      </div>

      <div class="hud-item">
        ⛽
        <span id="hudFuel">0%</span>
      </div>

      <div class="hud-item">
        📦
        <span id="hudCargo">0</span>
      </div>

      <div class="hud-item">
        👥
        <span id="hudPlayers">1</span>
      </div>

      <div class="hud-item objective">
        <span id="hudObjective">
          منابع رو جمع کن
        </span>
      </div>

    </header>


    <!-- Arena -->
    <section
      id="astraArena"
      class="astra-arena"
    >

      <canvas id="astraCanvas"></canvas>


      <!-- Center message -->
      <div
        id="astraMessage"
        class="astra-message"
      >
        <div class="message-title">
          🚀 آماده‌ای؟
        </div>

        <div
          id="messageSub"
          class="message-sub"
        >
          منابع فضایی رو جمع کن
        </div>
      </div>


      <!-- Joystick -->
      <div
        id="joyBase"
        class="joystick"
      >
        <div
          id="joyKnob"
          class="joystick-knob"
        ></div>
      </div>


      <!-- Turbo -->
      <button
        id="boostButton"
        class="boost-button"
        type="button"
      >
        ⚡
        <span>توربو</span>
      </button>


      <!-- Launch -->
      <button
        id="launchButton"
        class="launch-button"
        type="button"
      >
        🚀 پرتاب
      </button>


      <!-- Fullscreen -->
      <button
        id="fullscreenButton"
        class="small-button fullscreen-button"
        type="button"
      >
        ⛶
      </button>


      <!-- Mute -->
      <button
        id="muteButton"
        class="small-button mute-button"
        type="button"
      >
        🔊
      </button>


      <!-- Players panel -->
      <div
        id="playersPanel"
        class="players-panel"
      ></div>


      <!-- Result -->
      <div
        id="resultScreen"
        class="result-screen hidden"
      >

        <div
          id="resultIcon"
          class="result-icon"
        >
          🏆
        </div>

        <div
          id="resultTitle"
          class="result-title"
        >
          World 2
        </div>

        <div
          id="resultText"
          class="result-text"
        >
          برنده شدی!
        </div>

        <div
          id="resultStats"
          class="result-stats"
        ></div>

        <button
          id="backButton"
          class="result-button"
          type="button"
        >
          برگشت
        </button>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="astra.js"
  ></script>

</body>
</html>
