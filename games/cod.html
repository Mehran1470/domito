<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>خط مقدم — FPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Tahoma,system-ui,sans-serif}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.hud{position:fixed;pointer-events:none;font-weight:700;text-shadow:0 1px 4px #000,0 0 2px #000}
#scope{inset:0;opacity:0;transition:opacity .08s;background:radial-gradient(circle at center,transparent 0,transparent 38vmin,#000 38.4vmin)}
#scope:before,#scope:after{content:"";position:absolute;background:#000}
#scope:before{left:50%;top:calc(50% - 38vmin);height:76vmin;width:1.5px;margin-left:-.75px}
#scope:after{top:50%;left:calc(50% - 38vmin);width:76vmin;height:1.5px;margin-top:-.75px}
#vig{inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#dmg{inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(200,0,0,.75))}
#ind{left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;opacity:0}
#ind:before{content:"";position:absolute;left:50%;top:0;width:120px;height:34px;margin-left:-60px;background:radial-gradient(ellipse at 50% 0%,rgba(255,30,30,.95),transparent 70%)}
.ch{position:fixed;left:50%;top:50%;background:#fff;opacity:.9;box-shadow:0 0 2px #000;pointer-events:none}
#hm{left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0}
#hm:before,#hm:after{content:"";position:absolute;left:12px;top:0;width:2px;height:26px;background:#fff;box-shadow:0 0 2px #000}
#hm:before{transform:rotate(45deg)}#hm:after{transform:rotate(-45deg)}
#hm.k:before,#hm.k:after{background:#f33}
#mm{top:10px;left:10px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}
#top{top:10px;left:50%;transform:translateX(-50%);text-align:center;font-size:14px}
#top b{font-size:20px}
#hp{left:14px;bottom:14px;width:210px}
#hpb{height:10px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);border-radius:5px;overflow:hidden;margin-top:3px}
#hpf{height:100%;width:100%;background:#5f5;transition:background .2s}
#ammo{right:18px;bottom:14px;text-align:right;direction:ltr}
#ammo .n{font-size:40px;line-height:1}#ammo .r{font-size:20px;opacity:.7}#ammo .w{font-size:13px;opacity:.85}
#kf{top:150px;left:10px;font-size:13px;display:flex;flex-direction:column;gap:3px}
#kf div{background:rgba(0,0,0,.45);padding:2px 8px;border-radius:4px;animation:f .3s}
@keyframes f{from{opacity:0;transform:translateX(-10px)}}
#banner{left:0;right:0;top:20%;text-align:center;font-size:44px;opacity:0;transition:opacity .5s;color:#ffb347}
#banner small{display:block;font-size:16px;color:#fff}
#ov{position:fixed;inset:0;background:rgba(5,8,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;z-index:50;padding:16px}
#ov h1{font-size:34px;color:#ffb347;letter-spacing:1px}
#ov p{font-size:13px;opacity:.85;line-height:2;max-width:480px}
#go{font-size:20px;padding:12px 44px;border:0;border-radius:10px;background:#e8501e;color:#fff;font-weight:700;margin-top:6px}
#go:disabled{opacity:.4}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#000;align-items:center;justify-content:center;font-size:18px;text-align:center;padding:30px}
.t{display:none}
.mobile .t{display:block}
.mobile .b,.editing .b{display:flex}
.editing .t{display:block}
.editing #tL,.editing #tR{display:none}
.editing .b,.editing #jb{pointer-events:auto;cursor:move;outline:2px dashed rgba(255,255,255,.6)}
.editing #jb{opacity:.85}
.sel{outline:3px solid #ffb347 !important}
#ed{display:none;position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:60;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:94vw;background:rgba(0,0,0,.78);padding:8px 12px;border-radius:10px;font-size:12px}
#ed input{width:110px}
#ed button,#edb,#stb,#exb{border:0;border-radius:8px;padding:8px 14px;background:#e8501e;color:#fff;font-weight:700;font-size:14px}
#edb,#stb,#exb{background:#334a63;margin-top:2px}
#exb{display:none}
#tL,#tR{position:fixed;top:0;bottom:0;z-index:5}
#tL{left:0;width:42%}#tR{right:0;width:58%}
#jb{position:fixed;width:110px;height:110px;margin:-55px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);z-index:6;pointer-events:none;opacity:.5}
#jk{position:absolute;left:31px;top:31px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.4)}
.b{position:fixed;z-index:8;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;text-align:center}
#bF{right:26px;bottom:34px;width:88px;height:88px;background:rgba(255,70,50,.35);font-size:15px}
#bA{right:128px;bottom:96px;width:62px;height:62px}
#bR{right:132px;bottom:22px;width:56px;height:56px}
#bG{right:22px;bottom:138px;width:56px;height:56px}
#bJ{right:206px;bottom:30px;width:52px;height:52px}
#bW{right:22px;bottom:206px;width:50px;height:50px}
#bC{right:206px;bottom:92px;width:50px;height:50px}
.b.on{background:rgba(255,179,71,.4);border-color:#ffb347}
#fps{left:240px;top:18px;font-size:12px;display:none;color:#8f8}
#st{display:none;position:fixed;inset:0;z-index:70;background:rgba(5,8,12,.95);align-items:center;justify-content:center;padding:10px}
#st .bx{width:min(460px,96vw);display:flex;flex-direction:column;gap:9px;font-size:13px}
#st h2{font-size:20px;color:#ffb347;text-align:center}
#st .rw{display:flex;align-items:center;justify-content:space-between;gap:10px}
#st .sg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#st button{padding:8px 12px;border-radius:9px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:700}
#st button.on{border-color:#ffb347;background:rgba(255,179,71,.28)}
#st input[type=range]{width:170px}
#stc{background:#e8501e !important;border:0 !important}
#nq{display:none;position:fixed;inset:0;z-index:75;background:rgba(5,8,12,.95);align-items:center;justify-content:center;padding:10px}
#nq,#nq *{touch-action:pan-y}
#nq .bx{width:min(460px,96vw);max-height:96vh;overflow:auto;display:flex;flex-direction:column;gap:10px;text-align:center}
#nq h2{font-size:22px;color:#ffb347}
#nq p{font-size:13px;opacity:.85}
#nqb{display:flex;flex-direction:column;gap:8px}
#nqb button{padding:14px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-weight:700}
#shop{display:none;position:fixed;inset:0;z-index:65;background:rgba(5,8,12,.93);align-items:center;justify-content:center;padding:8px}
#shop,#shop *{touch-action:pan-y}
#shop .bx{width:min(560px,98vw);max-height:98vh;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
#shop h2{font-size:20px;color:#ffb347}
#shopc{font-size:18px;font-weight:700;color:#ffd75e}
#shopg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;overflow:auto}
#shopg .it{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;padding:8px 4px;min-height:84px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:13px}
#shopg .it small{font-size:11px;opacity:.8}
#shopg .it span{font-weight:700;color:#ffd75e;margin-top:2px}
#shopg .it.dis{opacity:.4}
#shopgo{font-size:18px;padding:10px 40px;border:0;border-radius:10px;background:#e8501e;color:#fff;font-weight:700}
.mobile #ammo{bottom:auto;top:10px;right:14px}
.mobile #hp{width:150px;bottom:10px}
body.rot{position:fixed;transform:rotate(90deg);transform-origin:0 0}
#gear{left:150px;top:10px;width:38px;height:38px;font-size:18px;opacity:.75}
.editing #gear,.editing #mapb{display:none !important}
body:not(.mobile):not(.editing) .t{display:none !important}
#mapb{left:196px;top:10px;width:38px;height:38px;font-size:18px;opacity:.75}
#maps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:540px}
#maps button{padding:9px 14px;border-radius:9px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:14px;font-weight:700}
#maps button.on{border-color:#ffb347;background:rgba(255,179,71,.28)}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud" id="vig"></div>
<div class="hud" id="scope"></div>
<div class="hud" id="dmg"></div>
<div class="hud" id="ind"></div>
<div id="cross"><div class="ch" id="c1"></div><div class="ch" id="c2"></div><div class="ch" id="c3"></div><div class="ch" id="c4"></div><div class="ch" id="c5" style="width:3px;height:3px;margin:-1px"></div></div>
<div class="hud" id="hm"></div>
<canvas class="hud" id="mm" width="130" height="130"></canvas>
<div class="hud" id="top"></div>
<div class="hud" id="kf"></div>
<div class="hud" id="hp"><span id="hpt"></span><div id="hpb"><div id="hpf"></div></div></div>
<div class="hud" id="ammo"><div class="w" id="aw"></div><span class="n" id="am"></span> <span class="r" id="ar"></span><div id="ag"></div></div>
<div class="hud" id="banner"></div>
<div class="hud" id="fps"></div>

<div class="t" id="tL"></div><div class="t" id="tR"></div>

<div class="t b" id="bF">آتش</div>

<div class="hud" id="hint" style="left:0;right:0;bottom:28%;text-align:center;font-size:18px;display:none">🖱 برای قفل شدن ماوس کلیک کن</div>

<div id="rot">گوشی را افقی بگیر 🔄</div>
<div id="ed"><span>دکمه‌ها را بکش • برای تغییر اندازه، روی دکمه بزن</span><input type="range" id="eds" min="60" max="170" value="100" disabled><button id="edr">ریست</button><button id="edo">ذخیره</button></div>
<div id="nq"><div class="bx"><h2 id="nqh"></h2><p id="nqp"></p><div id="nqb"></div></div></div>
<div id="shop"><div class="bx"><h2>🛒 فروشگاه</h2><div id="shopc"></div><div id="shopg"></div><button id="shopgo">موج بعدی ▶</button></div></div>
<div id="st"><div class="bx"><h2>⚙ تنظیمات</h2>
<div class="rw"><span>حساسیت نشانه‌گیری <b id="sSv"></b></span><input type="range" id="sSens" min="40" max="220" step="5"></div>
<div class="rw"><span>کیفیت گرافیک</span><div class="sg" id="sQ"><button data-q="0">کم</button><button data-q="1">متوسط</button><button data-q="2">زیاد</button></div></div>
<div class="rw"><span>لرزش (ویبره)</span><div class="sg"><button id="sVib"></button></div></div>
<div class="rw"><span>کمک‌نشانه (لمسی)</span><div class="sg"><button id="sAim"></button></div></div>

<div class="rw"><button id="sEd">✎ چیدمان دکمه‌ها</button><button id="stc">بستن</button></div>
</div></div>

<script>
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
(async()=>{
 const urls=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];
 for(const u of urls){try{await loadScript(u);if(window.THREE)break}catch(e){}}
 const t=document.getElementById('ovt');
 if(!window.THREE){t.textContent='بارگذاری کتابخانه ناموفق بود. اینترنت را بررسی کن و صفحه را رفرش کن.';return}
 try{main()}catch(err){t.textContent='خطا: '+err.message;console.error(err)}
})();

function main(){
const T=THREE,$=id=>document.getElementById(id);
const mobile=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
document.body.classList.toggle('mobile',mobile);
// چرخش خودکار: اگر گوشی عمودی بود، کل بازی خودش افقی می‌شود
let rot=false;
const VW=()=>rot?innerHeight:innerWidth,VH=()=>rot?innerWidth:innerHeight;
const pt=t=>rot?{x:t.clientY,y:innerWidth-t.clientX}:{x:t.clientX,y:t.clientY};
function fitRot(){rot=mobile&&innerHeight>innerWidth;document.body.classList.toggle('rot',rot);const s=document.body.style;if(rot){s.width=innerHeight+'px';s.height=innerWidth+'px';s.left=innerWidth+'px';s.top='0px'}else{s.width=s.height=s.left=s.top=''}}
fitRot();
const R=(a,b)=>a+Math.random()*(b-a);
const norm=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// ---------- تنظیمات کاربر ----------
const cfg=Object.assign({sens:1,q:2,vib:true,aim:true,fps:false},(()=>{try{return JSON.parse(localStorage.getItem('cfg')||'{}')||{}}catch(e){return{}}})());
if(!(cfg.q>=0&&cfg.q<=2))cfg.q=2;cfg.sens=clamp(+cfg.sens||1,.4,2.2);
const QUAL=[{pr:.7,shadow:false,smap:512,weather:.3},{pr:1,shadow:true,smap:1024,weather:.6},{pr:mobile?1.5:2,shadow:true,smap:mobile?1024:2048,weather:1}];

// ---------- renderer / scene ----------
const renderer=new T.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,QUAL[cfg.q].pr));
renderer.setSize(VW(),VH());
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
$('game').appendChild(renderer.domElement);
const scene=new T.Scene();
scene.fog=new T.Fog(0xaec4d4,28,120);
const camera=new T.PerspectiveCamera(75,VW()/VH(),.05,400);
camera.rotation.order='YXZ';scene.add(camera);
const hemi=new T.HemisphereLight(0xcfe3ff,0x6b5d4a,.95);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff1d6,1.15);sun.position.set(30,50,20);sun.castShadow=QUAL[cfg.q].shadow;
sun.shadow.mapSize.set(QUAL[cfg.q].smap,QUAL[cfg.q].smap);
Object.assign(sun.shadow.camera,{left:-42,right:42,top:42,bottom:-42,near:1,far:220});sun.shadow.bias=-.0005;sun.shadow.normalBias=.04;scene.add(sun);
// چراغ‌قوهٔ بازیکن (نقشهٔ شب)
const torch=new T.SpotLight(0xfff0d0,0,48,.55,.6,1.2);camera.add(torch);
{const tt=new T.Object3D();tt.position.set(0,0,-6);camera.add(tt);torch.target=tt}
let torchOn=true;
function applyTorch(){torch.intensity=(MAP&&MAP.torch&&torchOn)?MAP.torch:0}

// ---------- sky ----------
const skyC=document.createElement('canvas');skyC.width=2;skyC.height=256;
const skyT=new T.CanvasTexture(skyC);
const sky=new T.Mesh(new T.SphereGeometry(250,16,16),new T.MeshBasicMaterial({map:skyT,side:T.BackSide,fog:false,depthWrite:false,toneMapped:false}));sky.renderOrder=-10;scene.add(sky);
const skyDeco=new T.Group();sky.add(skyDeco);let cloudGrp=null;
// بازتاب آسمان روی فلزها (اسلحه، کانتینر، شیشه)
const ENVM=[];const E=(m,i)=>{m.envMapIntensity=i===undefined?.8:i;ENVM.push(m);return m};
let envRT=null;const envScene=new T.Scene();envScene.add(new T.Mesh(new T.SphereGeometry(10,16,16),sky.material));
function updateEnv(){try{const pm=new T.PMREMGenerator(renderer),rt=pm.fromScene(envScene,0,.1,100);pm.dispose();if(envRT)envRT.dispose();envRT=rt;ENVM.forEach(m=>{m.envMap=rt.texture;m.needsUpdate=true})}catch(e){console.warn('env',e)}}
function paintSky(st){const x=skyC.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,st[0]);g.addColorStop(.28,st[1]);g.addColorStop(.5,st[2]);g.addColorStop(1,st[2]);x.fillStyle=g;x.fillRect(0,0,2,256);skyT.needsUpdate=true}
function glowTex(stops){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)}
const cloudTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');for(let i=0;i<16;i++){const cx=R(50,206),cy=R(44,84),r=R(24,48),g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,256,128)}return new T.CanvasTexture(c)})();
const sunTex=glowTex([[0,'rgba(255,255,240,1)'],[.1,'rgba(255,236,172,.95)'],[.35,'rgba(255,190,100,.28)'],[1,'rgba(255,170,70,0)']]);
const moonTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,10,64,64,64);g.addColorStop(0,'rgba(190,210,255,.5)');g.addColorStop(1,'rgba(120,150,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);x.fillStyle='#eef3ff';x.beginPath();x.arc(64,64,12,0,7);x.fill();return new T.CanvasTexture(c)})();
function buildSky(m){
 while(skyDeco.children.length)skyDeco.remove(skyDeco.children[0]);
 cloudGrp=new T.Group();skyDeco.add(cloudGrp);
 const c=m.clouds;
 if(c)for(let i=0;i<c.n;i++){const a=R(0,6.28),e=R(.12,.75),r=225,s=new T.Sprite(new T.SpriteMaterial({map:cloudTex,color:c.col,transparent:true,opacity:c.op*R(.6,1),fog:false,depthWrite:false,toneMapped:false}));
  s.position.set(r*Math.cos(e)*Math.sin(a),r*Math.sin(e),r*Math.cos(e)*Math.cos(a));s.scale.set(R(110,190),R(40,70),1);s.frustumCulled=false;cloudGrp.add(s)}
 if(m.glow){const g=new T.Sprite(new T.SpriteMaterial({map:m.glow.moon?moonTex:sunTex,blending:T.AdditiveBlending,transparent:true,depthWrite:false,fog:false,toneMapped:false}));
  g.position.copy(sun.position).normalize().multiplyScalar(235);g.scale.setScalar(m.glow.size);g.frustumCulled=false;skyDeco.add(g)}
 if(m.stars){const p=new Float32Array(350*3);for(let i=0;i<350;i++){const a=R(0,6.28),e=Math.asin(R(.04,1)),r=240;p[i*3]=r*Math.cos(e)*Math.sin(a);p[i*3+1]=r*Math.sin(e);p[i*3+2]=r*Math.cos(e)*Math.cos(a)}
  const gg=new T.BufferGeometry();gg.setAttribute('position',new T.BufferAttribute(p,3));const pts=new T.Points(gg,new T.PointsMaterial({size:1.7,sizeAttenuation:false,color:0xffffff,transparent:true,opacity:.85,fog:false,depthWrite:false,toneMapped:false}));pts.frustumCulled=false;skyDeco.add(pts)}
}

// ---------- weather (برف / گرد و غبار) ----------
const WN=520,wGeo=new T.BufferGeometry(),wPos=new Float32Array(WN*3);
wGeo.setAttribute('position',new T.BufferAttribute(wPos,3));

function pushOut(p,r,y){
 for(const b of boxes){
  if(y>=b.h-.05)continue;
  const cx=clamp(p.x,b.minx,b.maxx),cz=clamp(p.z,b.minz,b.maxz),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
  if(d2<r*r){
   if(d2>1e-8){const d=Math.sqrt(d2),k=(r-d)/d;p.x+=dx*k;p.z+=dz*k}
   else{const l=p.x-b.minx,rr=b.maxx-p.x,t=p.z-b.minz,bt=b.maxz-p.z,m=Math.min(l,rr,t,bt);
    if(m===l)p.x=b.minx-r;else if(m===rr)p.x=b.maxx+r;else if(m===t)p.z=b.minz-r;else p.z=b.maxz+r}
  }
 }
}

function rayBox(ox,oy,oz,dx,dy,dz,x0,y0,z0,x1,y1,z1){
 let tmin=0,tmax=1e9;
 const o=[ox,oy,oz],d=[dx,dy,dz],lo=[x0,y0,z0],hi=[x1,y1,z1];
 for(let i=0;i<3;i++){
  if(Math.abs(d[i])<1e-9){if(o[i]<lo[i]||o[i]>hi[i])return 1e9}
  else{let a=(lo[i]-o[i])/d[i],b=(hi[i]-o[i])/d[i];if(a>b){const t=a;a=b;b=t}if(a>tmin)tmin=a;if(b<tmax)tmax=b;if(tmin>tmax)return 1e9}
 }

}

const tp={x:0,z:0};
function update(dt){
 time+=dt;shootCd-=dt;lastHurt+=dt;swapT=Math.max(0,swapT-dt);
 // movement
 let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x;
 const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
 if(prot>0)prot-=dt;
 if(dead){f=0;s=0;inp.fire=false;respT-=dt;const sec=Math.ceil(respT);if(sec!==lastSec&&sec>0){lastSec=sec;banner('💀 کشته شدی','بازگشت تا '+sec+' ثانیه')}if(respT<=0)respawn()}
 const adsWant=(inp.ads||adsTog)&&relT<=0;
 const spr=(keys.ShiftLeft||keys.ShiftRight||joy.sprint)&&f>.3&&!adsWant&&!inp.fire;
 if(spr)crouch=false;crouchT+=((crouch?1:0)-crouchT)*Math.min(1,10*dt);
 const speed=(spr?6.6:(adsT>.5?2.4:4.3))*(1-crouchT*.42);
 const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
 const tvx=(fx*f+rx*s)*speed,tvz=(fz*f+rz*s)*speed,k=Math.min(1,(onGround?12:2.5)*dt);
 vx+=(tvx-vx)*k;vz+=(tvz-vz)*k;
 tp.x=px+vx*dt;tp.z=pz+vz*dt;pushOut(tp,.4,py);px=tp.x;pz=tp.z;
 if((keys.Space)&&onGround&&!dead){crouch=false;vy=6.2;onGround=false}
 vy-=18*dt;py+=vy*dt;const gy=groundAt(px,pz,py);if(py<=gy){py=gy;vy=0;onGround=true}else onGround=false;
 const mvSp=Math.hypot(vx,vz);if(onGround)bobT+=mvSp*dt*1.4;
 sprintT+=((spr?1:0)-sprintT)*Math.min(1,10*dt);
 adsT+=((adsWant&&!spr?1:0)-adsT)*Math.min(1,12*dt);
 // aim / recoil
 const rd=rec*5*dt;pitch-=rd;rec-=rd;pitch=clamp(pitch,-1.45,1.45);
 // fire
 if(inp.fire&&(W().auto||!firedThis)){shoot();if(!W().auto)firedThis=true}
 if(!inp.fire)firedThis=false;
 // کمک‌نشانه (فقط لمسی): کند شدن نشانه‌گیری روی دشمن + کشش ملایم هنگام شلیک
 aimSlow=1;
 if(mobile&&cfg.aim){const cp0=Math.cos(pitch);let bd=9,bst=null;
  for(const e of (NET.on?enemies.concat(hostileRemotes()):enemies)){if(!e.alive||!e.los)continue;const ddx=e.x-px,ddz=e.z-pz,hd=Math.hypot(ddx,ddz);if(hd>70||hd<1)continue;
   const aty=norm(Math.atan2(-ddx,-ddz)-yaw),atp=Math.atan2(1.15*e.sc+(e.y||0)-(py+1.65-crouchT*.6),hd)-pitch,ang=Math.hypot(aty*cp0,atp),lim=Math.atan(.7/hd)+.045;
   if(ang<lim&&ang<bd){bd=ang;bst={y:aty,p:atp}}}

  if(!ready&&sa<30000)return;
  if(ids.length<expectedN&&sa<20000)return;
  decided=true;
  const rec=ids.map(i=>({uid:i,name:L[i].name||'؟',team:L[i].team}));
  const d=decideMatch(SU,rec),N=rec.length,players={};
  rec.forEach((x,i)=>{players[x.uid]={n:String(x.name).slice(0,18),t:d.teams[x.uid],i}});
  const target=d.mode==='duel'?10:d.mode==='tdm'?10+N*3:0;
  FBX.set(B('match'),{host:uid,mode:d.mode,map:SU.map|0,seed:(Math.random()*2147483647)|0,target,t0:FBX.serverTimestamp(),players}).catch(()=>{})}
 function startNet(m){
  started=true;clearInterval(poll);
  const me=m.players&&m.players[uid];if(!me){startOffline();return}
  Object.assign(NET,{mode:m.mode,host:m.host===uid,hostUid:m.host,n:Object.keys(m.players).length,idx:me.i,team:me.t,seed:m.seed|0,target:m.target|0,info:m.players,t0:m.t0||nowS(),finished:false,overSent:false});
  NET.teamList=[...new Set(Object.values(m.players).map(p=>p.t))].sort();
  mapIdx=m.map|0;
  $('nq').style.display='none';$('maps').style.display='none';$('exb').style.display='inline-block';$('exb').onclick=exitToLobby;
  if(NET.mode==='coop')$('shopgo').textContent='بستن ▶';
  buildMap(mapIdx);resetGame();state='play';$('ov').style.display='none';
  NET.live=true;
  if(NET.host)hostUpload();
  const pl=B('players'),upd=x=>upsertRemote(x.key,x.val());
  FBX.onChildAdded(pl,upd);FBX.onChildChanged(pl,upd);FBX.onChildRemoved(pl,x=>removeRemote(x.key));
  FBX.onDisconnect(B('players/'+uid)).remove();FBX.onDisconnect(B('events/'+uid)).remove();
  FBX.onChildAdded(B('events/'+uid),x=>{const v=x.val()||{};FBX.remove(x.ref).catch(()=>{});netEvent(v)});
  FBX.onValue(B('scores'),s=>{NET.scores=s.val()||{};if(NET.host&&pvpMode()&&!NET.overSent)for(const k of Object.keys(NET.scores))if(NET.scores[k]>=NET.target){netOver({team:k});break}});
  FBX.onValue(B('over'),s=>{const o=s.val();if(o&&!NET.finished)endNet(o)});
  FBX.onChildAdded(B('fx'),x=>{const v=x.val()||{};if(v.by===uid||(v.at||0)<NET.t0-1500)return;explode(+v.x,+v.y,+v.z,true)});
  FBX.onChildAdded(FBX.query(B('feed'),FBX.limitToLast(4)),x=>{const v=x.val()||{};if(v.t&&(v.at||0)>=NET.t0-1500)feed(v.t)});
  if(NET.mode==='coop'){
   FBX.onValue(B('bots'),botSync);FBX.onValue(B('coop'),coopSync);
   if(NET.host)FBX.onChildAdded(B('botHits'),x=>{const v=x.val()||{};FBX.remove(x.ref).catch(()=>{});const e=enemies.find(q=>!q.mir&&String(q.id)===String(v.id));if(e&&e.alive)damageEnemy(e,Math.min(400,+v.d||0),!!v.h,v.by)})}
  setInterval(netTick,100);sendMe()}
 FBX.onValue(B('lobby'),s=>{L=s.val()||{};if(!started){renderNQ();tryDecide()}});
 FBX.onValue(B('setup'),s=>{SU=s.val();if(!started){renderNQ();tryDecide()}});
 FBX.onValue(B('match'),s=>{const m=s.val();if(m&&!started)startNet(m)});
 poll=setInterval(tryDecide,1000);
 renderNQ();
 return true}

}
shopG.onclick=e=>{const b=e.target.closest('button');if(!b)return;const it=SHOP[+b.dataset.i];if(!it||!sOk(it))return;const c=it.c();if(cash<c){sfx.hurt();return}cash-=c;sBuy(it);sfx.kill();vib(15);renderShop()};
