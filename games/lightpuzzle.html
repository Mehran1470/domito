function loadSoloSave(){

  try{

    const raw =
      localStorage.getItem("lightPuzzleV3");

    if(!raw) return;

    const d =
      JSON.parse(raw);

    unlocked =
      Number(d.unlocked || 1);

    completed =
      d.completed || {};

    bestStars =
      d.bestStars || {};

    for(let i=0;i<LEVELS.length;i++){

      if(completed[i]){
        unlocked =
          Math.max(
            unlocked,
            i + 2
          );
      }

    }

  }catch(e){

    console.warn(
      "light puzzle save error",
      e
    );

  }

}

/* =========================================================
   AUDIO
========================================================= */

function beep(freq,dur,type,vol){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    o.type =
      type || "sine";

    o.frequency.value =
      freq;

    g.gain.value =
      vol || .08;

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();

    g.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime +
      (dur || .12)
    );

    o.stop(
      audioCtx.currentTime +
      (dur || .12) +
      .02
    );

  }catch(e){}

}

function starsFor(
  used,
  par
){

  if(
    used <= par
  ){
    return 3;
  }

  if(
    used <= par + 2
  ){
    return 2;
  }

  return 1;
}

   LOAD LEVEL
========================================================= */

function cloneLevelTargets(
  targets
){

  return targets.map(
    t=>({
      ...t,
      lit:false
    })
  );

}

function loadLevel(
  idx,
  externalState = null
){

  if(
    idx < 0 ||
    idx >= ACTIVE_LEVELS.length
  ){
    return;
  }

  currentLevel =
    idx;

  const lv =
    ACTIVE_LEVELS[idx];

  history = [];
  selectedPiece = null;
  isDragging = false;
  dragStart = null;
  won = false;
  particles = [];

  hideWin();

  inventory =
    Object.assign(
      {},
      lv.inventory
    );

  pieces = [];

  currentTool =
    Object.keys(
      inventory
    ).find(
      k=>inventory[k] > 0
    ) || "mirror";

  /*
    در حالت spectator:
    state از Firebase می‌آید.
  */
  if(
    externalState &&
    Array.isArray(
      externalState.pieces
    )
  ){

    pieces =
      JSON.parse(
        JSON.stringify(
          externalState.pieces
        )
      );

    inventory =
      Object.assign(
        {},
        lv.inventory,
        externalState.inventory || {}
      );

  }

  buildToolbar();
  updateLevelUI();

}

/* =========================================================
   POSITION
========================================================= */

function getPos(e){

  const rect =
    canvas.getBoundingClientRect();

  let cx,cy;

  if(
    e.touches &&
    e.touches[0]
  ){

    cx =
      e.touches[0].clientX;

    cy =
      e.touches[0].clientY;

  }else if(
    e.changedTouches &&
    e.changedTouches[0]
  ){

    cx =
      e.changedTouches[0].clientX;

    cy =
      e.changedTouches[0].clientY;

  }else{

    cx =
      e.clientX;

    cy =
      e.clientY;

  }

  return {
    x:
      (cx - rect.left) *
      (W / rect.width),

    y:
      (cy - rect.top) *
      (H / rect.height)
  };

}

function findPieceAt(
  x,
  y,
  r=38
){

  for(
    let i=pieces.length-1;
    i>=0;
    i--
  ){

    const p =
      pieces[i];

    if(
      Math.hypot(
        x-p.x,
        y-p.y
      ) < r
    ){
      return i;
    }

  }

  return -1;

}

function onDown(e){

  if(
    won ||
    readOnly
  ){
    return;
  }

  e.preventDefault();

  const pos =
    getPos(e);

  const idx =
    findPieceAt(
      pos.x,
      pos.y
    );

  if(idx !== -1){

    selectedPiece =
      pieces[idx];

    isDragging = true;

    dragStart = {
      x:pos.x,
      y:pos.y,
      px:selectedPiece.x,
      py:selectedPiece.y,
      ox:selectedPiece.x,
      oy:selectedPiece.y
    };

    longPressTimer =
      setTimeout(
        ()=>{

          if(
            selectedPiece &&
            isDragging
          ){

            history.push({
              action:"delete",
              piece:selectedPiece
            });

            inventory[
              selectedPiece.type
            ] =
              (
                inventory[
                  selectedPiece.type
                ] || 0
              ) + 1;

            pieces.splice(
              pieces.indexOf(
                selectedPiece
              ),
              1
            );

            selectedPiece =
              null;

            isDragging =
              false;

            buildToolbar();
            updateCounts();
            syncGameState();

            if(
              navigator.vibrate
            ){
              navigator.vibrate(25);
            }

          }

        },
        550
      );

  }else if(
    (inventory[currentTool] || 0) > 0
  ){

    const p = {
      type:currentTool,
      x:pos.x,
      y:pos.y,
      angle:0
    };

    pieces.push(p);

    inventory[currentTool]--;

    history.push({
      action:"place",
      piece:p
    });

    selectedPiece =
      p;

    isDragging =
      true;

    dragStart = {
      x:pos.x,
      y:pos.y,
      px:p.x,
      py:p.y,
      ox:p.x,
      oy:p.y
    };

    buildToolbar();
    updateCounts();

    sfxPlace();

  }

}

function onMove(e){

  if(
    !isDragging ||
    !selectedPiece ||
    !dragStart ||
    readOnly
  ){
    return;
  }

  e.preventDefault();

  if(longPressTimer){

    clearTimeout(
      longPressTimer
    );

    longPressTimer =
      null;

  }

  const pos =
    getPos(e);

  selectedPiece.x =
    Math.max(
      28,
      Math.min(
        W-28,
        dragStart.px +
        (pos.x-dragStart.x)
      )
    );

  selectedPiece.y =
    Math.max(
      28,
      Math.min(
        H-28,
        dragStart.py +
        (pos.y-dragStart.y)
      )
    );

}

function onUp(e){

  e.preventDefault();

  if(longPressTimer){

    clearTimeout(
      longPressTimer
    );

    longPressTimer =
      null;

  }

  if(
    isDragging &&
    selectedPiece &&
    dragStart &&
    !readOnly
  ){

    const pos =
      getPos(e);

    const dx =
      pos.x-dragStart.x;

    const dy =
      pos.y-dragStart.y;

    if(
      Math.hypot(dx,dy)<14
    ){

      history.push({
        action:"rotate",
        piece:selectedPiece,
        oldAngle:selectedPiece.angle
      });

      selectedPiece.angle =
        (
          selectedPiece.angle +
          15
        ) % 360;

      sfxRotate();

    }else if(
      Math.hypot(
        selectedPiece.x-dragStart.ox,
        selectedPiece.y-dragStart.oy
      ) > 8
    ){

      history.push({
        action:"move",
        piece:selectedPiece,
        ox:dragStart.ox,
        oy:dragStart.oy
      });

    }

    syncGameState();

  }

  isDragging = false;
  dragStart = null;

}

/* =========================================================
   RAY ENGINE
========================================================= */

function normalize(v){

  const l =
    Math.hypot(
      v.x,
      v.y
    ) || 1;

  return {
    x:v.x/l,
    y:v.y/l
  };

}

function reflect(
  dir,
  n
){

  const d =
    dir.x*n.x +
    dir.y*n.y;

  return {
    x:
      dir.x -
      2*d*n.x,

    y:
      dir.y -
      2*d*n.y
  };

}

function hitWalls(
  pos,
  d,
  closestT
){

  const lv =
    ACTIVE_LEVELS[
      currentLevel
    ];

  let hit = null;

  for(
    const w of lv.walls
  ){

    if(d.x > .01){

      const t =
        (w.x-pos.x)/d.x;

      if(
        t>.5 &&
        t<closestT
      ){

        const hy =
          pos.y+d.y*t;

        if(
          hy>=w.y &&
          hy<=w.y+w.h
        ){

          closestT=t;

          hit={
            t,
            normal:{
              x:-1,
              y:0
            }
          };

        }

      }

    }

    if(d.x < -.01){

      const t =
        (w.x+w.w-pos.x)/d.x;

      if(
        t>.5 &&
        t<closestT
      ){

        const hy =
          pos.y+d.y*t;

        if(
          hy>=w.y &&
          hy<=w.y+w.h
        ){

          closestT=t;

          hit={
            t,
            normal:{
              x:1,
              y:0
            }
          };

        }

      }

    }

    if(d.y > .01){

      const t =
        (w.y-pos.y)/d.y;

      if(
        t>.5 &&
        t<closestT
      ){

        const hx =
          pos.x+d.x*t;

        if(
          hx>=w.x &&
          hx<=w.x+w.w
        ){

          closestT=t;

          hit={
            t,
            normal:{
              x:0,
              y:-1
            }
          };

        }

      }

    }

    if(d.y < -.01){

      const t =
        (w.y+w.h-pos.y)/d.y;

      if(
        t>.5 &&
        t<closestT
      ){

        const hx =
          pos.x+d.x*t;

        if(
          hx>=w.x &&
          hx<=w.x+w.w
        ){

          closestT=t;

          hit={
            t,
            normal:{
              x:0,
              y:1
            }
          };

        }

      }

    }

  }

  [
    {
      t:
        d.x>.01
          ? (W-pos.x)/d.x
          : Infinity,
      n:{x:-1,y:0}
    },
    {
      t:
        d.x<-.01
          ? (0-pos.x)/d.x
          : Infinity,
      n:{x:1,y:0}
    },
    {
      t:
        d.y>.01
          ? (H-pos.y)/d.y
          : Infinity,
      n:{x:0,y:-1}
    },
    {
      t:
        d.y<-.01
          ? (0-pos.y)/d.y
          : Infinity,
      n:{x:0,y:1}
    }
  ].forEach(b=>{

    if(
      b.t>.5 &&
      b.t<closestT
    ){

      closestT=b.t;

      hit={
        t:b.t,
        normal:b.n,
        border:true
      };

    }

  });

  return {
    closestT,
    hit
  };

}

function raycast(
  start,
  dir,
  color,
  maxDist=950,
  allowPrism=true
){

  const segs=[];

  let pos={
    x:start.x,
    y:start.y
  };

  let d =
    normalize(dir);

  let remaining =
    maxDist;

  let hops=0;

  while(
    remaining>0 &&
    hops<14
  ){

    hops++;

    let closestT =
      remaining;

    let hitType=null;
    let hitPiece=null;
    let hitNormal=null;

    const wh =
      hitWalls(
        pos,
        d,
        closestT
      );

    closestT =
      wh.closestT;

    if(wh.hit){

      hitType =
        wh.hit.border
          ? "border"
          : "wall";

      hitNormal =
        wh.hit.normal;

    }

    for(
      const p of pieces
    ){

      const t =
        (p.x-pos.x)*d.x +
        (p.y-pos.y)*d.y;

      if(
        t<1.5 ||
        t>=closestT
      ){
        continue;
      }

      const px =
        pos.x+d.x*t;

      const py =
        pos.y+d.y*t;

      const dist =
        Math.hypot(
          px-p.x,
          py-p.y
        );

      if(
        p.type==="mirror" &&
        dist<28
      ){

        closestT=t;
        hitType="mirror";
        hitPiece=p;

        const ang =
          (
            p.angle+90
          ) *
          Math.PI/180;

        hitNormal={
          x:Math.cos(ang),
          y:Math.sin(ang)
        };

      }else if(
        p.type==="lens" &&
        dist<24
      ){

        closestT=t;
        hitType="lens";
        hitPiece=p;

      }else if(
        p.type==="prism" &&
        dist<26 &&
        allowPrism
      ){

        closestT=t;
        hitType="prism";
        hitPiece=p;

      }

    }

    for(
      const t of ACTIVE_LEVELS[
        currentLevel
      ].targets
    ){

      const proj =
        (
          t.x-pos.x
        )*d.x +
        (
          t.y-pos.y
        )*d.y;

      if(
        proj<1 ||
        proj>=closestT
      ){
        continue;
      }

      if(
        Math.hypot(
          pos.x+d.x*proj-t.x,
          pos.y+d.y*proj-t.y
        ) <
        t.r+6
      ){

        closestT=proj;
        hitType="target";
        hitPiece=t;

      }

    }

    const end={
      x:
        pos.x+d.x*closestT,
      y:
        pos.y+d.y*closestT
    };

    segs.push({
      x1:pos.x,
      y1:pos.y,
      x2:end.x,
      y2:end.y,
      color
    });

    remaining -=
      closestT;

    if(
      hitType==="wall" ||
      hitType==="border"
    ){
      break;
    }

    if(
      hitType==="mirror"
    ){

      d =
        reflect(
          d,
          hitNormal
        );

      pos={
        x:end.x+d.x*5,
        y:end.y+d.y*5
      };

    }else if(
      hitType==="lens"
    ){

      const a =
        hitPiece.angle *
        Math.PI/180;

      const axis={
        x:Math.cos(a),
        y:Math.sin(a)
      };

      d =
        normalize({
          x:
            d.x*.5 +
            axis.x*.5,
          y:
            d.y*.5 +
            axis.y*.5
        });

      pos={
        x:end.x+d.x*5,
        y:end.y+d.y*5
      };

    }else if(
      hitType==="prism"
    ){

      segs._prism={
        pos:end,
        dir:d
      };

      break;

    }else if(
      hitType==="target"
    ){

      const need =
        hitPiece.color;

      if(
        color==="white" ||
        color===need ||
        (
          need==="yellow" &&
          (
            color==="red" ||
            color==="green" ||
            color==="yellow"
          )
        ) ||
        (
          need==="green" &&
          (
            color==="green" ||
            color==="cyan"
          )
        ) ||
        (
          need==="blue" &&
          (
            color==="blue" ||
            color==="cyan"
          )
        ) ||
        (
          need==="red" &&
          (
            color==="red" ||
            color==="yellow"
          )
        )
      ){

        if(
          !hitPiece.lit
        ){

          hitPiece.lit=true;

          sfxLit();

          for(
            let i=0;
            i<8;
            i++
          ){

            particles.push({
              x:hitPiece.x,
              y:hitPiece.y,
              vx:
                (Math.random()-.5)*4,
              vy:
                (Math.random()-.5)*4-1,
              life:25,
              color:
                COLORS[need]
            });

          }

        }else{

          hitPiece.lit=true;

        }

      }

      break;

    }else{

      break;

    }

  }

  return segs;

}

/* =========================================================
   SIMULATION
========================================================= */

function simulate(){

  const lv =
    ACTIVE_LEVELS[
      currentLevel
    ];

  lv.targets.forEach(
    t=>t.lit=false
  );

  const all=[];

  const sun =
    lv.sun;

  const main =
    raycast(
      {
        x:
          sun.x+
          sun.dir.x*28,

        y:
          sun.y+
          sun.dir.y*28
      },
      sun.dir,
      "white"
    );

  all.push(
    ...main
  );

  if(main._prism){

    const {
      pos,
      dir
    } =
      main._prism;

    const base =
      Math.atan2(
        dir.y,
        dir.x
      );

    const cols=[
      "red",
      "yellow",
      "green",
      "cyan",
      "blue"
    ];

    const offs=[
      -.4,
      -.2,
      0,
      .2,
      .4
    ];

    cols.forEach(
      (c,i)=>{

        all.push(
          ...raycast(
            pos,
            {
              x:
                Math.cos(
                  base+offs[i]
                ),
              y:
                Math.sin(
                  base+offs[i]
                )
            },
            c,
            800,
            false
          )
        );

      }
    );

  }

  return all;

}

/* =========================================================
   DRAW
========================================================= */

function drawBG(){

  ctx.fillStyle =
    "#050508";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.strokeStyle =
    "rgba(255,255,255,.03)";

  ctx.lineWidth=1;

  for(
    let i=40;
    i<W;
    i+=40
  ){

    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,H);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(W,i);
    ctx.stroke();

  }

  const lv =
    ACTIVE_LEVELS[
      currentLevel
    ];

  ctx.fillStyle =
    "#1c1c28";

  lv.walls.forEach(
    w=>{

      ctx.fillRect(
        w.x,
        w.y,
        w.w,
        w.h
      );

      ctx.strokeStyle =
        "#333";

      ctx.lineWidth=1;

      ctx.strokeRect(
        w.x,
        w.y,
        w.w,
        w.h
      );

    }
  );

  ctx.strokeStyle =
    "#c9a227";

  ctx.lineWidth=3;

  ctx.strokeRect(
    5,
    5,
    W-10,
    H-10
  );

}

function drawSun(){

  const s =
    ACTIVE_LEVELS[
      currentLevel
    ].sun;

  const g =
    ctx.createRadialGradient(
      s.x,
      s.y,
      4,
      s.x,
      s.y,
      50
    );

  g.addColorStop(
    0,
    "#fff9c8"
  );

  g.addColorStop(
    .35,
    "#ffd700"
  );

  g.addColorStop(
    1,
    "transparent"
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    s.x,
    s.y,
    50,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle =
    "#fff8e0";

  ctx.beginPath();

  ctx.arc(
    s.x,
    s.y,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle =
    "#ffd700";

  ctx.lineWidth=2.5;

  for(
    let i=0;
    i<8;
    i++
  ){

    const a =
      i*Math.PI/4;

    ctx.beginPath();

    ctx.moveTo(
      s.x+
      Math.cos(a)*18,
      s.y+
      Math.sin(a)*18
    );

    ctx.lineTo(
      s.x+
      Math.cos(a)*28,
      s.y+
      Math.sin(a)*28
    );

    ctx.stroke();

  }

}

function drawTarget(t){

  ctx.strokeStyle =
    t.lit
      ? COLORS[t.color]
      : "#3a3a48";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    t.x,
    t.y,
    t.r+8,
    0,
    Math.PI*2
  );

  ctx.stroke();

  if(t.lit){

    const g =
      ctx.createRadialGradient(
        t.x,
        t.y,
        2,
        t.x,
        t.y,
        t.r+28
      );

    g.addColorStop(
      0,
      COLORS[t.color]
    );

    g.addColorStop(
      .45,
      COLORS[t.color]+"99"
    );

    g.addColorStop(
      1,
      "transparent"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      t.r+28,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.fillStyle =
    t.lit
      ? COLORS[t.color]
      : "#2a2a35";

  ctx.beginPath();

  ctx.moveTo(
    t.x,
    t.y-t.r
  );

  ctx.quadraticCurveTo(
    t.x+t.r*.9,
    t.y-t.r*.2,
    t.x+t.r*.55,
    t.y+t.r*.5
  );

  ctx.quadraticCurveTo(
    t.x,
    t.y+t.r*.3,
    t.x-t.r*.55,
    t.y+t.r*.5
  );

  ctx.quadraticCurveTo(
    t.x-t.r*.9,
    t.y-t.r*.2,
    t.x,
    t.y-t.r
  );

  ctx.fill();

  ctx.fillStyle =
    "#4a3020";

  ctx.fillRect(
    t.x-12,
    t.y+t.r*.4,
    24,
    10
  );

  ctx.fillRect(
    t.x-8,
    t.y+t.r*.4+8,
    16,
    7
  );

}

function drawPiece(p){

  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );

  ctx.rotate(
    p.angle *
    Math.PI/180
  );

  if(
    p.type==="mirror"
  ){

    ctx.fillStyle =
      "#888";

    ctx.fillRect(
      -26,
      -5,
      52,
      10
    );

    ctx.fillStyle =
      "#eee";

    ctx.fillRect(
      -24,
      -3,
      48,
      6
    );

    ctx.fillStyle =
      "rgba(255,255,255,.5)";

    ctx.fillRect(
      -18,
      -1.5,
      14,
      3
    );

  }else if(
    p.type==="lens"
  ){

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      10,
      26,
      0,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      "rgba(160,210,255,.4)";

    ctx.fill();

    ctx.strokeStyle =
      "#7cf";

    ctx.lineWidth=2.5;

    ctx.stroke();

  }else if(
    p.type==="prism"
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      -24
    );

    ctx.lineTo(
      22,
      18
    );

    ctx.lineTo(
      -22,
      18
    );

    ctx.closePath();

    ctx.fillStyle =
      "rgba(190,230,255,.45)";

    ctx.fill();

    ctx.strokeStyle =
      "#aef";

    ctx.lineWidth=2.5;

    ctx.stroke();

  }

  ctx.restore();

  if(
    p===selectedPiece &&
    !readOnly
  ){

    ctx.strokeStyle =
      "#ffd700";

    ctx.lineWidth=2;

    ctx.setLineDash([
      5,
      4
    ]);

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      36,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.setLineDash([]);

  }

}

function drawBeams(
  segs
){

  segs.forEach(
    s=>{

      const c =
        COLORS[s.color] ||
        "#fff";

      ctx.strokeStyle=c;
      ctx.globalAlpha=.2;
      ctx.lineWidth=14;
      ctx.lineCap="round";

      ctx.beginPath();

      ctx.moveTo(
        s.x1,
        s.y1
      );

      ctx.lineTo(
        s.x2,
        s.y2
      );

      ctx.stroke();

      ctx.globalAlpha=.95;
      ctx.lineWidth=3.5;

      ctx.beginPath();

      ctx.moveTo(
        s.x1,
        s.y1
      );

      ctx.lineTo(
        s.x2,
        s.y2
      );

      ctx.stroke();

      ctx.globalAlpha=1;

    }
  );

}

function drawParticles(){

  particles =
    particles.filter(
      p=>p.life>0
    );

  particles.forEach(
    p=>{

      p.x += p.vx;
      p.y += p.vy;
      p.vy += .08;
      p.life--;

      ctx.globalAlpha =
        Math.max(
          0,
          p.life/30
        );

      ctx.fillStyle =
        p.color;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        2.5,
        0,
        Math.PI*2
      );

      ctx.fill();

    }
  );

  ctx.globalAlpha=1;

}

/* =========================================================
   INITIALIZE MULTIPLAYER MATCH
========================================================= */

async function ensureMatch(){

  const root =
    getRoundRoot();

  if(!root) return;

  const players =
    Object.entries(
      mpPlayersData
    )
    .sort(
      (a,b)=>{
        const aa =
          Number(
            a[1]?.joinedAt || 0
          );

        const bb =
          Number(
            b[1]?.joinedAt || 0
          );

        if(
          aa === bb
        ){
          return a[0]
            .localeCompare(
              b[0]
            );
        }

        return aa-bb;
      }
    );

  const uids =
    players
      .map(
        x=>x[0]
      )
      .slice(
        0,
        4
      );

  if(
    uids.length<2
  ){

    mpStatus.textContent =
      "حداقل ۲ بازیکن لازم است";

    return;

  }

  const matchRef =
    roomRef(
      getSavedRoom(),
      `lightpuzzle/${ROUND_ID}/match`
    );

  await runTransaction(
    matchRef,
    current=>{

      if(
        current &&
        current.mode
      ){
        return current;
      }

      const count =
        uids.length;

      if(
        count===4
      ){

        return {
          mode:"teams",
          playerCount:4,
          teams:{
            A:{
              uids:[
                uids[0],
                uids[1]
              ],
              stage:0,
              activeIndex:0,
              finished:false
            },
            B:{
              uids:[
                uids[2],
                uids[3]
              ],
              stage:0,
              activeIndex:0,
              finished:false
            }
          },
          winner:null,
          createdAt:Date.now()
        };

      }

      return {
        mode:
          count===3
            ? "three"
            : "two",

        playerCount:count,

        winner:null,

        createdAt:Date.now()
      };

    }
  );

}

/* =========================================================
   4 PLAYER TEAM STATE
========================================================= */

function myTeamFromMatch(
  match
){

  if(
    !match ||
    match.mode!=="teams"
  ){
    return null;
  }

  if(
    match.teams?.A?.uids
      ?.includes(myUid)
  ){
    return "A";
  }

  if(
    match.teams?.B?.uids
      ?.includes(myUid)
  ){
    return "B";
  }

  return null;

}

function isTeamActivePlayer(
  match
){

  if(
    !match ||
    match.mode!=="teams" ||
    !myTeam
  ){
    return false;
  }

  const team =
    match.teams?.[myTeam];

  if(!team) return false;

  return (
    team.uids?.[
      team.activeIndex || 0
    ] === myUid
  );

}

/* =========================================================
   MULTIPLAYER LISTENERS
========================================================= */

function startMultiplayer(){

  const code =
    getSavedRoom();

  if(
    !code ||
    !ROUND_ID
  ){

    mpStatus.textContent =
      "اطلاعات اتاق پیدا نشد";

    return;

  }

  mpMode=true;

  modeBadge.style.display =
    "block";

  modeBadge.textContent =
    "👥 چندنفره";

  mpPanel.style.display =
    "block";

  resize();

  /*
    بازیکنان اتاق
  */
  const playersRef =
    roomRef(
      code,
      "players"
    );

  const unsubPlayers =
    onValue(
      playersRef,
      async snap=>{

        mpPlayersData =
          snap.val() || {};

        mpPlayerCount =
          Object.keys(
            mpPlayersData
          ).length;

        renderMPPlayers();

        await ensureMatch();

      }
    );

  mpUnsubscribers.push(
    unsubPlayers
  );

  /*
    وضعیت مسابقه
  */
  const matchRef =
    roomRef(
      code,
      `lightpuzzle/${ROUND_ID}/match`
    );

  const unsubMatch =
    onValue(
      matchRef,
      snap=>{

        const match =
          snap.val();

        if(!match) return;

        myTeam =
          myTeamFromMatch(
            match
          );

        updateMPStatus(
          match
        );

        if(
          match.winner
        ){

          finishMatchUI(
            match.winner
          );

          return;

        }

        if(
          match.mode==="teams"
        ){

          teamState =
            match.teams?.[
              myTeam
            ] || null;

          if(
            !teamState
          ){
            return;
          }

          const activeUid =
            teamState.uids?.[
              teamState.activeIndex || 0
            ];

          const active =
            activeUid === myUid;

          readOnly =
            !active;

          spectatorLabel.style.display =
            active
              ? "none"
              : "block";

          currentLevel =
            Number(
              teamState.stage || 0
            );

          if(
            active
          ){

            loadLevel(
              currentLevel
            );

            syncGameState();

          }

        }else{

          readOnly=false;

        }

      }
    );

  mpUnsubscribers.push(
    unsubMatch
  );

  /*
    وضعیت خودم
  */
  const myStateRef =
    roomRef(
      code,
      `lightpuzzle/${ROUND_ID}/players/${myUid}`
    );

  const unsubMine =
    onValue(
      myStateRef,
      snap=>{

        if(
          !snap.exists()
        ){
          return;
        }

        const state =
          snap.val();

        /*
          در ۲/۳ نفره:
          وضعیت بازی خود بازیکن
        */
        if(
          mpPlayerCount <= 3
        ){

          const remoteLevel =
            Number(
              state.level || 0
            );

          if(
            remoteLevel !==
            currentLevel &&
            !won
          ){

            loadLevel(
              remoteLevel,
              state
            );

          }

        }

      }
    );

  mpUnsubscribers.push(
    unsubMine
  );

  /*
    برای حالت ۴ نفره:
    اگر هم‌تیمی من فعال است،
    من state او را می‌بینم.
  */
  const allStateRef =
    roomRef(
      code,
      `lightpuzzle/${ROUND_ID}/players`
    );

  const unsubAll =
    onValue(
      allStateRef,
      snap=>{

        if(
          !mpMode ||
          mpPlayerCount!==4 ||
          !myTeam
        ){
          return;
        }

        const val =
          snap.val() || {};

        const currentTeam =
          teamState;

        if(!currentTeam){
          return;
        }

        const activeUid =
          currentTeam.uids?.[
            currentTeam.activeIndex || 0
          ];

        if(
          !activeUid ||
          activeUid===myUid
        ){
          return;
        }

        const activeState =
          val[activeUid];

        if(!activeState){
          return;
        }

        const remoteLevel =
          Number(
            currentTeam.stage || 0
          );

        if(
          remoteLevel !==
          currentLevel
        ){

          loadLevel(
            remoteLevel,
            activeState
          );

        }else{

          pieces =
            JSON.parse(
              JSON.stringify(
                activeState.pieces || []
              )
            );

          inventory =
            {
              ...ACTIVE_LEVELS[
                currentLevel
              ].inventory,
              ...(activeState.inventory || {})
            };

          buildToolbar();
          updateCounts();

        }

      }
    );

  mpUnsubscribers.push(
    unsubAll
  );

}

/* =========================================================
   COMPLETE STAGE
========================================================= */

async function completeMultiplayerStage(){

  if(
    !mpMode ||
    readOnly ||
    !myUid
  ){
    return;
  }

  const code =
    getSavedRoom();

  const matchRef =
    roomRef(
      code,
      `lightpuzzle/${ROUND_ID}/match`
    );

  /*
    ۲ یا ۳ نفر:
    هر بازیکن مسیر خودش را جلو می‌برد.
  */
  if(
    mpPlayerCount <= 3
  ){

    const nextStage =
      currentLevel + 1;

    await set(
      roomRef(
        code,
        `lightpuzzle/${ROUND_ID}/players/${myUid}`
      ),
      {
        name:myName,
        level:
          nextStage,
        pieces:[],
        inventory:{},
        finished:
          nextStage >=
          MP_LEVEL_COUNT,
        finishedAt:
          nextStage >=
          MP_LEVEL_COUNT
            ? Date.now()
            : null,
        updatedAt:
          Date.now()
      }
    );

    if(
      nextStage >=
      MP_LEVEL_COUNT
    ){

      await runTransaction(
        matchRef,
        current=>{

          if(
            !current
          ){
            return current;
          }

          if(
            current.winner
          ){
            return current;
          }

          return {
            ...current,
            winner:myUid,
            winnerName:myName,
            finishedAt:Date.now()
          };

        }
      );

    }else{

      loadLevel(
        nextStage
      );

      syncGameState();

    }

    return;

  }

  /*
    ۴ نفر:
    تیمی
  */

  if(
    mpPlayerCount===4 &&
    myTeam
  ){

    await runTransaction(
      matchRef,
      current=>{

        if(
          !current ||
          current.mode!=="teams"
        ){
          return current;
        }

        const team =
          current.teams?.[
            myTeam
          ];

        if(!team){
          return current;
        }

        const activeUid =
          team.uids?.[
            team.activeIndex || 0
          ];

        /*
          فقط بازیکن فعال اجازه جلو بردن تیم را دارد.
        */
        if(
          activeUid !== myUid
        ){
          return current;
        }

        const nextStage =
          Number(
            team.stage || 0
          ) + 1;

        if(
          nextStage >=
          MP_LEVEL_COUNT
        ){

          return {
            ...current,
            teams:{
              ...current.teams,
              [myTeam]:{
                ...team,
                stage:MP_LEVEL_COUNT,
                finished:true,
                finishedAt:Date.now()
              }
            },
            winner:
              current.winner ||
              myTeam,
            winnerName:
              current.winnerName ||
              (
                "تیم " +
                myTeam
              ),
            finishedAt:
              current.finishedAt ||
              Date.now()
          };

        }

        return {
          ...current,
          teams:{
            ...current.teams,
            [myTeam]:{
              ...team,
              stage:nextStage,
              activeIndex:
                (
                  (
                    team.activeIndex ||
                    0
                  ) + 1
                ) % 2
            }
          }
        };

      }
    );

  }

}

          myTeam +
          " تمام ۶ مرحله را زودتر تمام کرد."
        : "تیم " +
          winner +
          " برنده مسابقه شد.";

  }else{

    const wonPlayer =
      winner === myUid;

    winTitle.textContent =
      wonPlayer
        ? "برنده شدی! 🏆"
        : "مسابقه تمام شد";

    winStars.textContent =
      wonPlayer
        ? "★★★"
        : "☆☆☆";

    winText.textContent =
      wonPlayer
        ? "تو زودتر از همه ۶ مرحله را تمام کردی."
        : (
          mpPlayersData[winner]?.name ||
          "یک بازیکن"
        ) +
        " زودتر از همه ۶ مرحله را تمام کرد.";

  }

  winOverlay.classList.add(
    "show"
  );

  recordMultiplayerResult(
    winner
  );

}

/* =========================================================
   RECORD RESULT
========================================================= */

async function recordMultiplayerResult(
  winner
){

  if(
    resultRecorded
  ){
    return;
  }

  resultRecorded=true;

  try{

    const won =
      mpPlayerCount===4
        ? winner===myTeam
        : winner===myUid;

    await recordRoundResult(
      myName,
      GAME_ID,
      {
        won
      }
    );

  }catch(e){

    console.warn(
      "record result error",
      e
    );

  }

}

/* =========================================================
   CHECK LEVEL WIN
========================================================= */

let previousLit=false;

function checkPuzzleWin(){

  if(
    won ||
    readOnly
  ){
    return;
  }

  const lv =
    ACTIVE_LEVELS[
      currentLevel
    ];

  if(
    !lv.targets.length
  ){
    return;
  }

  const all =
    lv.targets.every(
      t=>t.lit
    );

  if(
    !all
  ){

    previousLit=false;
    return;

  }

  if(
    previousLit
  ){
    return;
  }

  previousLit=true;

  /*
    SOLO
  */
  if(SOLO){

    const st =
      starsFor(
        pieces.length,
        lv.par
      );

    completed[
      currentLevel
    ]=true;

    bestStars[
      currentLevel
    ] =
      Math.max(
        bestStars[
          currentLevel
        ] || 0,
        st
      );

    unlocked =
      Math.max(
        unlocked,
        currentLevel+2
      );

    saveSolo();

    const finalStage =
      currentLevel ===
      ACTIVE_LEVELS.length-1;

    showWin(
      finalStage
    );

    /*
      فقط بعد از تمام ۱۰ مرحله،
      نتیجه تک‌نفره ثبت می‌شود.
    */
    if(
      finalStage
    ){

      recordSoloResult();

    }

    return;

  }

  /*
    MULTIPLAYER
  */
  showWin(false);

  completeMultiplayerStage();

}

async function recordSoloResult(){

  if(
    resultRecorded
  ){
    return;
  }

  resultRecorded=true;

  try{

    await recordRoundResult(
      myName,
      GAME_ID,
      {
        won:true
      }
    );

  }catch(e){

    console.warn(
      "solo result error",
      e
    );

  }

}

/* =========================================================
   COLORS
========================================================= */

const COLORS={
  white:"#f0f0f0",
  red:"#ff3b3b",
  green:"#3bff6a",
  blue:"#3b8bff",
  yellow:"#ffcc22",
  cyan:"#22e0ff"
};

/* =========================================================
   GAME LOOP
========================================================= */

function frame(){

  drawBG();

  drawSun();

  const beams =
    simulate();

  drawBeams(
    beams
  );

  pieces.forEach(
    drawPiece
  );

  ACTIVE_LEVELS[
    currentLevel
  ].targets.forEach(
    drawTarget
  );

  drawParticles();

  checkPuzzleWin();

  requestAnimationFrame(
    frame
  );

}

/* =========================================================
   INITIALIZATION
========================================================= */

async function init(){

  const user =
    await waitForUser();

  if(!user){

    location.href =
      "../index.html";

    return;

  }

  myUid =
    currentUid();

  myName =
    getSavedName() ||
    "بازیکن";

  /*
    SOLO
  */
  if(SOLO){

    modeBadge.style.display =
      "block";

    modeBadge.textContent =
      "👤 تک‌نفره • ۱۰ مرحله";

    loadSoloSave();

    loadLevel(0);

    frame();

    return;

  }

  /*
    MULTIPLAYER
  */
  if(ROUND_ID){

    startMultiplayer();

    /*
      موقتاً مرحله اول را نمایش می‌دهیم.
      وقتی match مشخص شود،
      state درست جایگزین می‌شود.
    */
    loadLevel(0);

    frame();

    return;

  }

  /*
    اگر بازی بدون solo و بدون round باز شد،
    به صفحه اصلی برگرد.
  */
  location.href =
    "../index.html";

}

init();

})();

</script>
