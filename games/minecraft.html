#mpPanel .acts .warn{background:#8a3a2a}#mpPanel .acts .exit{background:#2c6e49}
#mpCreate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(10,14,30,.8);direction:rtl}
#mpCreate .box{background:#1b2238;color:#fff;padding:22px;border-radius:16px;text-align:center;width:min(340px,90vw);display:flex;flex-direction:column;gap:10px}
#mpCreate .logo{font-size:40px}#mpCreate button{padding:12px;border-radius:11px;border:0;background:#3b82f6;color:#fff;font-size:17px;font-weight:700}

</style>
</head>
<body>
<canvas id="game"></canvas>
/* ---- p1.html ---- */
<div id="hud">
 <div id="info"><b id="biomeName">دشت سبز</b><span id="coords"></span></div>
 <div id="topBtns"><button id="btnInv" class="roundBtn" aria-label="کوله‌پشتی">🎒</button><button id="btnPause" class="roundBtn" aria-label="توقف">Ⅱ</button></div>
 <div id="crosshair"></div>
 <div id="vitals"></div>
 <div id="hotbar"></div>
 <div id="handLabel"></div>
 <div id="touch">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="actions">
   <div class="arow"><button class="abtn" id="btnFly">🪽<small>پرواز</small></button><button class="abtn" id="btnJump">⬆<small>پرش</small></button><button class="abtn" id="btnDown">🧎<small>نشستن</small></button></div>
   <div class="arow"><button class="abtn" id="btnPlace">＋<small>گذاشتن</small></button><button class="abtn big" id="btnBreak">⛏<small>شکستن</small></button></div>
  </div>
 </div>
</div>
<div id="uw"></div><div id="flash"></div><div id="toast"></div>

<div id="menu" class="screen">
 <div class="bgblocks"></div>
 <div class="menuBox">
  <div class="logo">⛏️ مینی ماین‌کرافت</div>
  <div class="sub" id="verTag">نسخهٔ V8</div>
  <div id="viewMain">
   <div id="slots"></div>
   <button id="btnRotate" class="btn2">📱 تمام‌صفحه + افقی</button>
   <p class="fine">دنیا خودکار در همین مرورگر ذخیره می‌شود. برای بهترین تجربه گوشی را افقی نگه دار.</p>
  </div>
  <div id="viewNew" style="display:none">
   <label class="lbl">نام دنیا</label><input id="wName" maxlength="24" placeholder="دنیای من">
   <label class="lbl">حالت بازی</label>
   <div class="choices" id="modeChoices">
    <button class="choice sel" data-mode="survival"><b>❤️ بقا</b><small>جمع‌کردن منابع و زنده‌ماندن</small></button>
    <button class="choice" data-mode="creative"><b>🪽 خلاقانه</b><small>پرواز و بلوک نامحدود</small></button>
   </div>
   <label class="lbl">اسکین</label>
   <div class="skins" id="skinChoices"></div>
   <label class="lbl">دانهٔ دنیا (اختیاری؛ عدد یا متن)</label><input id="wSeed" placeholder="خالی = تصادفی">
   <div class="row2"><button id="btnCreate" class="btn1">🌍 ساخت دنیا</button><button id="btnBack" class="btn2">بازگشت</button></div>
  </div>
 </div>
</div>
<div id="loading" class="screen" style="display:none"><div class="menuBox"><div class="logo">🌍</div><div id="loadMsg" class="sub">در حال ساخت دنیا…</div><div class="bar"><i id="loadBar"></i></div><p class="fine" id="loadTip"></p></div></div>
<div id="pauseUI" class="screen" style="display:none"><div class="menuBox small"><div class="logo">⏸️</div><div class="sub">بازی متوقف شد</div>
 <button id="btnResume" class="btn1">ادامه بازی</button><div id="pauseExtra"></div><button id="btnSave" class="btn2">💾 ذخیره</button><button id="btnQuit" class="btn2">🏠 ذخیره و بازگشت به منو</button></div></div>
<div id="invUI" class="screen" style="display:none"><div class="dlg"><div class="dlgHead"><div id="tabs"></div><button id="invClose" class="roundBtn">✕</button></div><div id="tabBody"></div></div></div>
<div id="portrait" class="screen" style="display:none"><div class="menuBox small"><div class="logo">📱↻</div><div class="sub">برای بازی گوشی را افقی کن</div><button id="btnStayPortrait" class="btn2">ادامه به‌صورت عمودی</button></div></div>

function genChunk(cx,cz,seed){

 for(let z=cz*CS;z<cz*CS+CS;z++)for(let x=cx*CS;x<cx*CS+CS;x++){
  const col=x+z*W,e=Math.min(x,W-1-x,z,D-1-z),fall=e<18?Math.pow(1-e/18,2)*24:0;
  const n1=NZ.fbm(x*.012,z*.012,4),n2=NZ.fbm(x*.05+40,z*.05-40,2),mt=NZ.fbm(x*.007+300,z*.007-200,3);
  const temp=NZ.fbm(x*.006+700,z*.006,2),hum=NZ.fbm(x*.007-700,z*.007+200,2);

  else if(temp<-.2){b=3;top=B.snow_grass;sub=B.dirt}

   if(y===0||(y<=2&&hash3(x,y,z,seed)>.55))id=B.bedrock;
   else if(y===h)id=top;else if(y>=h-3)id=sub;else id=B.stone;

 }

  let x=cx*CS+(rng()*CS|0),y=y0+(rng()*(y1-y0)|0),z=cz*CS+(rng()*CS|0);

  }else if(b===3&&top===B.snow_grass){if(r<.013&&!occ[col]){placeTree(x,yy,z,2,rng);mark(x,z,2)}}
  else if(b===2&&top===B.sand){
   if(r<.004&&!occ[col]){const ch=1+(rng()*3|0);for(let k=0;k<ch;k++)blocks[x+z*W+(yy+k)*WD]=B.cactus;mark(x,z,1)}

function raycastBlocks(ox,oy,oz,dx,dy,dz,max){
 let x=Math.floor(ox),y=Math.floor(oy),z=Math.floor(oz);
 const sx=dx>0?1:-1,sy=dy>0?1:-1,sz=dz>0?1:-1,tdx=dx===0?Infinity:Math.abs(1/dx),tdy=dy===0?Infinity:Math.abs(1/dy),tdz=dz===0?Infinity:Math.abs(1/dz);

 for(let i=0;i<80;i++){
  if(i>0){const id=getB(x,y,z);if(id&&TARGET[id])return{x,y,z,id,nx,ny,nz,d:t}}
  if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=tdx;nx=-sx;ny=0;nz=0}else if(ty<tz){y+=sy;t=ty;ty+=tdy;nx=0;ny=-sy;nz=0}else{z+=sz;t=tz;tz+=tdz;nx=0;ny=0;nz=-sz}

 p.sprint=(k.ControlLeft||ip.sprint||G.sprintLock)&&fw>.5&&!p.inWater&&G.canSprint!==false;
 const wetId=liquidAt(p.x,p.y+.4,p.z);p.inWater=!!wetId;p.inLava=wetId===B.lava;p.headWater=!!liquidAt(p.x,p.y+EYE,p.z);

}

let ac=null,noiseBuf=null;
function AC(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
function noiseHit(dur,f,q,vol,type,f2){const a=AC();if(!a)return;const s=a.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=.8+Math.random()*.4;const fl=a.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.setValueAtTime(f,a.currentTime);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);fl.Q.value=q||1;const g=a.createGain();g.gain.setValueAtTime(vol*G.settings.sound,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);s.connect(fl).connect(g).connect(a.destination);s.start(0,Math.random()*.5,dur+.05)}
function tone(f0,f1,dur,vol,type){const a=AC();if(!a)return;const o=a.createOscillator();o.type=type||'square';o.frequency.setValueAtTime(f0,a.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),a.currentTime+dur);const g=a.createGain();g.gain.setValueAtTime(vol*G.settings.sound,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur+.02)}
const MAT={stone:[1800,2.5],wood:[700,1.5],grass:[900,.7],dirt:[500,.8],sand:[1300,.6],glass:[4000,4],cloth:[400,.5]};
G.sfx=(n,m)=>{
 if(!G.settings.sound)return;const mt=MAT[m]||MAT.stone;
 switch(n){
  case'break':if(m==='glass')tone(2400,900,.25,.18,'triangle');noiseHit(.22,mt[0],mt[1],.5,'bandpass');break;
  case'hit':noiseHit(.09,mt[0],mt[1],.28,'bandpass');break;
  case'place':noiseHit(.12,mt[0]*.8,mt[1],.4,'bandpass');break;
  case'step':noiseHit(.07,mt[0]*.6,1,.1,'bandpass');break;
  case'jump':noiseHit(.06,500,1,.07,'lowpass');break;
  case'land':noiseHit(.12,350,1,.2,'lowpass');break;
  case'hurt':tone(260,110,.25,.3,'sawtooth');break;

(async()=>{
const M=window.MMNet;if(!M||!M.wanted)return;

  await runTransaction(mc('world'),cur=>cur||w);

 // ویرایش‌های ذخیره‌شده

 // ذخیرهٔ حضور

 // ---- ارسال ویرایش‌ها ----
 const pend=new Map();let tmr=0;

 const ed=mc('edits');
 const apply=c=>{const k=c.key;if(k[0]!=='b')return;const idx=+k.slice(1);if(pend.has(idx))return;M.remoteEdit(idx,c.val()|0)};
 onChildAdded(ed,apply);onChildChanged(ed,apply);
 onChildRemoved(ed,c=>{const k=c.key;if(k[0]==='b')M.remoteEdit(+k.slice(1),0)});
 // ---- بازیکن‌ها ----
 let hb=0,last='';
 const send=(force)=>{if(!M.on)return;const s=M.getLocalState();const j=JSON.stringify(s);if(!force&&j===last&&(++hb%45))return;last=j;s.name=name;s.skin=skins[h%4];s.hb=hb;set(pr,s).catch(()=>{})};
 setInterval(()=>send(false),110);send(true);
 const pl=mc('players');
 const up=c=>{if(c.key!==uid)M.upsertPlayer(c.key,c.val());M.updatePlayers&&M.updatePlayers()};
 onChildAdded(pl,up);onChildChanged(pl,up);onChildRemoved(pl,c=>M.removePlayer(c.key));
 // ---- دنیا: PvP و بازنشانی ----
 onValue(mc('world'),s=>{const w=s.val();if(!w)return;if(w.seed!==world.seed){M.worldReset();return}M.pvp=!!w.pvp});
 M.setPvp=v=>update(mc('world'),{pvp:!!v});

 // ---- برخورد ----
 M.onHit=(target,dmg,x,z)=>push(mc('events/'+target),{n:name,d:dmg,x,z}).catch(()=>{});
 onChildAdded(evr,c=>{const v=c.val()||{};remove(c.ref).catch(()=>{});M.receiveHit(Math.min(20,+v.d||1),+v.x||0,+v.z||0,v.n||'؟')});
 // ---- اعلان‌ها ----
 const fd=mc('feed'),t0=now()-4000;
 M.onFeed=t=>push(fd,{t,at:now()}).catch(()=>{});
 onChildAdded(query(fd,limitToLast(4)),c=>{const v=c.val()||{};if((v.at||0)>=t0&&v.t)M.feedLocal(v.t)});
 // ---- چت ----
 let seen=null;
 listenChat(code,list=>{M.setChatList(list);if(seen===null){seen=new Set(list.map(m=>m.id));return}for(const m of list)if(!seen.has(m.id)){seen.add(m.id);if(m.name!==name)M.addChat(m)}});
 // ---- خروج ----
 M.onExit=async()=>{try{await remove(pr)}catch(e){}try{await resetSessionForNextRound()}catch(e){}};
 addEventListener('pagehide',()=>{try{remove(pr)}catch(e){}});
}catch(e){console.error('MM net',e);M.fail(/PERMISSION/i.test(String(e&&(e.code||e.message)))?'دسترسی دیتابیس مجاز نیست (قوانین Firebase)':'خطا در اتصال به دومیتو')}
})();
