<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کوییز | دومیتو</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="brand-mark">❓</div><h1>کوییز اطلاعات عمومی</h1></div>
    <div class="card" id="playArea">
      <h2 id="qCounter">سوال ۱ از ۵</h2>
      <p id="qText" style="font-size:16px; margin-bottom:16px;"></p>
      <div id="options"></div>
    </div>
    <div class="card" id="waitArea" style="display:none">
      <h2>نتیجه تو ثبت شد</h2>
      <p class="status-line" id="waitStatus">در انتظار بقیه بازیکن‌ها...</p>
    </div>
    <div class="card" id="scoreArea" style="display:none">
      <h2 id="scoreAreaTitle">نتیجه این دور</h2>
      <div class="score-board" id="scoreBoard"></div>
      <div class="solo-result" id="soloResult" style="display:none"></div>
      <p class="status-line" id="nextStatus">به زودی برمی‌گردیم به سالن...</p>
    </div>
  </div>

<script type="module">
  import {
    roomRef, getSavedRoom, onValue, waitForUser, currentUid, getSavedName,
    submitResult, resetSessionForNextRound, recordRoundResult, soloWon
  } from "../js/app.js";
  import { mountChat } from "../js/chat.js";

  const isSolo = new URLSearchParams(location.search).has("solo");
  const code = getSavedRoom();
  const R = (p) => roomRef(code, p);

  const QUESTION_POOL = [
    { q: "بزرگترین کشور جهان از نظر مساحت کدومه؟", options: ["چین", "روسیه", "کانادا", "آمریکا"], correct: 1 },
    { q: "آب از چند اتم تشکیل شده؟", options: ["۲", "۳", "۴", "۵"], correct: 1 },
    { q: "سریع‌ترین حیوان خشکی کدومه؟", options: ["شیر", "یوزپلنگ", "اسب", "گورخر"], correct: 1 },
    { q: "پایتخت استرالیا کدومه؟", options: ["سیدنی", "ملبورن", "کانبرا", "بریزبن"], correct: 2 },
    { q: "قلب انسان چند حفره داره؟", options: ["۲", "۳", "۴", "۵"], correct: 2 },
    { q: "نزدیک‌ترین سیاره به خورشید؟", options: ["زهره", "زمین", "مریخ", "عطارد"], correct: 3 },
    { q: "طولانی‌ترین رودخانه جهان؟", options: ["نیل", "آمازون", "یانگ‌تسه", "میسیسیپی"], correct: 0 },
    { q: "چند تا استخوان توی بدن بالغ انسانه؟", options: ["186", "206", "226", "246"], correct: 1 },
    { q: "بزرگترین اقیانوس جهان؟", options: ["اطلس", "هند", "آرام", "منجمد شمالی"], correct: 2 },
    { q: "کدوم سیاره حلقه‌های معروف داره؟", options: ["مشتری", "زحل", "مریخ", "نپتون"], correct: 1 },
    { q: "واحد پول ژاپن چیه؟", options: ["وون", "یوان", "ین", "روپیه"], correct: 2 },
    { q: "بلندترین کوه جهان؟", options: ["کی‌تو", "اورست", "کلیمانجارو", "دنالی"], correct: 1 },
    { q: "کدوم حیوان بزرگترین پستاندار جهانه؟", options: ["فیل آفریقایی", "نهنگ آبی", "کوسه نهنگی", "زرافه"], correct: 1 },
    { q: "پایتخت کانادا؟", options: ["تورنتو", "مونترال", "اتاوا", "ونکوور"], correct: 2 },
    { q: "چند قاره در جهان وجود داره؟", options: ["۵", "۶", "۷", "۸"], correct: 2 },
    { q: "سریع‌ترین پرنده در پرواز شیرجه‌ای؟", options: ["عقاب طلایی", "شاهین دره‌ای", "کرکس", "جغد"], correct: 1 },
    { q: "کدوم عنصر فراوان‌ترین عنصر در جو زمینه؟", options: ["اکسیژن", "کربن", "نیتروژن", "هیدروژن"], correct: 2 },
    { q: "معروف‌ترین برج کج جهان کجاست؟", options: ["پاریس", "پیزا", "لندن", "رم"], correct: 1 },
    { q: "بزرگترین صحرای جهان (غیر قطبی)؟", options: ["صحرای آفریقا", "کویر گبی", "کویر لوت", "کالاهاری"], correct: 0 },
    { q: "کدوم کشور بیشترین جمعیت جهان رو داره؟", options: ["چین", "هند", "آمریکا", "اندونزی"], correct: 1 },
    { q: "چند رنگ در رنگین‌کمان دیده می‌شه؟", options: ["۵", "۶", "۷", "۸"], correct: 2 },
    { q: "ماه چند روز طول می‌کشه دور زمین بچرخه؟", options: ["۱۴ روز", "۲۱ روز", "۲۷ روز", "۴۵ روز"], correct: 2 },
  ];

  function pickQuestions(n) { return [...QUESTION_POOL].sort(() => Math.random() - 0.5).slice(0, n); }

  const questions = pickQuestions(5);
  let idx = 0, correctCount = 0, myUid, myName, players = {};

  const qCounter = document.getElementById("qCounter");
  const qText = document.getElementById("qText");
  const optionsEl = document.getElementById("options");

  function renderQuestion() {
    const q = questions[idx];
    qCounter.textContent = `سوال ${idx + 1} از ${questions.length}`;
    qText.textContent = q.q;
    optionsEl.innerHTML = "";
    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "quiz-option";
      btn.textContent = opt;
      btn.addEventListener("click", () => answer(i));
      optionsEl.appendChild(btn);
    });
  }

  function answer(i) {
    const q = questions[idx];
    const buttons = optionsEl.querySelectorAll(".quiz-option");
    buttons.forEach((b) => (b.disabled = true));
    buttons[q.correct].classList.add("correct");
    if (i !== q.correct) buttons[i].classList.add("wrong");
    if (i === q.correct) correctCount++;
    setTimeout(() => {
      idx++;
      if (idx < questions.length) { buttons.forEach((b) => { b.disabled = false; b.classList.remove("correct", "wrong"); }); renderQuestion(); }
      else finish();
    }, 700);
  }

  async function finish() {
    const score = correctCount * 10;
    if (isSolo) { await finishSolo(score); return; }
    document.getElementById("playArea").style.display = "none";
    document.getElementById("waitArea").style.display = "block";
    await submitResult("quiz", myUid, myName, score);
  }

  async function finishSolo(score) {
    document.getElementById("playArea").style.display = "none";
    const won = soloWon("quiz", score);
    await recordRoundResult(myName, "quiz", { won });
    const scoreArea = document.getElementById("scoreArea");
    scoreArea.style.display = "block";
    document.getElementById("scoreAreaTitle").style.display = "none";
    document.getElementById("scoreBoard").style.display = "none";
    document.getElementById("nextStatus").style.display = "none";
    const soloResult = document.getElementById("soloResult");
    soloResult.style.display = "block";
    soloResult.innerHTML = `
      <div class="big-emoji">${won ? "🎉" : "😅"}</div>
      <h2>${won ? "آفرین، بردی!" : "این‌بار نشد"}</h2>
      <div class="score-big">${score} امتیاز</div>
      <button onclick="location.reload()" class="btn-full">دوباره بازی کن</button>
      <a href="../index.html" class="btn-full btn-ghost" style="display:block; text-decoration:none; text-align:center; margin-top:10px;">بازگشت به خانه</a>
    `;
  }

  async function init() {
    const user = await waitForUser();
    myName = getSavedName();
    if (!user || !myName) { window.location.href = "../index.html"; return; }
    myUid = currentUid();

    if (isSolo) { renderQuestion(); return; }

    if (!code) { window.location.href = "../index.html"; return; }
    mountChat(myName, code);
    onValue(R("players"), (snap) => { players = snap.val() || {}; });
    renderQuestion();

    let handled = false;
    onValue(R("results"), async (snap) => {
      const results = snap.val() || {};
      const totalPlayers = Object.keys(players).length;
      const totalResults = Object.keys(results).length;
      document.getElementById("waitStatus").textContent = `${totalResults} از ${totalPlayers} نفر تموم کردن`;
      if (handled || totalPlayers === 0 || totalResults < totalPlayers) return;
      handled = true;

      const maxScore = Math.max(...Object.values(results).map((r) => r.score));
      const won = results[myUid]?.score === maxScore;
      await recordRoundResult(myName, "quiz", { won });

      document.getElementById("waitArea").style.display = "none";
      document.getElementById("scoreArea").style.display = "block";
      const board = document.getElementById("scoreBoard");
      board.innerHTML = "";
      Object.entries(results).sort((a, b) => b[1].score - a[1].score).forEach(([uid, r]) => {
        const row = document.createElement("div");
        row.className = "score-row" + (r.score === maxScore ? " winner" : "");
        row.innerHTML = `<span>${r.name}</span><span class="points">${r.score}</span>`;
        board.appendChild(row);
      });
      setTimeout(async () => { await resetSessionForNextRound(); window.location.href = "../lobby.html"; }, 4000);
    });
  }
  init();
</script>
</body>
</html>
