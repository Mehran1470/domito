<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>آجرشکن | دومیتو</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#07111f;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  overflow:hidden;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#gameWrap{
  width:100%;
  max-width:460px;
  height:100vh;
  max-height:900px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:10px;
}

.topbar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-bottom:8px;
  z-index:5;
}

.stat{
  flex:1;
  min-width:0;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:7px 5px;
  text-align:center;
  backdrop-filter:blur(10px);
}

.stat b{
  display:block;
  font-size:17px;
}

.stat span{
  display:block;
  margin-top:2px;
  font-size:10px;
  opacity:.65;
}

#canvasBox{
  position:relative;
  width:min(400px, calc(100vw - 20px));
  aspect-ratio:400 / 500;
  max-height:calc(100vh - 145px);
  border-radius:22px;
  overflow:hidden;
  background:#091626;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    inset 0 0 40px rgba(0,0,0,.2);
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(2,8,18,.62);
  backdrop-filter:blur(9px);
  z-index:10;
}

.panel{
  width:100%;
  max-width:310px;
  padding:25px 20px;
  border-radius:25px;
  text-align:center;
  background:rgba(20,32,52,.88);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.panel h1{
  margin:0 0 8px;
  font-size:27px;
}

.panel p{
  margin:7px 0;
  opacity:.75;
  font-size:14px;
  line-height:1.8;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:13px 15px;
  margin-top:12px;
  color:#fff;
  background:linear-gradient(135deg,#267cff,#744cff);
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(45,110,255,.25);
}

button:active{
  transform:scale(.97);
}

.secondary{
  background:rgba(255,255,255,.09);
  box-shadow:none;
}

#levelInfo{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  text-align:center;
  pointer-events:none;
  z-index:4;
}

#levelInfo span{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.1);
  font-size:12px;
  backdrop-filter:blur(8px);
}

#progressWrap{
  width:min(400px, calc(100vw - 20px));
  height:7px;
  margin-top:8px;
  overflow:hidden;
  border-radius:99px;
  background:rgba(255,255,255,.08);
}

#progress{
  width:0%;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#4f8cff,#b86cff);
  transition:width .2s ease;
}

#roomResults{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(12px);
}

.resultsBox{
  width:100%;
  max-width:350px;
  max-height:80vh;
  overflow:auto;
  padding:22px;
  border-radius:24px;
  background:rgba(16,28,48,.95);
  border:1px solid rgba(255,255,255,.14);
}

.resultsBox h2{
  margin:0 0 15px;
  text-align:center;
}

.resultRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 12px;
  margin:7px 0;
  border-radius:13px;
  background:rgba(255,255,255,.07);
}

.resultRow.me{
  border:1px solid rgba(90,145,255,.5);
}

.resultName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:190px;
}

.resultScore{
  font-weight:bold;
}

.hidden{
  display:none !important;
}

@media(max-height:650px){
  #gameWrap{
    padding:5px;
  }

  .topbar{
    margin-bottom:4px;
  }

  .stat{
    padding:4px;
  }

  .stat b{
    font-size:14px;
  }

  .stat span{
    font-size:8px;
  }

  #progressWrap{
    margin-top:4px;
  }
}
</style>
</head>

<body>

<div id="gameWrap">

  <div class="topbar">

    <div class="stat">
      <b id="score">0</b>
      <span>امتیاز</span>
    </div>

    <div class="stat">
      <b id="lives">❤️❤️❤️</b>
      <span>جان</span>
    </div>

    <div class="stat">
      <b id="highScore">0</b>
      <span>رکورد</span>
    </div>

  </div>

  <div id="canvasBox">

    <canvas id="game" width="400" height="500"></canvas>

    <div id="levelInfo">
      <span id="levelText">مرحله ۱</span>
    </div>

    <div id="overlay">

      <div class="panel">

        <h1 id="overlayTitle">🧱 آجرشکن</h1>

        <p id="overlayText">
          پنج مرحله آجرها را نابود کن و رکورد بزن!
        </p>

        <button id="mainBtn">شروع بازی</button>

        <button id="restartBtn"
                class="secondary hidden">
          شروع دوباره
        </button>

      </div>

    </div>

    <div id="roomResults">

      <div class="resultsBox">

        <h2>🏆 نتیجه بازی</h2>

        <div id="resultsList"></div>

        <button id="resultClose">
          ادامه
        </button>

      </div>

    </div>

  </div>

  <div id="progressWrap">
    <div id="progress"></div>
  </div>

</div>

<script type="module">

import {
  waitForUser,
  getSavedName,
  getSavedRoom,
  currentUid,
  submitResult,
  recordRoundResult,
  roomRef,
  onValue
} from "../js/app.js";


/* =========================================================
   تنظیمات
========================================================= */

const GAME_ID = "reaction";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const highScoreEl = document.getElementById("highScore");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");

const mainBtn = document.getElementById("mainBtn");
const restartBtn = document.getElementById("restartBtn");

const levelText = document.getElementById("levelText");
const progress = document.getElementById("progress");

const roomResults = document.getElementById("roomResults");
const resultsList = document.getElementById("resultsList");
const resultClose = document.getElementById("resultClose");


/* =========================================================
   حالت بازی
========================================================= */

const params = new URLSearchParams(location.search);

const isSolo = params.has("solo");

const roomCode = getSavedRoom();

let myUid = null;
let myName = "بازیکن";

let running = false;
let roundFinished = false;
let resultSubmitted = false;
let scoreboardShown = false;

let currentLevel = 0;
let score = 0;
let lives = 3;

let baseSpeed = 3.8;

let animId = null;
let framePending = false;
let lastFrameTime = 0;


/* =========================================================
   سطوح
========================================================= */

const levels = [

  {
    rows:4,
    cols:8,
    speed:3.8,
    name:"مرحله ۱",
    desc:"شروع آروم 😎"
  },

  {
    rows:5,
    cols:8,
    speed:4.15,
    name:"مرحله ۲",
    desc:"یه کم سریع‌تر 🔥"
  },

  {
    rows:5,
    cols:9,
    speed:4.55,
    name:"مرحله ۳",
    desc:"آجرهای بیشتر!"
  },

  {
    rows:6,
    cols:9,
    speed:4.9,
    name:"مرحله ۴",
    desc:"چالش واقعی 😈"
  },

  {
    rows:6,
    cols:10,
    speed:5.35,
    name:"مرحله ۵",
    desc:"آخرین مرحله! 🏆"
  }

];


/* =========================================================
   توپ
========================================================= */

const ball = {

  x:W / 2,
  y:H - 80,

  r:7,

  dx:3.8,
  dy:-3.8

};


/* =========================================================
   پدل
========================================================= */

const paddle = {

  width:82,
  height:11,

  x:(W - 82) / 2,
  y:H - 30,

  speed:7

};


/* =========================================================
   آجرها
========================================================= */

let bricks = [];


/* =========================================================
   افکت‌ها
========================================================= */

let particles = [];
let trail = [];


/* =========================================================
   کلیدها
========================================================= */

const keys = {

  left:false,
  right:false

};


/* =========================================================
   صدا
========================================================= */

let audioCtx = null;

function sound(freq = 500, duration = .04){

  try{

    if(!audioCtx){
      audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.value = freq;
    osc.type = "sine";

    gain.gain.value = .035;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + duration
    );

    osc.stop(
      audioCtx.currentTime + duration
    );

  }catch{}

}


/* =========================================================
   ساخت آجرها
========================================================= */

function createBricks(){

  bricks = [];

  const level = levels[currentLevel];

  const rows = level.rows;
  const cols = level.cols;

  const gap = 5;
  const side = 18;

  const brickWidth =
    (W - side * 2 - gap * (cols - 1)) / cols;

  const brickHeight = 18;

  for(let r = 0; r < rows; r++){

    for(let c = 0; c < cols; c++){

      bricks.push({

        x:side + c * (brickWidth + gap),

        y:55 + r * (brickHeight + gap),

        w:brickWidth,
        h:brickHeight,

        alive:true,

        hue:(r * 55 + c * 13 + currentLevel * 35) % 360

      });

    }

  }

}


/* =========================================================
   ریست توپ
========================================================= */

function resetBall(){

  ball.x = W / 2;

  ball.y = H - 75;

  /*
   * زاویه امن:
   * توپ هیچ‌وقت تقریباً افقی حرکت نمی‌کند.
   * این یکی از مواردی است که جلوی گیرکردن/ناپدیدشدن
   * توپ را می‌گیرد.
   */

  const angle =
    (Math.random() * 0.42 + 0.29) * Math.PI;

  const direction =
    Math.random() < .5 ? -1 : 1;

  ball.dx =
    Math.cos(angle) * baseSpeed * direction;

  ball.dy =
    -Math.abs(Math.sin(angle) * baseSpeed);

}


/* =========================================================
   شروع مرحله
========================================================= */

function startLevel(){

  const level = levels[currentLevel];

  baseSpeed = level.speed;

  levelText.textContent =
    `${level.name} — ${level.desc}`;

  createBricks();

  particles = [];
  trail = [];

  paddle.x =
    (W - paddle.width) / 2;

  resetBall();

  updateProgress();

}


/* =========================================================
   ذرات
========================================================= */

function makeParticles(x,y,count=7){

  for(let i=0;i<count;i++){

    const angle =
      Math.random() * Math.PI * 2;

    const speed =
      40 + Math.random() * 100;

    particles.push({

      x,
      y,

      dx:Math.cos(angle) * speed,
      dy:Math.sin(angle) * speed,

      life:1,

      size:2 + Math.random() * 3

    });

  }

}


/* =========================================================
   آپدیت ذرات
========================================================= */

function updateParticles(dtSec){

  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.dx * dtSec;
    p.y += p.dy * dtSec;

    p.dy += 120 * dtSec;

    p.life -= dtSec * 2.4;

    if(p.life <= 0){

      particles.splice(i,1);

    }

  }

}


/* =========================================================
   پیشرفت مرحله
========================================================= */

function updateProgress(){

  const total = bricks.length;

  const destroyed =
    bricks.filter(b => !b.alive).length;

  const percent =
    total > 0
      ? destroyed / total * 100
      : 0;

  progress.style.width =
    `${percent}%`;

}


/* =========================================================
   پس‌زمینه
========================================================= */

function drawBackground(){

  const gradient =
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  gradient.addColorStop(
    0,
    "#08182d"
  );

  gradient.addColorStop(
    1,
    "#040a14"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,0,
    W,H
  );


  /* خطوط تزئینی */

  ctx.save();

  ctx.globalAlpha = .05;

  ctx.strokeStyle = "#fff";

  for(let x=0;x<W;x+=25){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(x,H);

    ctx.stroke();

  }

  for(let y=0;y<H;y+=25){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();

  }

  ctx.restore();

}


/* =========================================================
   رسم آجرها
========================================================= */

function drawBricks(){

  for(const b of bricks){

    if(!b.alive) continue;

    ctx.save();

    const gradient =
      ctx.createLinearGradient(
        b.x,
        b.y,
        b.x,
        b.y + b.h
      );

    gradient.addColorStop(
      0,
      `hsla(${b.hue},90%,68%,1)`
    );

    gradient.addColorStop(
      1,
      `hsla(${b.hue},75%,42%,1)`
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    const radius = 5;

    ctx.roundRect(
      b.x,
      b.y,
      b.w,
      b.h,
      radius
    );

    ctx.fill();

    ctx.strokeStyle =
      "rgba(255,255,255,.16)";

    ctx.stroke();

    ctx.restore();

  }

}


/* =========================================================
   رسم پدل
========================================================= */

function drawPaddle(){

  ctx.save();

  const gradient =
    ctx.createLinearGradient(
      paddle.x,
      paddle.y,
      paddle.x,
      paddle.y + paddle.height
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .3,
    "#8bb7ff"
  );

  gradient.addColorStop(
    1,
    "#4a72ff"
  );

  ctx.fillStyle = gradient;

  ctx.shadowColor =
    "rgba(70,130,255,.8)";

  ctx.shadowBlur = 14;

  ctx.beginPath();

  ctx.roundRect(
    paddle.x,
    paddle.y,
    paddle.width,
    paddle.height,
    7
  );

  ctx.fill();

  ctx.restore();

}


/* =========================================================
   رسم توپ
========================================================= */

function drawBall(){

  /*
   * trail
   */

  for(let i=0;i<trail.length;i++){

    const t = trail[i];

    ctx.save();

    ctx.globalAlpha =
      Math.max(0,t.life) * .35;

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      ball.r * (.35 + t.life * .45),
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

  }


  ctx.save();

  ctx.shadowColor =
    "#7db3ff";

  ctx.shadowBlur = 18;

  const gradient =
    ctx.createRadialGradient(
      ball.x - 2,
      ball.y - 2,
      1,
      ball.x,
      ball.y,
      ball.r
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .4,
    "#c9e0ff"
  );

  gradient.addColorStop(
    1,
    "#5790ff"
  );

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();

}


/* =========================================================
   رسم ذرات
========================================================= */

function drawParticles(){

  for(const p of particles){

    ctx.save();

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

  }

}


/* =========================================================
   رسم کامل
========================================================= */

function draw(){

  drawBackground();

  drawBricks();

  drawParticles();

  drawPaddle();

  drawBall();

}


/* =========================================================
   زمان‌بندی فریم
========================================================= */

function scheduleUpdate(){

  if(!running) return;

  if(framePending) return;

  framePending = true;

  animId =
    requestAnimationFrame(update);

}


/* =========================================================
   توقف حلقه
========================================================= */

function stopLoop(){

  if(animId !== null){

    cancelAnimationFrame(animId);

  }

  animId = null;

  framePending = false;

  lastFrameTime = 0;

}


/* =========================================================
   آپدیت اصلی بازی
========================================================= */

function update(timestamp){

  framePending = false;
  animId = null;

  if(!running) return;


  /*
   * جلوگیری از پرش توپ هنگام:
   * - افت FPS
   * - بازگشت از پس‌زمینه
   * - تغییر صفحه
   * - لگ موبایل
   */

  if(!lastFrameTime){

    lastFrameTime = timestamp;

  }

  let delta =
    timestamp - lastFrameTime;

  lastFrameTime = timestamp;

  delta =
    Math.min(
      Math.max(delta,0),
      32
    );

  const dt =
    delta / 16.6667;

  const dtSec =
    delta / 1000;


  /* =========================
     کنترل کیبورد
  ========================= */

  if(keys.left){

    paddle.x -=
      paddle.speed * dt;

  }

  if(keys.right){

    paddle.x +=
      paddle.speed * dt;

  }


  paddle.x =
    Math.max(
      0,
      Math.min(
        W - paddle.width,
        paddle.x
      )
    );


  /* =========================
     حرکت توپ
  ========================= */

  ball.x += ball.dx * dt;

  ball.y += ball.dy * dt;


  /* =========================
     دیواره چپ
  ========================= */

  if(ball.x - ball.r <= 0){

    ball.x = ball.r;

    ball.dx =
      Math.abs(ball.dx);

    sound(480);

  }


  /* =========================
     دیواره راست
  ========================= */

  if(ball.x + ball.r >= W){

    ball.x =
      W - ball.r;

    ball.dx =
      -Math.abs(ball.dx);

    sound(480);

  }


  /* =========================
     دیواره بالا
  ========================= */

  if(ball.y - ball.r <= 0){

    ball.y = ball.r;

    ball.dy =
      Math.abs(ball.dy);

    sound(560);

  }


  /* =========================
     trail
  ========================= */

  trail.push({

    x:ball.x,
    y:ball.y,
    life:1

  });

  if(trail.length > 14){

    trail.shift();

  }

  for(const t of trail){

    t.life -= .075 * dt;

  }


  /* =========================
     برخورد توپ با پدل
  ========================= */

  if(

    ball.dy > 0 &&

    ball.y + ball.r >= paddle.y &&

    ball.y - ball.r <=
      paddle.y + paddle.height &&

    ball.x >= paddle.x &&

    ball.x <=
      paddle.x + paddle.width

  ){

    ball.y =
      paddle.y - ball.r - .5;


    /*
     * محل برخورد توپ با پدل
     */

    const center =
      paddle.x + paddle.width / 2;

    const hit =
      (ball.x - center) /
      (paddle.width / 2);


    /*
     * سرعت ثابت و کنترل‌شده.
     * جلوی افقی‌شدن کامل مسیر توپ را می‌گیرد.
     */

    let vx =
      hit * baseSpeed * 1.08;

    const maxVx =
      baseSpeed * .92;

    vx =
      Math.max(
        -maxVx,
        Math.min(maxVx,vx)
      );

    const vy =
      -Math.sqrt(
        Math.max(
          .5,
          baseSpeed * baseSpeed -
          vx * vx
        )
      );

    ball.dx = vx;
    ball.dy = vy;

    sound(720);

  }


  /* =========================
     برخورد با آجرها
  ========================= */

  for(const b of bricks){

    if(!b.alive) continue;


    const hit =
      ball.x + ball.r > b.x &&
      ball.x - ball.r < b.x + b.w &&
      ball.y + ball.r > b.y &&
      ball.y - ball.r < b.y + b.h;


    if(hit){

      b.alive = false;

      score += 10;

      scoreEl.textContent =
        score;

      makeParticles(
        ball.x,
        ball.y,
        9
      );

      sound(
        360 +
        currentLevel * 80
      );


      /*
       * جهت توپ
       */

      ball.dy =
        -ball.dy;


      /*
       * اگر توپ داخل آجر رفت،
       * آن را بیرون می‌آوریم.
       */

      if(ball.dy < 0){

        ball.y =
          b.y - ball.r - .5;

      }else{

        ball.y =
          b.y + b.h + ball.r + .5;

      }


      updateProgress();

      break;

    }

  }


  /* =========================
     توپ از پایین خارج شد
  ========================= */

  if(ball.y - ball.r > H){

    lives--;

    updateLives();

    sound(180,.1);

    trail = [];

    if(lives <= 0){

      gameOver(false);

      return;

    }


    /*
     * توقف کوتاه برای ریست توپ
     */

    resetBall();

  }


  /* =========================
     ذرات
  ========================= */

  updateParticles(dtSec);


  /* =========================
     بررسی پایان مرحله
  ========================= */

  const remaining =
    bricks.some(b => b.alive);

  if(!remaining){

    levelComplete();

    return;

  }


  draw();

  scheduleUpdate();

}


/* =========================================================
   جان
========================================================= */

function updateLives(){

  let hearts = "";

  for(let i=0;i<lives;i++){

    hearts += "❤️";

  }

  if(lives <= 0){

    hearts = "💔";

  }

  livesEl.textContent = hearts;

}


/* =========================================================
   پایان مرحله
========================================================= */

function levelComplete(){

  stopLoop();

  running = false;

  makeParticles(
    W / 2,
    H / 2,
    45
  );

  draw();

  sound(900,.12);

  setTimeout(()=>{

    if(roundFinished) return;

    currentLevel++;

    if(currentLevel >= levels.length){

      gameOver(true);

      return;

    }


    overlay.classList.remove("hidden");

    overlay.style.display = "flex";

    overlayTitle.textContent =
      `🎉 ${levels[currentLevel - 1].name} تمام شد!`;

    overlayText.textContent =
      `مرحله بعد: ${levels[currentLevel].name} — ${levels[currentLevel].desc}`;

    mainBtn.textContent =
      "مرحله بعد ➜";

    restartBtn.classList.add("hidden");

  },500);

}


/* =========================================================
   پایان کامل بازی
========================================================= */

function gameOver(won){

  if(roundFinished) return;

  roundFinished = true;

  running = false;

  stopLoop();

  const finalScore = score;


  if(finalScore > getHighScore()){

    localStorage.setItem(
      "breakoutHigh",
      String(finalScore)
    );

    highScoreEl.textContent =
      finalScore;

  }


  overlay.style.display = "flex";

  overlay.classList.remove("hidden");

  overlayTitle.textContent =
    won
      ? "🏆 برنده شدی!"
      : "💥 بازی تمام شد";


  overlayText.textContent =
    won
      ? `هر ۵ مرحله را تمام کردی! امتیاز: ${finalScore}`
      : `امتیاز نهایی: ${finalScore}`;


  mainBtn.textContent =
    "ثبت نتیجه";


  restartBtn.classList.remove("hidden");

  submitGameResult(won);

}


/* =========================================================
   رکورد
========================================================= */

function getHighScore(){

  return Number(
    localStorage.getItem(
      "breakoutHigh"
    ) || 0
  );

}


/* =========================================================
   ثبت نتیجه
========================================================= */

async function submitGameResult(localWon){

  if(resultSubmitted) return;

  resultSubmitted = true;

  try{

    if(isSolo){

      try{

        const { soloWon } =
          await import("../js/app.js");

        if(typeof soloWon === "function"){

          await soloWon(
            GAME_ID,
            score
          );

        }

      }catch{}

      await recordRoundResult(
        GAME_ID,
        myUid,
        myName,
        score,
        localWon
      );

      return;

    }


    await submitResult(
      GAME_ID,
      myUid,
      myName,
      score
    );

  }catch(err){

    console.error(
      "submitGameResult:",
      err
    );

  }

}


/* =========================================================
   ادامه مرحله
========================================================= */

function continueLevel(){

  stopLoop();

  roundFinished = false;

  running = true;

  overlay.style.display = "none";

  overlay.classList.add("hidden");

  startLevel();

  draw();

  scheduleUpdate();

}


/* =========================================================
   شروع بازی
========================================================= */

function startGame(){

  stopLoop();

  currentLevel = 0;

  score = 0;

  lives = 3;

  baseSpeed = levels[0].speed;

  running = true;

  roundFinished = false;

  resultSubmitted = false;

  scoreboardShown = false;

  particles = [];

  trail = [];

  scoreEl.textContent = "0";

  highScoreEl.textContent =
    getHighScore();

  updateLives();

  overlay.style.display = "none";

  overlay.classList.add("hidden");

  roomResults.style.display = "none";

  startLevel();

  draw();

  scheduleUpdate();

}


/* =========================================================
   حرکت پدل
========================================================= */

function movePaddle(x){

  const rect =
    canvas.getBoundingClientRect();

  const scaleX =
    W / rect.width;

  const canvasX =
    (x - rect.left) * scaleX;

  paddle.x =
    canvasX -
    paddle.width / 2;

  paddle.x =
    Math.max(
      0,
      Math.min(
        W - paddle.width,
        paddle.x
      )
    );

}


/* =========================================================
   موس
========================================================= */

canvas.addEventListener(
  "mousemove",
  e => {

    if(!running) return;

    movePaddle(e.clientX);

  }
);


/* =========================================================
   لمس
========================================================= */

canvas.addEventListener(
  "touchstart",
  e => {

    if(!running) return;

    const touch =
      e.touches[0];

    if(touch){

      movePaddle(
        touch.clientX
      );

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchmove",
  e => {

    if(!running) return;

    e.preventDefault();

    const touch =
      e.touches[0];

    if(touch){

      movePaddle(
        touch.clientX
      );

    }

  },
  {passive:false}
);


/* =========================================================
   کیبورد
========================================================= */

window.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      keys.left = true;

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      keys.right = true;

    }

  }
);


window.addEventListener(
  "keyup",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      keys.left = false;

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      keys.right = false;

    }

  }
);


/* =========================================================
   دکمه‌ها
========================================================= */

mainBtn.addEventListener(
  "click",
  () => {

    sound(650,.06);

    /*
     * اگر بازی تمام شده،
     * دکمه اول نتیجه را ثبت کرده و
     * فقط نمایش را نگه می‌دارد.
     */

    if(roundFinished){

      if(!resultSubmitted){

        submitGameResult(
          score >= 100,
          true
        );

      }

      return;

    }


    /*
     * اگر وسط مراحل هستیم،
     * مرحله بعد را شروع کن.
     */

    if(currentLevel > 0){

      continueLevel();

    }else{

      startGame();

    }

  }
);


restartBtn.addEventListener(
  "click",
  () => {

    sound(500,.05);

    startGame();

  }
);


/* =========================================================
   نمایش اولیه
========================================================= */

highScoreEl.textContent =
  getHighScore();

updateLives();

startLevel();

draw();


/* =========================================================
   اتصال به اتاق دومیتو
========================================================= */

function startRoomListener(){

  if(isSolo) return;

  if(!roomCode) return;

  try{

    const ref =
      roomRef(roomCode);

    onValue(
      ref,
      snap => {

        const data =
          snap.val();

        if(!data) return;

        const players =
          data.players || {};

        const results =
          data.results || {};


        const playerIds =
          Object.keys(players);

        if(playerIds.length === 0)
          return;


        /*
         * فقط وقتی همه نتیجه داده‌اند
         */

        let allFinished = true;

        for(const uid of playerIds){

          if(!results[uid]){

            allFinished = false;

            break;

          }

        }


        if(
          allFinished &&
          Object.keys(results).length >=
          playerIds.length
        ){

          showFinalScoreBoard(
            results
          );

        }

      }
    );

  }catch(err){

    console.error(
      "room listener:",
      err
    );

  }

}


/* =========================================================
   جدول نتایج
========================================================= */

async function showFinalScoreBoard(results){

  /*
   * بسیار مهم:
   * listener فایربیس ممکن است چند بار اجرا شود.
   * بنابراین جدول فقط یک بار ساخته می‌شود.
   */

  if(scoreboardShown) return;

  scoreboardShown = true;


  const rows =
    Object.entries(results)
      .map(([uid,data]) => ({

        uid,

        name:
          data?.name ||
          "بازیکن",

        score:
          Number(data?.score || 0)

      }))
      .sort(
        (a,b) =>
          b.score - a.score
      );


  if(rows.length === 0){

    scoreboardShown = false;

    return;

  }


  const winnerScore =
    rows[0].score;


  resultsList.innerHTML =
    rows.map((r,index)=>{

      const isMe =
        r.uid === myUid;

      const medal =
        index === 0
          ? "🥇"
          : index === 1
            ? "🥈"
            : index === 2
              ? "🥉"
              : "▫️";

      return `
        <div class="resultRow ${isMe ? "me" : ""}">
          <div class="resultName">
            ${medal}
            ${escapeHtml(r.name)}
          </div>

          <div class="resultScore">
            ${r.score}
          </div>
        </div>
      `;

    }).join("");


  roomResults.style.display =
    "flex";


  /*
   * ثبت نتیجه دور فقط یک بار
   */

  try{

    const me =
      rows.find(
        r => r.uid === myUid
      );

    if(me){

      const won =
        me.score === winnerScore;

      await recordRoundResult(
        GAME_ID,
        myUid,
        myName,
        me.score,
        won
      );

    }

  }catch(err){

    console.error(
      "recordRoundResult:",
      err
    );

  }

}


/* =========================================================
   بستن نتایج
========================================================= */

resultClose.addEventListener(
  "click",
  () => {

    roomResults.style.display =
      "none";

  }
);


/* =========================================================
   جلوگیری از HTML تزریقی نام
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   ورود کاربر دومیتو
========================================================= */

async function initDomito(){

  try{

    await waitForUser();

  }catch{}

  try{

    myUid =
      currentUid();

  }catch{

    myUid = null;

  }


  try{

    myName =
      getSavedName() ||
      "بازیکن";

  }catch{

    myName = "بازیکن";

  }


  /*
   * اگر UID موجود نبود، یک شناسه موقت
   * برای حالت بازی ایجاد نمی‌کنیم؛
   * چون نتیجه دومیتو باید به کاربر واقعی وصل شود.
   */

  if(!myUid){

    console.warn(
      "Domito UID not available"
    );

  }


  startRoomListener();

}


/* =========================================================
   اجرا
========================================================= */

initDomito();

</script>
