<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حروف به‌هم‌ریخته | دومیتو</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">🔤</div>
      <h1>حروف به‌هم‌ریخته</h1>
    </div>

    <div class="card" id="playArea">
      <h2 id="qCounter">سوال ۱ از ۵</h2>
      <p class="muted" style="margin:-8px 0 6px;">این حروف به‌هم‌ریخته کدوم کلمه‌ست؟</p>
      <p id="qText" style="font-size:26px; font-weight:900; text-align:center; letter-spacing:4px; margin:10px 0 20px;"></p>
      <div id="options"></div>
    </div>

    <div class="card" id="waitArea" style="display:none">
      <h2>نتیجه تو ثبت شد</h2>
      <p class="status-line" id="waitStatus">در انتظار بقیه بازیکن‌ها...</p>
    </div>

    <div class="card" id="scoreArea" style="display:none">
      <h2>نتیجه این دور</h2>
      <div class="score-board" id="scoreBoard"></div>
      <p class="status-line">به زودی برمی‌گردیم به سالن...</p>
    </div>
  </div>

<script type="module">
  import {
    sessionRef, onValue, ensureAuth, getSavedName,
    submitResult, resetSessionForNextRound, recordRoundResult
  } from "../js/app.js";
  import { mountChat } from "../js/chat.js";

  const WORD_POOL = [
    "دومینو", "بازی", "کامپیوتر", "کتابخانه", "دوستی", "خورشید", "دریا", "کوهستان",
    "پرنده", "موسیقی", "شکلات", "هواپیما", "جنگل", "رنگین‌کمان", "ستاره", "باران",
    "دانشگاه", "روزنامه", "تلفن", "قهوه",
  ];

  function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

  function scrambleWord(word) {
    const letters = word.split("");
    let attempts = 0;
    let scrambled;
    do {
      scrambled = shuffle([...letters]).join("");
      attempts++;
    } while (scrambled === word && attempts < 10);
    return scrambled;
  }

  function generateQuestions(n) {
    const chosen = shuffle([...WORD_POOL]).slice(0, n);
    return chosen.map((word) => {
      const distractors = shuffle(WORD_POOL.filter((w) => w !== word)).slice(0, 3);
      const options = shuffle([word, ...distractors]);
      return { scrambled: scrambleWord(word), options, correct: options.indexOf(word) };
    });
  }

  const questions = generateQuestions(5);
  let idx = 0;
  let correctCount = 0;
  let myUid, myName;
  let players = {};

  const qCounter = document.getElementById("qCounter");
  const qText = document.getElementById("qText");
  const optionsEl = document.getElementById("options");

  function renderQuestion() {
    const q = questions[idx];
    qCounter.textContent = `سوال ${idx + 1} از ${questions.length}`;
    qText.textContent = q.scrambled;
    optionsEl.innerHTML = "";
    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "quiz-option";
      btn.textContent = opt;
      btn.addEventListener("click", () => answer(i));
      optionsEl.appendChild(btn);
    });
  }

  function answer(i) {
    const q = questions[idx];
    const buttons = optionsEl.querySelectorAll(".quiz-option");
    buttons.forEach((b) => (b.disabled = true));
    buttons[q.correct].classList.add("correct");
    if (i !== q.correct) buttons[i].classList.add("wrong");
    if (i === q.correct) correctCount++;

    setTimeout(() => {
      idx++;
      if (idx < questions.length) {
        buttons.forEach((b) => { b.disabled = false; b.classList.remove("correct", "wrong"); });
        renderQuestion();
      } else {
        finish();
      }
    }, 700);
  }

  async function finish() {
    document.getElementById("playArea").style.display = "none";
    document.getElementById("waitArea").style.display = "block";
    const score = correctCount * 10;
    await submitResult("scramble", myUid, myName, score);
  }

  async function init() {
    myUid = await ensureAuth();
    myName = getSavedName();
    if (!myName) { window.location.href = "../index.html"; return; }
    mountChat(myName);

    onValue(sessionRef("players"), (snap) => { players = snap.val() || {}; });

    renderQuestion();

    let handled = false;
    onValue(sessionRef("results"), async (snap) => {
      const results = snap.val() || {};
      const totalPlayers = Object.keys(players).length;
      const totalResults = Object.keys(results).length;
      document.getElementById("waitStatus").textContent = `${totalResults} از ${totalPlayers} نفر تموم کردن`;

      if (handled || totalPlayers === 0 || totalResults < totalPlayers) return;
      handled = true;

      const maxScore = Math.max(...Object.values(results).map((r) => r.score));
      const won = results[myUid]?.score === maxScore;
      await recordRoundResult(myName, "scramble", { won });

      document.getElementById("waitArea").style.display = "none";
      const scoreArea = document.getElementById("scoreArea");
      scoreArea.style.display = "block";
      const board = document.getElementById("scoreBoard");
      board.innerHTML = "";
      Object.entries(results)
        .sort((a, b) => b[1].score - a[1].score)
        .forEach(([uid, r]) => {
          const row = document.createElement("div");
          row.className = "score-row" + (r.score === maxScore ? " winner" : "");
          row.innerHTML = `<span>${r.name}</span><span class="points">${r.score}</span>`;
          board.appendChild(row);
        });

      setTimeout(async () => {
        await resetSessionForNextRound();
        window.location.href = "../lobby.html";
      }, 4000);
    });
  }
  init();
</script>
</body>
</html>
