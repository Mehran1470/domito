<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#11111d;overflow:hidden;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;color:#fff}
#root{position:fixed;inset:0;overflow:hidden}
html.rot #root{inset:auto;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;transform:translateX(100vw) rotate(90deg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;direction:ltr;font-weight:700;text-shadow:0 2px 0 #000a}
#hpw{width:min(44vw,190px)}
#hpbar{height:14px;background:#1c1830;border:2px solid #0b0916;border-radius:3px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(#ff6a5a,#d8352a);transition:width .15s}
#hptxt{font-size:12px;margin-top:2px;direction:ltr;opacity:.9}
#info{text-align:right;direction:rtl;font-size:14px;line-height:1.5}
#info b{color:#ffd23a}
#combo{position:fixed;top:max(56px,calc(env(safe-area-inset-top) + 48px));left:0;right:0;text-align:center;pointer-events:none;direction:rtl;opacity:0;transition:opacity .15s}
#combo.on{opacity:1}
#cnum{direction:ltr;font:900 40px/1 "Courier New",monospace;color:#fff;-webkit-text-stroke:2px #1a0f2a;text-shadow:0 3px 0 #1a0f2a}
#clab{font-size:13px;font-weight:700;text-shadow:0 2px 0 #000a}
#cbar{width:110px;height:5px;margin:4px auto 0;background:#0008;border-radius:3px;overflow:hidden}
#cfill{height:100%;background:#ffd23a;width:100%}
#banner{position:fixed;top:38%;left:0;right:0;text-align:center;font-size:30px;font-weight:900;pointer-events:none;opacity:0;text-shadow:0 3px 0 #000a;transition:opacity .3s}
#banner.on{opacity:1}
#toast{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:20px;font-weight:800;color:#ffe680;pointer-events:none;opacity:0;text-shadow:0 2px 0 #000a;transition:opacity .25s}#toast.on{opacity:1}
#pad,#acts{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end;direction:ltr;z-index:5}
#pad{left:14px}
#acts{right:14px}
.b{width:64px;height:64px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff55;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:800;backdrop-filter:blur(2px)}
.b.on{background:#ffffff66;transform:scale(.94)}
.b.big{width:92px;height:92px;background:#e8453a77;border-color:#ffb0a8aa;font-size:17px}
.b small{font-size:11px;display:block;font-weight:600}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;gap:12px;align-items:flex-end}
#skb{position:relative;overflow:hidden}
#skcd{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}
#ub{position:relative;overflow:hidden}#ucd{position:absolute;left:0;right:0;bottom:0;background:#000b;height:100%}
#ub.rdy{background:#4aa0ffaa;border-color:#e8fbff;animation:pl .5s infinite alternate}@keyframes pl{to{box-shadow:0 0 18px 4px #7fd0ff}}
#ov{position:fixed;inset:0;background:radial-gradient(#1a1630dd,#0b0916f2);display:flex;align-items:flex-start;justify-content:center;z-index:10;padding:16px;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#ov, #ov *{touch-action:pan-y}
#ov .btn, #ov .wcard, #ov .up{touch-action:manipulation;cursor:pointer}
#ov.hide{display:none}
.card{max-width:520px;width:100%;text-align:center;margin:auto;padding:8px 0 calc(20px + env(safe-area-inset-bottom))}
#ov .btn{display:inline-flex;align-items:center;justify-content:center;min-width:150px;min-height:50px;position:relative;z-index:2}
@media(max-height:700px){h1{font-size:36px}.worlds{margin:6px 0;gap:5px}.wcard{width:78px;height:60px}#ov p{margin:4px 0;line-height:1.55;font-size:13px}#ov .sm{font-size:11px}}
h1{font-size:44px;margin:0 0 4px;color:#ffd23a;text-shadow:0 4px 0 #7a3a10;letter-spacing:0}
h2{font-size:26px;margin:0 0 10px}
p{margin:6px 0;line-height:1.8;opacity:.92;font-size:15px}
.btn{display:inline-block;margin-top:14px;background:#e8453a;border:0;border-bottom:4px solid #8a2018;color:#fff;font:800 20px inherit;font-family:inherit;padding:10px 34px;border-radius:10px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.ups{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.up{background:#2a2450;border:2px solid #6a5ac8;border-radius:12px;padding:12px;text-align:right;color:#fff;font-family:inherit}
.up b{display:block;font-size:18px;color:#ffd23a}
.up span{font-size:14px;opacity:.9}
.sm{font-size:12px;opacity:.65}
.worlds{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.wcard{width:84px;height:72px;background:#2a2450;border:2px solid #6a5ac8;border-radius:10px;color:#fff;font-size:22px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px}
.wcard small{font-size:10px;margin-top:2px;line-height:1.2}
.wcard.sel{border-color:#ffd23a;background:#4a3a8a}.wcard.lock{opacity:.45}

<script>
'use strict';
/* ===== setup ===== */
const cv=document.getElementById('c'), cx=cv.getContext('2d');
const lc=document.createElement('canvas'), g=lc.getContext('2d');
const $=id=>document.getElementById(id);
const WORLD=1800;
let W,H,S,lw,lh,GY,T=0;
const fa=n=>Math.round(n).toLocaleString('fa-IR');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function srand(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function disc(c,x,y,r,col){x=Math.round(x);y=Math.round(y);r=Math.round(r);c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));c.fillRect(x-w,y+dy,w*2+1,1)}}
function pxEll(c,x,y,rx,ry,col){x=Math.round(x);y=Math.round(y);c.fillStyle=col;if(ry<1){c.fillRect(x-rx,y,rx*2+1,1);return}
  for(let dy=-ry;dy<=ry;dy++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));c.fillRect(x-w,y+dy,w*2+1,1)}}
const R=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rr=(a,b)=>a+Math.random()*(b-a);

/* ===== vibration ===== */
let vibLast=0;
function vib(p,force){try{const n=performance.now();if(!force&&n-vibLast<40)return;vibLast=n;navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ===== audio ===== */
let AC=null;
function sfx(f,d,type='square',vol=.06,slide=0){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
    gn.gain.value=vol;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

/* ===== background art (procedural pixel art) ===== */
let world=0,ww=1,portal=null,transT=0,transTo=0,awaitPortal=false,selW=0,unlocked=0;
try{unlocked=Math.min(4,+localStorage.getItem('tf_worlds')||0)}catch(e){}
function saveUnlock(i){if(i>unlocked){unlocked=i;try{localStorage.setItem('tf_worlds',String(i))}catch(e){}}}
const WORLDS=[
{kind:'forest',name:'جنگل زمردی',icon:'🌲',boss:'پادشاه اسلایم',
 pal:{s:['#4a8cf0','#86b8ff','#2e5fc0'],f:['#e0643a','#ff9a6a','#a83a20'],b:['#7a5ad8','#a58cf5','#4e36a0'],w:['#3b3358','#6a5c9a','#2a2444'],p:['#e0506a','#ff8aa0','#a02a42'],k:['#d83a5a','#ff7a9a','#8a1a38']},
 shot:'#ff6a8a',ray:'rgba(255,250,190,.07)',fill:'#6b4020',shadow:'rgba(20,50,20,.35)',pond:['#2a86b0','#3cb4d0','#bff0ff'],arch:['#9a6428','#d89a4a','#6aa83a','#8fd04a'],tint:null},
{kind:'desert',name:'صحرای سوزان',icon:'🏜️',boss:'عقرب غول‌پیکر',
 pal:{s:['#c9a04a','#f0d080','#8a6a22'],f:['#e08a3a','#ffc070','#a85a1a'],b:['#b07a40','#d8a868','#7a4a22'],w:['#8a6a4a','#c8a070','#5a4028'],p:['#4fa84a','#8fd870','#2f6a2c'],k:['#a8602a','#e09858','#6a3412']},
 shot:'#ffe06a',ray:'rgba(255,220,140,.08)',fill:'#a8783a',shadow:'rgba(90,60,20,.35)',pond:['#2a9ab0','#48c8d0','#d8fff8'],arch:['#b08848','#e8c078','#c8a050','#f0d890'],tint:[255,170,60,.07]},
{kind:'ice',name:'سرزمین یخی',icon:'❄️',boss:'غول یخی',
 pal:{s:['#7fd0ff','#d8f4ff','#4a9ad8'],f:['#a0e8ff','#ffffff','#60b0e0'],b:['#d0e8ff','#ffffff','#8ab0d8'],w:['#dff4ff','#ffffff','#9ac8e8'],p:['#5ac8ff','#bff0ff','#2a88c8'],k:['#4a9ae8','#a0d8ff','#2a5aa8']},
 shot:'#bff0ff',ray:'rgba(190,235,255,.07)',fill:'#7aa8c8',shadow:'rgba(20,40,80,.35)',pond:['#bfe4f8','#e8f8ff','#ffffff'],arch:['#8ac0e8','#e0f4ff','#bff0ff','#ffffff'],tint:[120,170,255,.06]},
{kind:'lava',name:'آتشفشان',icon:'🌋',boss:'تایتان گدازه',
 pal:{s:['#ff6a2a','#ffb060','#b02a0a'],f:['#ffa020','#ffe080','#c86a0a'],b:['#5a3a3a','#ff6a2a','#2a1a1a'],w:['#6a2a2a','#ff8a3a','#3a1010'],p:['#ff4a2a','#ffa060','#8a1a0a'],k:['#3a2424','#ff7a2a','#1a0e0e']},
 shot:'#ff8a2a',ray:'rgba(255,100,40,.06)',fill:'#1a1216',shadow:'rgba(0,0,0,.4)',pond:['#c8320a','#ff7a1a','#ffe080'],arch:['#2a2024','#5a4048','#ff6a2a','#ffb060'],tint:[255,60,20,.10]},
{kind:'void',name:'کهکشان تاریک',icon:'🌌',boss:'ارباب خلأ',
 pal:{s:['#6a3aa8','#b084f0','#3a1a6a'],f:['#c84ae0','#f0a0ff','#7a1a98'],b:['#2a1a4a','#8a5ae0','#120a28'],w:['#4a2a88','#e06aff','#2a1450'],p:['#8a4ae8','#d8b0ff','#4a1a98'],k:['#1a0a3a','#c04aff','#0a0420']},
 shot:'#c04aff',ray:'rgba(190,120,255,.07)',fill:'#120a28',shadow:'rgba(0,0,20,.4)',pond:['#2a1060','#7a3ae0','#e0b8ff'],arch:['#4a2a98','#b084f0','#e0b8ff','#8ad8ff'],tint:[150,60,220,.10]}
];
const BOSS=[{},{n:3,sp:.22,iv:3},{n:2,sp:.1,iv:2.4,low:1},{n:5,sp:.3,iv:3.2},{n:5,sp:.25,iv:2.6,blink:1}];
function pal(t){return t==='g'?TYPES.g.col:(WORLDS[world].pal[t]||TYPES[t].col)}
let skyC,farC,midC,groundC,trunkC,PROPS=[];
function trunkTile(){
  const w=960,h=300,c=mk(w,h),x=c.getContext('2d'),r=srand(321);
  [[140,34],[470,28],[820,38]].forEach(([tx,tw],i)=>{
    for(let y=0;y<h;y++){const flare=y>h-30?Math.round((y-(h-30))*.5):0,o=Math.round(Math.sin(y/40+i)*3);
      x.fillStyle='#3b2a18';x.fillRect(tx+o-flare,y,tw+flare*2,1);
      x.fillStyle='#5a4026';x.fillRect(tx+o-flare+2,y,tw+flare*2-6,1);
      x.fillStyle='#7a5a34';x.fillRect(tx+o-flare+3,y,3,1)}
    for(let k=0;k<26;k++){x.fillStyle=r()<.5?'#3b2a18':'#8a6a3e';x.fillRect(tx+Math.floor(r()*tw),Math.floor(r()*h),1,3+Math.floor(r()*6))}
    for(let k=0;k<7;k++){const my=Math.floor(r()*h),mx=tx+Math.floor(r()*tw*.4);x.fillStyle='#4f9a3a';x.fillRect(mx,my,4+Math.floor(r()*6),3);x.fillStyle='#7fcf5a';x.fillRect(mx,my,3,1)}
  });
  return c;
}
function canopyTile(w,h,seed,cols,n,r0,r1,tr){
  const c=mk(w,h),x=c.getContext('2d'),r=srand(seed);
  for(let i=0;i<Math.floor(n*.7);i++){
    const tx=Math.floor(r()*w),tw=4+Math.floor(r()*4);
    for(let y=Math.floor(h*.35);y<h;y++){const o=Math.round(Math.sin(y/18+i)*2);
      [-w,0,w].forEach(d=>{x.fillStyle=tr[0];x.fillRect(tx+o+d,y,tw,1);x.fillStyle=tr[1];x.fillRect(tx+o+d,y,1,1);x.fillRect(tx+o+d,y,Math.max(1,tw>>2),1)})}
  }
  for(let i=0;i<n;i++){
    const bx=r()*w,by=h*.12+r()*h*.36,rad=r0+r()*(r1-r0);
    [-w,0,w].forEach(d=>{disc(x,bx+d,by,rad,cols[0]);disc(x,bx+d-rad*.12,by-rad*.18,rad*.88,cols[1]);disc(x,bx+d-rad*.3,by-rad*.36,rad*.48,cols[2])});
  }
  return c;
}
function groundTile(){
  const w=128,h=70,c=mk(w,h),x=c.getContext('2d'),r=srand(77);
  x.fillStyle='#8a5a2b';x.fillRect(0,8,w,h-8);
  for(let i=0;i<170;i++){x.fillStyle=r()<.5?'#9c6b36':'#744a22';x.fillRect(Math.floor(r()*w),12+Math.floor(r()*(h-12)),2+Math.floor(r()*3),1+Math.floor(r()*2))}
  for(let i=0;i<4;i++){const rx=Math.floor(r()*w),ry=22+Math.floor(r()*30),a=7+Math.floor(r()*5),b=5+Math.floor(r()*3);
    [-w,0,w].forEach(d=>{pxEll(x,rx+d,ry,a,b,'#6a4220');pxEll(x,rx+d-1,ry-1,a-1,b-1,'#b57a3c');pxEll(x,rx+d-2,ry-2,a-3,b-3,'#cf9450')})}
  for(let i=0;i<5;i++){const rx=Math.floor(r()*w);x.fillStyle='#5a3a1a';for(let y=10;y<26;y++){const o=Math.round(Math.sin(y/4+i)*2);x.fillRect(rx+o,y,2,1)}}
  for(let px=0;px<w;px++){
    const d=7+Math.round(Math.sin(px/w*Math.PI*4)*1.5+Math.sin(px/w*Math.PI*14)*1.2);
    x.fillStyle='#3d7a2c';x.fillRect(px,d+3,1,3);
    x.fillStyle='#5fa83a';x.fillRect(px,2,1,d+1);
    x.fillStyle='#8fd04a';x.fillRect(px,2,1,2);
    if(r()<.15){x.fillStyle='#8fd04a';x.fillRect(px,0,1,3)}
  }
  for(let i=0;i<7;i++){const fx=Math.floor(r()*w);x.fillStyle=i%2?'#fff':'#ffb0d0';x.fillRect(fx,1,2,2);x.fillStyle='#ffd23a';x.fillRect(fx,2,1,1)}
  return c;
}
function drawVines(){
  for(let i=0;i<10;i++){const L=1730,vx=Math.round((((i*173-cam.x*.6)%L)+L)%L-100),len=36+((i*37)%50);
    for(let y=0;y<len;y++){const x=vx+Math.round(Math.sin(y/9+T+i)*1.5);R('#3f8a3a',x,y,2,1);if(y%8===4)R('#7fcf5a',x+1,y,3,2)}}
}

function mountainTile(w,h,seed,cols,cap,vein){
  const c=mk(w,h),x=c.getContext('2d'),r=srand(seed);
  const f=[1,3,7].map((k,i)=>({k,ph:r(),a:[.5,.3,.2][i]}));
  const hh=px=>{let v=0;f.forEach(o=>{const t=((px/w*o.k+o.ph)%1+1)%1;v+=o.a*(1-Math.abs(t*2-1))});return h*(.25+v*.7)};
  for(let px=0;px<w;px++){const top=h-hh(px);
    for(let y=Math.floor(top);y<h;y++){const d=y-top;x.fillStyle=(cap&&d<4+((px*7)%3))?cap:(d>h*.5?cols[2]:(px%7<3?cols[1]:cols[0]));x.fillRect(px,y,1,1)}}
  if(vein){x.fillStyle=vein;for(let i=0;i<18;i++){let px=Math.floor(r()*w),yy=h-hh(px)+4;for(let k=0;k<12+r()*14;k++){x.fillRect(px,Math.floor(yy),1,2);yy+=2;px+=Math.round(r()*2-1);if(px<0||px>=w)break}}}
  return c;
}
function duneTile(w,h,seed,cols){
  const c=mk(w,h),x=c.getContext('2d'),r=srand(seed);
  for(let i=0;i<3;i++){const mx=Math.floor(r()*(w-90)),mw=30+Math.floor(r()*40),mh=40+Math.floor(r()*50);
    x.fillStyle=cols[2];x.fillRect(mx,h-mh,mw,mh);x.fillStyle=cols[1];x.fillRect(mx,h-mh,mw,3);
    for(let y=h-mh+8;y<h;y+=9){x.fillStyle=cols[0];x.fillRect(mx,y,mw,2)}}
  for(let l=0;l<2;l++){const a=[16,10][l],ph=r()*6.28;
    for(let px=0;px<w;px++){const top=h*(.55+.14*l)-Math.sin(px/w*Math.PI*2*(l+1)+ph)*a-Math.sin(px/w*Math.PI*2*(l+3))*4;
      x.fillStyle=cols[l];x.fillRect(px,Math.floor(top),1,h);x.fillStyle=cols[1];x.fillRect(px,Math.floor(top),1,2)}}
  return c;
}
function cactiOn(c,seed,cols,n){
  const x=c.getContext('2d'),r=srand(seed),w=c.width,h=c.height;
  for(let i=0;i<n;i++){const px=Math.floor(r()*w),ch=30+Math.floor(r()*40);
    x.fillStyle=cols[0];x.fillRect(px,h-ch,6,ch);x.fillStyle=cols[1];x.fillRect(px,h-ch,2,ch);
    x.fillStyle=cols[0];x.fillRect(px-8,h-ch*.6,8,3);x.fillRect(px-8,h-ch*.6-10,3,12);x.fillRect(px+6,h-ch*.5,8,3);x.fillRect(px+11,h-ch*.5-9,3,11);
    x.fillStyle=cols[1];x.fillRect(px-8,h-ch*.6-10,1,12)}
}
function pineTile(w,h,seed,cols,snow,n){
  const c=mk(w,h),x=c.getContext('2d'),r=srand(seed);
  for(let i=0;i<n;i++){const px=Math.floor(r()*w),ph=40+Math.floor(r()*60),pw=14+Math.floor(r()*12);
    [-w,0,w].forEach(d=>{x.fillStyle='#4a3a30';x.fillRect(px+d-1,h-8,3,8);

function nearestEnemy(range){let b=null,bd=range;for(const e of enemies){const d=Math.abs(e.x-P.x);if(d<bd){bd=d;b=e}}return b}
const WP={
  sword:{n:3,dur:[0,.16,.16,.25],mult:[0,1,1.2,1.9],reach:[0,28,28,36],kb:[0,75,75,150],lift:[0,235,235,300],win:[.25,.75],cancel:.6,hs:.045},

function isSpin(){return P.weapon==='sword'?P.step===3:P.weapon==='axe'?P.step===2:false}

}

/* ===== update ===== */
function update(dt){
  T+=dt;flashT=Math.max(0,flashT-dt);
  for(const f of fxs)f.t+=dt;fxs=fxs.filter(f=>f.t<f.life);
  // fx always
  for(const p of pops){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy*=.92}
  pops=pops.filter(p=>p.t<p.life);
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.z+=p.vz*dt;p.vz-=p.g*dt;if(p.z<0){p.z=0;p.vz*=-.3;p.vx*=.6}}
  parts=parts.filter(p=>p.t<p.life);
  if(window.DOMITO_DEADLINE&&(state==='play'||state==='upgrade')&&Date.now()>=window.DOMITO_DEADLINE){P.hp=0;gameOver();return}
  if(state!=='play')return;
  if(hitstop>0){hitstop-=dt;return}
  for(let i=later.length-1;i>=0;i--){later[i].t-=dt;if(later[i].t<=0){const f=later.splice(i,1)[0];f.fn()}}
  shake*=.88;
  if(ultT>0){ultT-=dt;const el=1.5-ultT;
    while(ultTicks<6&&el>=.4+ultTicks*.15){ultTick(ultTicks===5);ultTicks++}
    P.vx*=.8;P.inv=Math.max(P.inv,.2);if(P.z>0)P.vz=Math.max(P.vz,0)}

  // --- player
  const lock=ultT>0||transT>0;
  const dir=lock?0:((keys.left?1:0)*-1+(keys.right?1:0));
  if(edge.dash&&P.dashCd<=0&&!P.plunge&&!lock){vib(12,true);P.dash=.14;P.dashCd=.15;P.inv=Math.max(P.inv,.22);if(dir)P.face=dir;P.atk=0;sfx(300,.12,'triangle',.05,-150);
    for(let i=0;i<5;i++)parts.push({x:P.x,z:rr(2,14),vx:-P.face*rr(20,60),vz:rr(0,30),life:.3,t:0,col:'#e8f8d0',sz:2,g:0})}
  if(P.dash>0){P.dash-=dt;P.vx=P.face*400}
  else{
    const sp=P.atk>0&&P.z<1?40:96;
    P.vx+=(dir*sp-P.vx)*Math.min(1,dt*(P.z>0?6:14));
    if(dir&&P.atk<=0)P.face=dir;
  }
  if(edge.jump&&P.jumps<2&&!P.plunge&&!lock){P.vz=P.jumps===0?275:235;P.jumps++;P.z+=.1;sfx(260,.12,'square',.04,260);
    for(let i=0;i<4;i++)parts.push({x:P.x,z:1,vx:rr(-30,30),vz:rr(10,40),life:.3,t:0,col:'#d8f0b0',sz:1,g:200})}
  const hov=P.hovering&&keys.atk&&!P.plunge&&P.z>6&&P.hoverT>0;
  if(P.hovering&&!keys.atk){P.hovering=false;
    if(P.weapon==='axe'&&P.z>6&&!P.plunge){P.plunge=true;P.vz=-580;P.vx=0;P.atk=0;P.comboWin=0;sfx(500,.3,'sawtooth',.06,-380)}}
  if(hov){P.hoverT-=dt;P.vz=0;if(Math.random()<dt*25)parts.push({x:P.x+rr(-4,4),z:P.z-2,vx:rr(-8,8),vz:-rr(10,30),life:.3,t:0,col:'#8fd8ff',sz:1,g:0})}
  else P.vz-=900*dt;
  P.z+=P.vz*dt;if(P.z<=0){if(P.z<-.01&&P.vz<-150)for(let i=0;i<3;i++)parts.push({x:P.x,z:1,vx:rr(-40,40),vz:rr(10,30),life:.25,t:0,col:'#d8f0b0',sz:1,g:200});P.z=0;P.vz=0;P.jumps=0;P.hovering=false;P.hoverT=3}
  if(P.plunge){P.vx=0;if(P.z<=0)slam()}
  P.x=clamp(P.x+P.vx*dt,8,WORLD-8);
  P.inv-=dt;P.dashCd-=dt;P.skillCd-=dt;P.comboWin-=dt;
  if(edge.swap&&!lock)swapWeapon();
  if(edge.atk||keys.atk)tryAttack();
  if(edge.skill)useSkill();
  if(edge.ult)useUlt();
  if(P.atk>0){P.atk-=dt;doAttackHits()}
  if(P.sk>0){P.sk-=dt;P.vz=Math.max(P.vz,0)*.5;
    if(P.pulses>0&&P.sk<.4-(4-P.pulses)*.1-.04){P.pulses--;skillPulse()}}
  edge.jump=edge.atk=edge.dash=edge.skill=edge.swap=edge.ult=0;

  // --- combo
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}

  // --- shared enemies: the room host runs AI and wave spawning.
  const coopReplica=coopEnabled&&!coopIsHost;
  if(!coopReplica){
  for(const e of enemies.slice()){
    const T0=TYPES[e.t];
    e.flash-=dt;
    if(e.t==='g'){e.life-=dt;if(Math.random()<dt*20)parts.push({x:e.x+rr(-6,6),z:e.z+rr(0,12),vx:0,vz:rr(10,30),life:.5,t:0,col:'#fff0a0',sz:1,g:0});
      if(e.life<=0){kill(e,true);banner('اسلایم طلایی فرار کرد',1200);continue}}
    const prevZ=e.z;

const GID = "thousandfold";
const TF_TIME = 180;                 // طول هر دور تیمی (ثانیه)
const FRESH_MS = 10000;              // بازیکنی که بیشتر از این ساکت باشد آفلاین حساب می‌شود
const params = new URLSearchParams(location.search);
const code = String(getSavedRoom() || "").trim().toUpperCase();
const round = String(params.get("round") || "r").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40) || "r";
const isSolo = params.has("solo") || !code;
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toArr = v => Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === "object" ? Object.values(v) : []);
const clean = o => JSON.parse(JSON.stringify(o));
const base = p => ref(db, `rooms/${code}/thousandfold/${round}${p ? "/" + p : ""}`);

let myUid = "", myName = "";
let nodes = {}, session = null, offset = 0;
let finished = false, netOn = false, hbBusy = false, claiming = false, lastErrShown = 0;
const knownResults = {};
const now = () => Date.now() + offset;     // زمان تقریبی سرور؛ از اختلاف ساعت گوشی‌ها جلوگیری می‌کند

window.DOMITO_MODE = true;
window.DOMITO_DEADLINE = 0;
window.onDomitoScore = d => finish(d);
function show(html){ document.getElementById("ovc").innerHTML = html; document.getElementById("ov").classList.remove("hide"); }
function setStatus(t){ const s = document.getElementById("coopMenuStatus"); if (s) s.textContent = t; }

function netFail(error){
  console.error("Domito co-op error:", error);
  if (finished) return;
  const perm = /PERMISSION/i.test(String(error && (error.code || error.message)));
  if (perm) {
    show(`<h2>دسترسی چندنفره بسته است</h2>
      <p>قوانین Firebase اجازهٔ نوشتن در مسیر <b dir="ltr">rooms/{code}/thousandfold</b> را نمی‌دهد.</p>
      <p class="sm">در Realtime Database ← Rules زیر <b dir="ltr">rooms ← $code</b> این را اضافه کن:<br><b dir="ltr">"thousandfold": {".read":"auth != null", ".write":"auth != null"}</b></p>
      <a class="btn" href="?solo=1" style="text-decoration:none">بازی تک‌نفره</a><br>
      <a class="btn" href="../lobby.html" style="text-decoration:none;background:#4a4a8a;border-bottom-color:#2a2a5a">بازگشت به سالن</a>`);
  } else if (Date.now() - lastErrShown > 4000) {
    lastErrShown = Date.now();
    setStatus("ارتباط با اتاق قطع‌وصل می‌شود؛ اینترنت را بررسی کن.");
  }
}

/* ---------- وضعیت اتاق ---------- */
function playerAge(p){ return now() - (+p.ts || 0); }
function sessionFresh(s){ return !!(s && s.id && now() - (+s.startedAt || 0) < (TF_TIME + 45) * 1000); }

function applyNodes(val){
  nodes = val || {};
  session = sessionFresh(nodes.session) ? nodes.session : null;
  const players = {};
  for (const [uid, p] of Object.entries(nodes.players || {})) {
    if (!p) continue;
    const age = playerAge(p);
    players[uid] = { name: p.name, game: {
      name: p.name, online: age < FRESH_MS && p.phase !== "over", lastSeen: Date.now() - age,
      x: p.x, z: p.z, vx: p.vx, face: p.face, weapon: p.weapon, hp: p.hp, phase: p.phase, hits: toArr(p.hits)
    } };
  }
  const hostUid = session ? session.hostUid : myUid;
  const isHost = !!session && session.hostUid === myUid;
  if (session) {
    const host = nodes.host && nodes.host.uid === hostUid ? nodes.host : null;
    const g = (players[hostUid] = players[hostUid] || { game: { online: false, lastSeen: 0 } }).game;
    const localStart = (+session.startedAt || 0) - offset;
    window.DOMITO_DEADLINE = localStart + TF_TIME * 1000;
    g.session = { id: session.id, world: +session.world || 0, startedAt: localStart };
    if (host) Object.assign(g, {
      phase: host.phase, world: host.world, wave: host.wave, ww: host.ww, kills: host.kills,
      enemies: toArr(host.enemies), shots: toArr(host.shots), portal: host.portal || null
    });
    maybeTakeOver(host);
  }
  window.__tf?.setCoopState?.({ enabled: true, uid: myUid, name: myName, players, hostUid, isHost });
  const active = Object.values(players).filter(p => p.game.online).length || 1;
  if (!finished && window.__tf?.state === "menu") {
    setStatus(session ? "👥 بازی تیمی شروع شده؛ در حال پیوستن…"
      : `👥 ${fa(active)} نفر در اتاق · هر کدام از شما می‌تواند «شروع تیمی» را بزند`);
  }
  checkResults();
}

/* اگر میزبان وسط بازی قطع شد، کوچک‌ترین uid بین بازیکنان آنلاین جایش را می‌گیرد */
async function maybeTakeOver(host){
  if (claiming || finished || !session || session.hostUid === myUid) return;
  const hostPlayer = (nodes.players || {})[session.hostUid];
  const last = Math.max(host ? +host.ts || 0 : 0, hostPlayer ? +hostPlayer.ts || 0 : 0, +session.startedAt || 0);
  if (now() - last < 8000) return;
  if (host && host.phase === "over") return;
  const alive = Object.entries(nodes.players || {}).filter(([uid, p]) => p && uid !== session.hostUid && playerAge(p) < FRESH_MS && p.phase !== "over").map(([uid]) => uid).sort();
  if (alive[0] !== myUid) return;
  claiming = true;
  try {
    const old = session.hostUid;
    await runTransaction(base("session"), cur => (cur && cur.hostUid === old) ? { ...cur, hostUid: myUid } : cur, { applyLocally: false });
  } catch (e) { console.warn("host takeover failed", e); }
  setTimeout(() => { claiming = false; }, 3000);
}

/* ---------- ارسال وضعیت خودم ---------- */
async function pushState(){
  const s = window.__tf?.netSnapshot?.();
  if (!s || !myUid) return;
  const t = now();
  const jobs = [set(base("players/" + myUid), clean({ name: myName, ts: t, x: s.x, z: s.z, vx: s.vx, face: s.face, weapon: s.weapon, hp: s.hp, phase: s.phase, hits: s.hits }))];
  if (s.enemies !== undefined && session && session.hostUid === myUid)
    jobs.push(set(base("host"), clean({ uid: myUid, ts: t, phase: s.phase, world: s.world, wave: s.wave, ww: s.ww, kills: s.kills, enemies: s.enemies, shots: s.shots, portal: s.portal || null })));
  await Promise.all(jobs);
}
async function heartbeat(){
  if (!netOn || finished || hbBusy) return;
  hbBusy = true;
  try { await pushState(); } catch (e) { netFail(e); } finally { hbBusy = false; }
}

/* ---------- شروع بازی تیمی ---------- */
async function requestStart(world){
  if (isSolo) { window.__tf?.startFromRoom?.(world); return; }
  if (!netOn) { setStatus("در حال اتصال به اتاق بازی…"); return; }
  try {
    const res = await runTransaction(base("session"), cur => {
      if (sessionFresh(cur)) return cur;                       // کسی زودتر شروع کرده؛ بپیوند
      return { id: `${myUid}_${now()}`, hostUid: myUid, world: Number(world) || 0, startedAt: now() };
    }, { applyLocally: false });
    nodes = { ...nodes, session: res.snapshot.val() };
    applyNodes(nodes);
  } catch (error) { netFail(error); }
}
window.domitoStartRequest = requestStart;

/* ---------- پایان بازی و نتیجه ---------- */
function pendingPlayers(){
  const done = knownResults;
  return Object.entries(nodes.players || {}).filter(([uid, p]) => uid !== myUid && p && playerAge(p) < FRESH_MS && !done[uid]);   // حتی بازیکنِ «تموم‌شده» تا ثبت نتیجه‌اش منتظر می‌ماند
}
let handled = false;
async function checkResults(){
  if (!finished || isSolo || handled || !knownResults[myUid]) return;
  const waiting = pendingPlayers().length;
  const w = document.getElementById("waitS");
  if (waiting) { if (w) w.textContent = `${fa(waiting)} نفر هنوز در حال بازی‌اند…`; return; }
  handled = true;
  const list = Object.entries(knownResults).map(([uid, r]) => ({ uid, name: r.name, score: Number(r.score) || 0 })).sort((a, b) => b.score - a.score);
  const maxScore = list.length ? list[0].score : 0;
  const won = (knownResults[myUid].score || 0) === maxScore;
  try { await recordRoundResult(myName, GID, { won }); } catch (e) { console.warn(e); }
  const rows = list.map(r => `<div style="display:flex;justify-content:space-between;padding:8px 12px;margin:6px 0;border-radius:10px;background:${r.score === maxScore ? "#5a4a10" : "#2a2450"}"><span>${esc(r.name)}</span><b>${fa(r.score)}</b></div>`).join("");
  show(`<h2>${won ? "🏆 بهترین امتیاز تیم" : "نتیجهٔ بازی گروهی"}</h2>${rows}<p class="sm">به زودی برمی‌گردیم به سالن...</p>`);
  setTimeout(async () => {
    try { await remove(base("players/" + myUid)); } catch (e) {}
    try { if (session && session.hostUid === myUid) await remove(base("")); } catch (e) {}
    try { await resetSessionForNextRound(); } catch (e) {}
    location.href = "../lobby.html";
  }, 5000);
}

async function finish(d){
  if (finished) return; finished = true;
  const score = d.score;
  if (isSolo) {
    let won = false;
    try { won = soloWon(GID, score); await recordRoundResult(myName, GID, { won }); } catch (e) { console.warn(e); }
    show(`<h2>${won ? "🎉 آفرین، بردی!" : "😅 این‌بار نشد"}</h2>
      <p>موج <b>${fa(d.wave)}</b> · کشتار <b>${fa(d.kills)}</b> · بهترین کمبو <b>${fa(d.bestCombo)}</b></p>
      <p style="font-size:30px;color:#ffd23a;font-weight:900">${fa(score)} امتیاز</p>
      <button class="btn" onclick="location.href=location.pathname+'?solo=1'">دوباره بازی کن</button><br>
      <a class="btn" style="text-decoration:none;background:#4a4a8a;border-bottom-color:#2a2a5a" href="../index.html">بازگشت به خانه</a>`);
    return;
  }
  show(`<h2>نتیجهٔ تیمت ثبت شد</h2><p style="font-size:26px;color:#ffd23a;font-weight:900">${fa(score)}</p><p id="waitS">در انتظار پایان هم‌تیمی‌ها...</p>`);
  try { await pushState(); } catch (e) { console.warn(e); }          // آخرین وضعیت: «تموم شد»
  try { await submitResult(GID, myUid, myName, score); } catch (e) { console.warn("submitResult", e); }
  knownResults[myUid] = { name: myName, score };
  checkResults();
}

/* ---------- راه‌اندازی ---------- */
(async () => {
  const user = await waitForUser();
  myName = getSavedName();
  if (!user || !myName) { location.href = "../index.html"; return; }
  myUid = currentUid();
  window.__tf?.setLocalName?.(myName);
  if (isSolo) { window.DOMITO_TIME_LIMIT = 0; return; }

  try { await joinLobby(myName); }                      // لابی هنگام خروج از صفحه، حضور ما را پاک می‌کند؛ دوباره ثبتش کن
  catch (e) {
    const m = String(e && e.message);
    if (/kicked|room-not-found|no-room/.test(m)) { location.href = "../index.html"; return; }
    console.warn("joinLobby", e);
  }
  try {
    await Promise.race([
      new Promise(res => onValue(ref(db, ".info/serverTimeOffset"), s => { offset = Number(s.val()) || 0; res(); })),
      new Promise(res => setTimeout(res, 3000))
    ]);
    await set(base("players/" + myUid), { name: myName, ts: now(), phase: "menu", hp: 100 });
    onDisconnect(base("players/" + myUid)).remove().catch(() => {});
    netOn = true;
    onValue(base(""), snap => applyNodes(snap.val() || {}), netFail);
    onValue(roomRef(code, "results"), snap => {
      const r = snap.val() || {};
      for (const [uid, v] of Object.entries(r)) if (v && v.gameId === GID) knownResults[uid] = v;
      checkResults();
    });
    setInterval(heartbeat, 200);
    addEventListener("pagehide", () => { if (!finished) remove(base("players/" + myUid)).catch(() => {}); });
  } catch (error) { netFail(error); }
})();
</script>
<script type="module" src="../js/playing.js"></script>
