<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دومیتو</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">🁢</div>
      <h1>دومیتو</h1>
      <p>سالن مینی‌گیم‌های آنلاین</p>
    </div>

    <div class="card" id="authCard">
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button id="tabRegister" class="btn-full" style="margin:0;">ثبت‌نام</button>
        <button id="tabLogin" class="btn-full btn-ghost" style="margin:0;">ورود</button>
      </div>
      <input type="text" id="userInput" placeholder="نام‌کاربری (فقط حروف انگلیسی/عدد)" maxlength="20" style="margin-bottom:10px;" />
      <input type="password" id="passInput" placeholder="رمز عبور (حداقل ۶ کاراکتر)" maxlength="40" />
      <button id="authBtn" class="btn-full">ثبت‌نام و ورود</button>
      <p class="status-line" id="authStatus"></p>
    </div>

    <div id="homeContent" style="display:none">
      <div class="hero">
        <div class="hero-emojis">🎮🕹️👾</div>
        <h1>بازی کن. رقابت کن. لذت ببر.</h1>
        <p>خوش اومدی <span id="helloName" style="color:var(--gold); font-weight:700;"></span></p>
        <div class="hero-btns">
          <button id="createRoomBtn">➕ ساخت اتاق جدید</button>
          <button id="scrollToJoin" class="btn-ghost">🔑 ورود با کد اتاق</button>
        </div>
      </div>

      <div class="card" id="invitesCard" style="display:none;">
        <h2>📩 دعوت‌های تو</h2>
        <div id="inviteList"></div>
      </div>

      <div class="section-title"><h2>🎮 بازی تک‌نفره — همین الان بازی کن</h2></div>
      <div class="game-scroll" id="gameScroll"></div>

      <div class="section-title"><h2>🏆 لیدربورد</h2></div>
      <div class="leader-card" id="leaderCard">
        <p class="muted" id="leaderLoading">در حال بارگذاری...</p>
      </div>

      <div class="card" id="roomCard" style="margin-top:22px;">
        <h2>ورود با کد اتاق</h2>
        <input type="text" id="roomInput" placeholder="مثلاً: A7K2P" maxlength="8" style="text-align:center; letter-spacing:3px;" />
        <button id="joinRoomBtn" class="btn-full btn-ghost">ورود به اتاق</button>
        <p class="status-line" id="roomStatus"></p>
      </div>

      <a href="friends.html" class="btn-full btn-ghost" style="display:block; text-align:center; text-decoration:none; margin-top:14px;">👥 دوستان من</a>
      <button id="logoutBtn" class="btn-full btn-ghost">خروج از حساب</button>
    </div>

    <a href="profile.html" class="link-back">مشاهده پروفایل من ←</a>
  </div>

<script type="module">
  import {
    registerUser, loginUser, waitForUser, getSavedName,
    createRoom, joinRoomByCode, logoutUser, getLeaderboard, GAMES,
    listenInvites, dismissInvite
  } from "./js/app.js";

  const authCard = document.getElementById("authCard");
  const homeContent = document.getElementById("homeContent");
  const userInput = document.getElementById("userInput");
  const passInput = document.getElementById("passInput");
  const authBtn = document.getElementById("authBtn");
  const authStatus = document.getElementById("authStatus");
  const tabRegister = document.getElementById("tabRegister");
  const tabLogin = document.getElementById("tabLogin");

  let mode = "register";
  tabRegister.addEventListener("click", () => {
    mode = "register"; tabRegister.classList.remove("btn-ghost"); tabLogin.classList.add("btn-ghost");
    authBtn.textContent = "ثبت‌نام و ورود";
  });
  tabLogin.addEventListener("click", () => {
    mode = "login"; tabLogin.classList.remove("btn-ghost"); tabRegister.classList.add("btn-ghost");
    authBtn.textContent = "ورود";
  });

  authBtn.addEventListener("click", async () => {
    const username = userInput.value.trim();
    const password = passInput.value;
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { authStatus.textContent = "نام‌کاربری باید ۳ تا ۲۰ حرف انگلیسی/عدد باشه"; return; }
    if (password.length < 6) { authStatus.textContent = "رمز باید حداقل ۶ کاراکتر باشه"; return; }
    authBtn.disabled = true;
    authStatus.textContent = "در حال اتصال...";
    try {
      if (mode === "register") await registerUser(username, password);
      else await loginUser(username, password);
      showHome();
    } catch (e) {
      console.error(e);
      if (e.code === "auth/email-already-in-use") authStatus.textContent = "این نام‌کاربری قبلاً گرفته شده. برو تب ورود.";
      else if (e.code === "auth/invalid-credential" || e.code === "auth/wrong-password") authStatus.textContent = "رمز اشتباهه یا حسابی با این اسم نیست.";
      else authStatus.textContent = "خطا: " + e.code;
      authBtn.disabled = false;
    }
  });

  function renderGameCards() {
    const scroll = document.getElementById("gameScroll");
    scroll.innerHTML = "";
    GAMES.forEach((g) => {
      const card = document.createElement("div");
      card.className = "game-card";
      card.innerHTML = `
        <div class="game-thumb" style="background:linear-gradient(160deg, rgba(79,124,255,.3), rgba(155,92,255,.2));">
          ${g.icon}<span class="solo-badge">تک‌نفره</span>
        </div>
        <div class="game-body"><div class="name">${g.name}</div><div class="meta">${g.desc}</div></div>
      `;
      card.addEventListener("click", () => { window.location.href = `games/${g.id}.html?solo=1`; });
      scroll.appendChild(card);
    });
  }

  async function showHome() {
    authCard.style.display = "none";
    homeContent.style.display = "block";
    const myName = getSavedName();
    document.getElementById("helloName").textContent = myName;
    renderGameCards();
    renderLeaderboard();

    listenInvites(myName, (list) => {
      const card = document.getElementById("invitesCard");
      const listEl = document.getElementById("inviteList");
      if (list.length === 0) { card.style.display = "none"; return; }
      card.style.display = "block";
      listEl.innerHTML = "";
      list.forEach((inv) => {
        const row = document.createElement("div");
        row.className = "invite-row";
        row.innerHTML = `<span class="txt">${inv.from} تو رو به اتاقش دعوت کرد</span>`;
        const actions = document.createElement("div");
        actions.className = "actions";
        const acceptBtn = document.createElement("button");
        acceptBtn.textContent = "ورود";
        acceptBtn.addEventListener("click", async () => {
          const res = await joinRoomByCode(inv.roomCode);
          await dismissInvite(myName, inv.id);
          if (res.ok) window.location.href = "lobby.html";
        });
        const declineBtn = document.createElement("button");
        declineBtn.textContent = "رد کردن";
        declineBtn.className = "btn-ghost";
        declineBtn.addEventListener("click", async () => { await dismissInvite(myName, inv.id); });
        actions.appendChild(acceptBtn);
        actions.appendChild(declineBtn);
        row.appendChild(actions);
        listEl.appendChild(row);
      });
    });
  }

  async function renderLeaderboard() {
    const leaderCard = document.getElementById("leaderCard");
    try {
      const list = await getLeaderboard(5);
      if (list.length === 0) { leaderCard.innerHTML = '<p class="muted">هنوز کسی برد ثبت نکرده</p>'; return; }
      const medals = ["🥇", "🥈", "🥉"];
      leaderCard.innerHTML = list.map((p, i) => `
        <div class="leader-row">
          <span class="rank">${medals[i] || i + 1}</span>
          <span class="who">${p.name}</span>
          <span class="score">${p.wins} برد</span>
        </div>
      `).join("");
    } catch (e) { leaderCard.innerHTML = '<p class="muted">خطا در بارگذاری لیدربورد</p>'; }
  }

  document.getElementById("createRoomBtn").addEventListener("click", async () => {
    await createRoom();
    window.location.href = "lobby.html";
  });

  document.getElementById("scrollToJoin").addEventListener("click", () => {
    document.getElementById("roomCard").scrollIntoView({ behavior: "smooth" });
  });

  document.getElementById("joinRoomBtn").addEventListener("click", async () => {
    const val = document.getElementById("roomInput").value;
    const roomStatus = document.getElementById("roomStatus");
    if (!val.trim()) { roomStatus.textContent = "کد اتاق رو بنویس"; return; }
    roomStatus.textContent = "در حال بررسی...";
    const res = await joinRoomByCode(val);
    if (res.ok) window.location.href = "lobby.html";
    else roomStatus.textContent = "همچین اتاقی پیدا نشد";
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await logoutUser();
    window.location.reload();
  });

  waitForUser().then((user) => { if (user) showHome(); });
</script>
</body>
</html>
