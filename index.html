<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دومیتو</title>
<link rel="stylesheet" href="css/style.css">

<style>
  /* پنجره ورود به اتاق */
  .join-room-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, .72);
    backdrop-filter: blur(8px);
  }

  .join-room-box {
    width: min(420px, 100%);
    background: var(--card, #171a25);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 22px;
    padding: 28px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    text-align: center;
    position: relative;
    animation: roomBoxIn .18s ease-out;
  }

  @keyframes roomBoxIn {
    from {
      opacity: 0;
      transform: translateY(12px) scale(.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .join-room-close {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    border: 0;
    background: rgba(255,255,255,.07);
    color: inherit;
    font-size: 18px;
    cursor: pointer;
  }

  .join-room-icon {
    font-size: 42px;
    margin-bottom: 8px;
  }

  .join-room-box h2 {
    margin: 0 0 8px;
  }

  .join-room-box p {
    margin: 0 0 18px;
  }

  .join-room-box input {
    text-align: center;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-size: 18px;
    margin-bottom: 12px;
  }

  .join-room-back {
    margin-top: 8px;
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="brand-mark">🁢</div>
    <h1>دومیتو</h1>
    <p>سالن مینی‌گیم‌های آنلاین</p>
  </div>

  <!-- ================= AUTH ================= -->

  <div class="card" id="authCard">

    <div style="display:flex; gap:8px; margin-bottom:16px;">

      <button
        id="tabRegister"
        class="btn-full"
        style="margin:0;"
      >
        ثبت‌نام
      </button>

      <button
        id="tabLogin"
        class="btn-full btn-ghost"
        style="margin:0;"
      >
        ورود
      </button>

    </div>

    <input
      type="text"
      id="userInput"
      placeholder="نام‌کاربری (فقط حروف انگلیسی/عدد)"
      maxlength="20"
      style="margin-bottom:10px;"
    />

    <input
      type="password"
      id="passInput"
      placeholder="رمز عبور (حداقل ۶ کاراکتر)"
      maxlength="40"
    />

    <button
      id="authBtn"
      class="btn-full"
    >
      ثبت‌نام و ورود
    </button>

    <p
      class="status-line"
      id="authStatus"
    ></p>

  </div>


  <!-- ================= HOME ================= -->

  <div
    id="homeContent"
    style="display:none"
  >

    <!-- Wallet / Profile -->

    <div class="top-wallet-bar">

      <a
        href="wallet.html"
        class="coin-badge"
      >
        🪙
        <span id="coinCount">0</span>
        سکه ←
      </a>

      <a
        href="profile.html"
        class="btn-ghost"
        style="
          text-decoration:none;
          padding:8px 14px;
          font-size:12.5px;
        "
      >
        پروفایل من
      </a>

    </div>


    <!-- ================================================= -->
    <!-- HERO — اول از دوستان قرار گرفت -->
    <!-- ================================================= -->

    <div class="hero">

      <div class="hero-emojis">
        🎮🕹️👾
      </div>

      <h1>
        بازی کن. رقابت کن. لذت ببر.
      </h1>

      <p>
        خوش اومدی
        <span
          id="helloName"
          style="
            color:var(--gold);
            font-weight:700;
          "
        ></span>
      </p>

      <div class="hero-btns">

        <button id="createRoomBtn">
          ➕ ساخت اتاق جدید
        </button>

        <button
          id="openJoinRoomBtn"
          class="btn-ghost"
        >
          🔑 ورود با کد اتاق
        </button>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- ONLINE FRIENDS -->
    <!-- فقط دوستان آنلاین -->
    <!-- ================================================= -->

    <div class="card">

      <h2>
        👥 دوستان آنلاین
      </h2>

      <div id="requestList"></div>

      <div id="onlineFriendsList"></div>

      <p
        class="muted"
        id="noFriendsMsg"
        style="display:none;"
      >
        هنوز دوستی اضافه نکردی
      </p>

      <a
        href="friends.html"
        class="btn-full btn-ghost"
        style="
          display:block;
          text-decoration:none;
          text-align:center;
          margin-top:10px;
        "
      >
        مدیریت دوستان ←
      </a>

    </div>


    <!-- ================================================= -->
    <!-- INVITES -->
    <!-- ================================================= -->

    <div
      class="card"
      id="invitesCard"
      style="display:none;"
    >

      <h2>
        📩 دعوت‌های اتاق
      </h2>

      <div id="inviteList"></div>

    </div>


    <!-- ================================================= -->
    <!-- SOLO GAMES -->
    <!-- ================================================= -->

    <div class="section-title">

      <h2>
        🎮 بازی تک‌نفره — همین الان بازی کن
      </h2>

    </div>

    <div
      class="game-scroll"
      id="gameScroll"
    ></div>


    <!-- ================================================= -->
    <!-- LEADERBOARD -->
    <!-- ================================================= -->

    <div class="section-title">

      <h2>
        🏆 لیدربورد
      </h2>

    </div>

    <div
      class="leader-card"
      id="leaderCard"
    >

      <p
        class="muted"
        id="leaderLoading"
      >
        در حال بارگذاری...
      </p>

    </div>


    <!-- ================================================= -->
    <!-- LOGOUT -->
    <!-- ================================================= -->

    <button
      id="logoutBtn"
      class="btn-full btn-ghost"
    >
      خروج از حساب
    </button>

  </div>

</div>


<!-- ===================================================== -->
<!-- JOIN ROOM OVERLAY -->
<!-- ===================================================== -->

<div
  id="joinRoomOverlay"
  class="join-room-overlay"
>

  <div class="join-room-box">

    <button
      id="closeJoinRoom"
      class="join-room-close"
      aria-label="بستن"
    >
      ✕
    </button>

    <div class="join-room-icon">
      🔑
    </div>

    <h2>
      ورود به اتاق
    </h2>

    <p class="muted">
      کد اتاق را وارد کنید
    </p>

    <input
      type="text"
      id="roomInput"
      placeholder="مثلاً: A7K2P"
      maxlength="8"
      autocomplete="off"
    />

    <button
      id="joinRoomBtn"
      class="btn-full"
    >
      ورود به اتاق
    </button>

    <button
      id="cancelJoinRoom"
      class="btn-full btn-ghost join-room-back"
    >
      بازگشت
    </button>

    <p
      class="status-line"
      id="roomStatus"
    ></p>

  </div>

</div>


<script type="module">

import {
  registerUser,
  loginUser,
  waitForUser,
  getSavedName,
  createRoom,
  joinRoomByCode,
  logoutUser,
  getLeaderboard,
  GAMES,
  listenInvites,
  dismissInvite,
  listenProfile,
  listenFriendRequests,
  acceptFriendRequest,
  rejectFriendRequest,
  listenFriends
} from "./js/app.js";


const authCard =
  document.getElementById("authCard");

const homeContent =
  document.getElementById("homeContent");

const userInput =
  document.getElementById("userInput");

const passInput =
  document.getElementById("passInput");

const authBtn =
  document.getElementById("authBtn");

const authStatus =
  document.getElementById("authStatus");

const tabRegister =
  document.getElementById("tabRegister");

const tabLogin =
  document.getElementById("tabLogin");

let mode = "register";


/* ================================================= */
/* AUTH TABS */
/* ================================================= */

tabRegister.addEventListener("click", () => {

  mode = "register";

  tabRegister.classList.remove("btn-ghost");

  tabLogin.classList.add("btn-ghost");

  authBtn.textContent =
    "ثبت‌نام و ورود";

});


tabLogin.addEventListener("click", () => {

  mode = "login";

  tabLogin.classList.remove("btn-ghost");

  tabRegister.classList.add("btn-ghost");

  authBtn.textContent =
    "ورود";

});


/* ================================================= */
/* AUTH */
/* ================================================= */

authBtn.addEventListener(
  "click",
  async () => {

    const username =
      userInput.value.trim();

    const password =
      passInput.value;


    if (
      !/^[a-zA-Z0-9_]{3,20}$/.test(username)
    ) {

      authStatus.textContent =
        "نام‌کاربری باید ۳ تا ۲۰ حرف انگلیسی/عدد باشه";

      return;

    }


    if (password.length < 6) {

      authStatus.textContent =
        "رمز باید حداقل ۶ کاراکتر باشه";

      return;

    }


    authBtn.disabled = true;

    authStatus.textContent =
      "در حال اتصال...";


    try {

      if (mode === "register") {

        await registerUser(
          username,
          password
        );

      } else {

        await loginUser(
          username,
          password
        );

      }

      showHome();

    } catch (e) {

      console.error(e);

      if (
        e.code ===
        "auth/email-already-in-use"
      ) {

        authStatus.textContent =
          "این نام‌کاربری قبلاً گرفته شده. برو تب ورود.";

      } else if (
        e.code ===
          "auth/invalid-credential" ||
        e.code ===
          "auth/wrong-password"
      ) {

        authStatus.textContent =
          "رمز اشتباهه یا حسابی با این اسم نیست.";

      } else {

        authStatus.textContent =
          "خطا: " + e.code;

      }

      authBtn.disabled = false;

    }

  }
);


/* ================================================= */
/* GAME CARDS */
/* ================================================= */

function renderGameCards() {

  const scroll =
    document.getElementById(
      "gameScroll"
    );

  scroll.innerHTML = "";

  GAMES.forEach((g) => {

    const card =
      document.createElement("div");

    card.className =
      "game-card";

    card.innerHTML = `

      <div
        class="game-thumb"
        style="
          background:
          linear-gradient(
            160deg,
            rgba(79,124,255,.3),
            rgba(155,92,255,.2)
          );
        "
      >

        ${g.icon}

        <span class="solo-badge">
          تک‌نفره
        </span>

      </div>

      <div class="game-body">

        <div class="name">
          ${g.name}
        </div>

        <div class="meta">
          ${g.desc}
        </div>

      </div>

    `;


    card.addEventListener(
      "click",
      () => {

        window.location.href =
          `games/${g.id}.html?solo=1`;

      }
    );


    scroll.appendChild(card);

  });

}


/* ================================================= */
/* HOME */
/* ================================================= */

async function showHome() {

  authCard.style.display =
    "none";

  homeContent.style.display =
    "block";


  const myName =
    getSavedName();


  document.getElementById(
    "helloName"
  ).textContent =
    myName;


  renderGameCards();

  renderLeaderboard();


  /* Wallet */

  listenProfile(
    myName,
    (p) => {

      document.getElementById(
        "coinCount"
      ).textContent =
        (p && p.coins) || 0;

    }
  );


  /* ================================================= */
  /* FRIEND REQUESTS */
  /* ================================================= */

  listenFriendRequests(
    myName,
    (requesters) => {

      const list =
        document.getElementById(
          "requestList"
        );

      list.innerHTML = "";


      requesters.forEach(
        (fromName) => {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "request-row";


          row.innerHTML = `
            <span class="txt">
              ${fromName}
              درخواست دوستی داد
            </span>
          `;


          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "actions";


          const acceptBtn =
            document.createElement(
              "button"
            );

          acceptBtn.textContent =
            "قبول";


          acceptBtn.addEventListener(
            "click",
            async () => {

              await acceptFriendRequest(
                myName,
                fromName
              );

            }
          );


          const rejectBtn =
            document.createElement(
              "button"
            );

          rejectBtn.textContent =
            "رد";

          rejectBtn.className =
            "btn-ghost";


          rejectBtn.addEventListener(
            "click",
            async () => {

              await rejectFriendRequest(
                myName,
                fromName
              );

            }
          );


          actions.appendChild(
            acceptBtn
          );

          actions.appendChild(
            rejectBtn
          );

          row.appendChild(
            actions
          );

          list.appendChild(
            row
          );

        }
      );

    }
  );


  /* ================================================= */
  /* ONLINE FRIENDS — ONLY ONLINE */
  /* ================================================= */

  listenFriends(
    myName,
    (friends) => {

      const listEl =
        document.getElementById(
          "onlineFriendsList"
        );

      const noMsg =
        document.getElementById(
          "noFriendsMsg"
        );


      /*
       * فقط دوستان آنلاین
       */
      const online =
        friends.filter(
          (f) => f.online === true
        );


      /*
       * اگر اصلاً دوستی ندارد
       */
      if (friends.length === 0) {

        noMsg.style.display =
          "block";

        noMsg.textContent =
          "هنوز دوستی اضافه نکردی";

        listEl.innerHTML =
          "";

        return;

      }


      /*
       * دوست دارد ولی هیچ‌کدام آنلاین نیستند
       */
      if (online.length === 0) {

        noMsg.style.display =
          "block";

        noMsg.textContent =
          "😴 الان هیچ‌کدوم از دوستات آنلاین نیستن";

        listEl.innerHTML =
          "";

        return;

      }


      noMsg.style.display =
        "none";

      listEl.innerHTML =
        "";


      online.forEach(
        (f) => {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "friend-row";


          row.innerHTML = `

            <a
              href="profile.html?user=${encodeURIComponent(f.name)}"
              class="friend-name-link"
            >
              ${f.name}
            </a>

            <span
              class="fdot"
              title="آنلاین"
            ></span>

          `;


          listEl.appendChild(
            row
          );

        }
      );

    }
  );


  /* ================================================= */
  /* ROOM INVITES */
  /* ================================================= */

  listenInvites(
    myName,
    (list) => {

      const card =
        document.getElementById(
          "invitesCard"
        );

      const listEl =
        document.getElementById(
          "inviteList"
        );


      if (list.length === 0) {

        card.style.display =
          "none";

        return;

      }


      card.style.display =
        "block";

      listEl.innerHTML =
        "";


      list.forEach(
        (inv) => {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "invite-row";


          row.innerHTML = `

            <span class="txt">

              🔔
              ${inv.from}
              تو رو به اتاقش دعوت کرد

              <br>

              <small>
                کد اتاق:
                <b>${inv.roomCode}</b>
              </small>

            </span>

          `;


          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "actions";


          const acceptBtn =
            document.createElement(
              "button"
            );

          acceptBtn.textContent =
            "ورود";


          acceptBtn.addEventListener(
            "click",
            async () => {

              try {

                const res =
                  await joinRoomByCode(
                    inv.roomCode
                  );


                if (res.ok) {

                  await dismissInvite(
                    myName,
                    inv.id
                  );

                  window.location.href =
                    "lobby.html";

                } else {

                  alert(
                    "این اتاق دیگر وجود ندارد."
                  );

                }

              } catch (e) {

                console.error(e);

                alert(
                  "ورود به اتاق انجام نشد."
                );

              }

            }
          );


          const declineBtn =
            document.createElement(
              "button"
            );

          declineBtn.textContent =
            "رد کردن";

          declineBtn.className =
            "btn-ghost";


          declineBtn.addEventListener(
            "click",
            async () => {

              await dismissInvite(
                myName,
                inv.id
              );

            }
          );


          actions.appendChild(
            acceptBtn
          );

          actions.appendChild(
            declineBtn
          );


          row.appendChild(
            actions
          );

          listEl.appendChild(
            row
          );

        }
      );

    }
  );

}


/* ================================================= */
/* LEADERBOARD */
/* ================================================= */

async function renderLeaderboard() {

  const leaderCard =
    document.getElementById(
      "leaderCard"
    );


  try {

    const list =
      await getLeaderboard(5);


    if (list.length === 0) {

      leaderCard.innerHTML =
        '<p class="muted">هنوز کسی برد ثبت نکرده</p>';

      return;

    }


    const medals =
      ["🥇", "🥈", "🥉"];


    leaderCard.innerHTML =
      list.map(
        (p, i) => `

          <div class="leader-row">

            <span class="rank">
              ${medals[i] || i + 1}
            </span>

            <a
              href="profile.html?user=${encodeURIComponent(p.name)}"
              class="who friend-name-link"
            >
              ${p.name}
            </a>

            <span class="score">
              ${p.wins} برد
            </span>

          </div>

        `
      ).join("");


  } catch (e) {

    leaderCard.innerHTML =
      '<p class="muted">خطا در بارگذاری لیدربورد</p>';

  }

}


/* ================================================= */
/* CREATE ROOM */
/* ================================================= */

document
  .getElementById("createRoomBtn")
  .addEventListener(
    "click",
    async () => {

      try {

        await createRoom();

        window.location.href =
          "lobby.html";

      } catch (e) {

        console.error(e);

        alert(
          "ساخت اتاق انجام نشد."
        );

      }

    }
  );


/* ================================================= */
/* JOIN ROOM OVERLAY */
/* ================================================= */

const joinRoomOverlay =
  document.getElementById(
    "joinRoomOverlay"
  );

const roomInput =
  document.getElementById(
    "roomInput"
  );

const roomStatus =
  document.getElementById(
    "roomStatus"
  );


function openJoinRoom() {

  joinRoomOverlay.style.display =
    "flex";

  roomInput.value =
    "";

  roomStatus.textContent =
    "";

  setTimeout(
    () => roomInput.focus(),
    100
  );

}


function closeJoinRoom() {

  joinRoomOverlay.style.display =
    "none";

  roomInput.value =
    "";

  roomStatus.textContent =
    "";

}


document
  .getElementById("openJoinRoomBtn")
  .addEventListener(
    "click",
    openJoinRoom
  );


document
  .getElementById("closeJoinRoom")
  .addEventListener(
    "click",
    closeJoinRoom
  );


document
  .getElementById("cancelJoinRoom")
  .addEventListener(
    "click",
    closeJoinRoom
  );


joinRoomOverlay.addEventListener(
  "click",
  (event) => {

    if (
      event.target ===
      joinRoomOverlay
    ) {

      closeJoinRoom();

    }

  }
);


/* ================================================= */
/* JOIN ROOM */
/* ================================================= */

document
  .getElementById("joinRoomBtn")
  .addEventListener(
    "click",
    async () => {

      const val =
        roomInput.value.trim();


      if (!val) {

        roomStatus.textContent =
          "کد اتاق رو بنویس";

        return;

      }


      const button =
        document.getElementById(
          "joinRoomBtn"
        );


      button.disabled =
        true;


      roomStatus.textContent =
        "در حال بررسی...";


      try {

        const res =
          await joinRoomByCode(
            val
          );


        if (res.ok) {

          window.location.href =
            "lobby.html";

        } else {

          roomStatus.textContent =
            "همچین اتاقی پیدا نشد";

          button.disabled =
            false;

        }

      } catch (e) {

        console.error(e);

        roomStatus.textContent =
          "ورود به اتاق انجام نشد";

        button.disabled =
          false;

      }

    }
  );


/* Enter */

roomInput.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter"
    ) {

      document
        .getElementById(
          "joinRoomBtn"
        )
        .click();

    }

  }
);


/* ================================================= */
/* LOGOUT */
/* ================================================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await logoutUser();

      window.location.reload();

    }
  );


/* ================================================= */
/* START */
/* ================================================= */

waitForUser()
  .then(
    (user) => {

      if (user) {

        showHome();

      }

    }
  );

</script>

</body>
</html>
