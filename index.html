<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>دومیتو | سالن مینی‌گیم‌های آنلاین</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #172554 0%,
          #080b16 45%,
          #03040a 100%
        );
      color: white;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================
       صفحه
       ========================================= */

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* =========================================
       برند
       ========================================= */

    .brand {
      text-align: center;
      padding-top: 35px;
      margin-bottom: 30px;
    }

    #domitoLogo {
      width: 100px;
      height: 100px;

      object-fit: contain;
      display: block;

      margin: 0 auto 10px;

      border-radius: 24px;

      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      transition:
        transform 0.15s ease,
        filter 0.2s ease;
    }

    #domitoLogo:active {
      transform: scale(0.94);
    }

    .brand h1 {
      margin: 0;

      font-size: 34px;
      font-weight: 900;

      letter-spacing: -1px;
    }

    .brand p {
      margin: 8px 0 0;

      color: rgba(255, 255, 255, 0.65);

      font-size: 14px;
    }

    /* =========================================
       Glass
       ========================================= */

    .glass {
      background:
        rgba(255, 255, 255, 0.07);

      border:
        1px solid rgba(255, 255, 255, 0.10);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-radius: 24px;
    }

    /* =========================================
       بخش احراز هویت
       ========================================= */

    #authSection {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }

    .auth-card {
      padding: 24px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .auth-tabs button {
      flex: 1;

      border: 0;
      border-radius: 14px;

      padding: 12px;

      color: white;

      background:
        rgba(255, 255, 255, 0.06);
    }

    .auth-tabs button.active {
      background:
        rgba(99, 102, 241, 0.35);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-form input {
      width: 100%;

      padding: 14px 16px;

      border-radius: 14px;

      border:
        1px solid rgba(255, 255, 255, 0.10);

      outline: none;

      color: white;

      background:
        rgba(0, 0, 0, 0.18);
    }

    .auth-form input::placeholder {
      color:
        rgba(255, 255, 255, 0.40);
    }

    .primary-button {
      width: 100%;

      border: 0;
      border-radius: 14px;

      padding: 14px;

      color: white;

      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #8b5cf6
        );
    }

    /* =========================================
       Toast Notification
       ========================================= */

    #domitoToast {

      position: fixed;

      left: 50%;

      bottom: 28px;

      transform:
        translate(-50%, 30px)
        scale(0.96);

      opacity: 0;

      pointer-events: none;

      z-index: 999999;

      min-width: 150px;

      max-width:
        calc(100vw - 40px);

      padding:
        12px 20px;

      text-align: center;

      color: white;

      font-size: 14px;

      font-weight: 700;

      /* شیشه‌ای مات */

      background:
        rgba(255, 255, 255, 0.10);

      border:
        1px solid
        rgba(255, 255, 255, 0.20);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:

        0 10px 35px
        rgba(0, 0, 0, 0.28),

        inset 0 1px 0
        rgba(255, 255, 255, 0.12);

      border-radius: 18px;

      white-space: nowrap;

      transition:

        opacity
        0.30s ease,

        transform
        0.30s
        cubic-bezier(.2, .8, .2, 1);
    }

    #domitoToast.show {

      opacity: 1;

      transform:
        translate(-50%, 0)
        scale(1);
    }

    #domitoToast.hide {

      opacity: 0;

      transform:
        translate(-50%, 18px)
        scale(0.96);
    }

    /* =========================================
       موبایل
       ========================================= */

    @media (max-width: 600px) {

      .page {
        padding: 14px;
      }

      .brand {
        padding-top: 25px;
      }

      .brand h1 {
        font-size: 30px;
      }

      #domitoLogo {
        width: 90px;
        height: 90px;
      }

      #domitoToast {
        bottom: 22px;

        font-size: 13px;

        padding:
          11px 18px;

        border-radius: 16px;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <div class="container">

      <!-- =====================================
           برند دومیتو
           ===================================== -->

      <div class="brand">

        <img
          id="domitoLogo"
          src="./logo.png"
          alt="دومیتو"
        >

        <h1>
          دومیتو
        </h1>

        <p>
          سالن مینی‌گیم‌های آنلاین
        </p>

      </div>


      <!-- =====================================
           Toast
           ===================================== -->

      <div
        id="domitoToast"
        aria-live="polite"
      ></div>


      <!-- =====================================
           Auth
           ===================================== -->

      <section
        id="authSection"
      >

        <div
          class="glass auth-card"
        >

          <div
            class="auth-tabs"
          >

            <button
              id="loginTab"
              class="active"
              type="button"
            >
              ورود
            </button>

            <button
              id="registerTab"
              type="button"
            >
              ثبت‌نام
            </button>

          </div>


          <div
            id="authForm"
            class="auth-form"
          >

            <input
              id="usernameInput"
              type="text"
              autocomplete="username"
              placeholder="نام کاربری"
            >

            <input
              id="passwordInput"
              type="password"
              autocomplete="current-password"
              placeholder="رمز عبور"
            >

            <button
              id="authButton"
              class="primary-button"
              type="button"
            >
              ورود
            </button>

          </div>

        </div>

      </section>


      <!-- =====================================
           محتوای اصلی
           ===================================== -->

      <main
        id="homeSection"
        style="display:none;"
      >

        <div
          class="glass"
          style="
            padding:24px;
            text-align:center;
            margin-top:20px;
          "
        >

          <h2>
            🎮 خوش اومدی به دومیتو
          </h2>

          <p
            style="
              color:rgba(255,255,255,.65);
            "
          >
            سالن مینی‌گیم‌های آنلاین
          </p>

        </div>

      </main>

    </div>

  </div>


  <!-- =========================================
       سیستم مخفی ۷ ضربه‌ای
       مستقل از app.js
       ========================================= -->

  <script>

    (function () {

      const logo =
        document.getElementById(
          "domitoLogo"
        );

      const toast =
        document.getElementById(
          "domitoToast"
        );


      if (!logo) {

        console.error(
          "Domito logo not found"
        );

        return;
      }


      if (!toast) {

        console.error(
          "Domito toast not found"
        );

        return;
      }


      let taps = 0;

      let tapTimer = null;

      let toastTimer = null;


      const TAP_TIMEOUT =
        3000;


      /* =====================================
         نمایش Toast
         ===================================== */

      function showToast(text) {

        clearTimeout(
          toastTimer
        );


        toast.classList.remove(
          "hide"
        );


        toast.classList.remove(
          "show"
        );


        toast.textContent =
          text;


        /*
         * مجبور می‌کنیم مرورگر
         * انیمیشن را دوباره اجرا کند.
         */

        void toast.offsetWidth;


        toast.classList.add(
          "show"
        );


        toastTimer =
          setTimeout(
            function () {

              toast.classList.remove(
                "show"
              );

              toast.classList.add(
                "hide"
              );

            },
            1800
          );
      }


      /* =====================================
         تشخیص ضربه روی لوگو
         ===================================== */

      logo.addEventListener(
        "click",
        function () {

          taps++;


          clearTimeout(
            tapTimer
          );


          /*
           * اگر بیشتر از ۳ ثانیه
           * فاصله بیفتد،
           * شمارنده صفر می‌شود.
           */

          tapTimer =
            setTimeout(
              function () {

                taps = 0;

              },
              TAP_TIMEOUT
            );


          /* -------------------------------
             ضربه سوم
             ------------------------------- */

          if (taps === 3) {

            showToast(
              "۴ بار دیگر"
            );

          }


          /* -------------------------------
             ضربه چهارم
             ------------------------------- */

          else if (taps === 4) {

            showToast(
              "۳ بار دیگر"
            );

          }


          /* -------------------------------
             ضربه پنجم
             ------------------------------- */

          else if (taps === 5) {

            showToast(
              "۲ بار دیگر"
            );

          }


          /* -------------------------------
             ضربه ششم
             ------------------------------- */

          else if (taps === 6) {

            showToast(
              "۱ بار دیگر"
            );

          }


          /* -------------------------------
             ضربه هفتم
             ------------------------------- */

          else if (taps === 7) {

            taps = 0;

            clearTimeout(
              tapTimer
            );


            showToast(
              "✨ پنل دستورات"
            );


            setTimeout(
              function () {

                window.location.href =
                  "./command.html";

              },
              500
            );

          }

        },
        {
          passive: true
        }
      );


    })();

  </script>

</body>

</html>
