<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اتاق بازی | دومیتو</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>

<body class="pg">

  <div class="wrap">

    <header class="pg-head">
      <a class="pg-back" href="index.html" aria-label="خانه">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"/></svg>
      </a>
      <h1>لابی دومیتو</h1>
      <span class="live-chip"><i></i>زنده</span>
    </header>

    <section class="glass ring-card">
      <div class="ring">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="pgRing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7c5cff"/>
              <stop offset="1" stop-color="#ff4d8d"/>
            </linearGradient>
          </defs>
          <circle class="bg" cx="60" cy="60" r="52"/>
          <circle class="fg" id="ringFg" cx="60" cy="60" r="52"/>
        </svg>
        <div class="ring-in"><b id="ringNum">0</b><span>رای ثبت‌شده</span></div>
      </div>
      <h2>بازی بعدی را انتخاب کن</h2>
      <p class="status-line" id="voteStatus">در انتظار رای‌ها...</p>
      <div class="ring-meta">
        <div class="room-code-badge" id="roomCodeText"></div>
        <button id="inviteRoomBtn" class="mini" type="button">👥 دعوت دوست</button>
      </div>
    </section>

    <div class="glass" id="inviteCard" style="display:none; margin-top:12px;">
      <h2 style="margin:0 0 6px; font-size:16px;">دعوت از دوستان</h2>
      <p class="muted" style="margin:0 0 12px;">یک دوست آنلاین را برای ورود به این اتاق انتخاب کن.</p>
      <div id="inviteFriendsList"></div>
      <button id="closeInviteBtn" class="btn-full btn-ghost" type="button" style="margin-top:10px;">بستن</button>
    </div>

    <div class="sec-title"><h3>رای‌ها</h3></div>
    <div class="vlist" id="gameOptions"></div>

    <div class="sec-title"><h3>بازیکنان آنلاین</h3><span><span id="playerCount">0</span> نفر</span></div>
    <div class="plist" id="playerGrid"></div>

    <button id="leaveBtn" class="btn-full btn-ghost leave" type="button">خروج از اتاق</button>

  </div>


  <script type="module">

    import { sceneSVG, hasScene } from "./js/scenes.js";

    import {

      GAMES,

      roomRef,
      getSavedRoom,

      onValue,
      set,

      waitForUser,
      getSavedName,

      leaveLobby,
      joinLobby,

      runTransaction,

      clearRoom,
      currentUid,

      inviteFriendToRoom,
      listenFriends

    } from "./js/app.js";


    import {
      mountChat
    } from "./js/chat.js";


    import {
      injectCosmeticStyles,
      primeCosmetics,
      getCachedCosmetics,
      renderNameBlock,
      applyAvatarStyle
    } from "./js/cosmetics.js";

    injectCosmeticStyles();


    // ============================================================
    // اطلاعات کاربر و اتاق
    // ============================================================

    const myName =
      getSavedName();

    const code =
      getSavedRoom();


    if (!myName || !code) {

      window.location.href =
        "index.html";

    }


    document
      .getElementById("roomCodeText")
      .textContent =
        `کد: ${code}`;


    const R =
      (path) =>
        roomRef(code, path);


    // ============================================================
    // متغیرها
    // ============================================================

    let myUid = null;

    let players = {};

    let votes = {};

    let started = false;

    let friends = [];


    // ============================================================
    // عناصر صفحه
    // ============================================================

    const playerGrid =
      document.getElementById(
        "playerGrid"
      );


    const playerCount =
      document.getElementById(
        "playerCount"
      );


    const gameOptions =
      document.getElementById(
        "gameOptions"
      );


    const voteStatus =
      document.getElementById(
        "voteStatus"
      );


    const inviteRoomBtn =
      document.getElementById(
        "inviteRoomBtn"
      );


    const inviteCard =
      document.getElementById(
        "inviteCard"
      );


    const inviteFriendsList =
      document.getElementById(
        "inviteFriendsList"
      );


    const closeInviteBtn =
      document.getElementById(
        "closeInviteBtn"
      );


    // ============================================================
    // نمایش بازیکنان
    // ============================================================

    function decoratePlayer(el, name, isMe) {

      const equipped =
        getCachedCosmetics(name);

      applyAvatarStyle(
        el.querySelector(".room-avatar"),
        equipped
      );

      const pname =
        el.querySelector(".pname");

      renderNameBlock(
        pname,
        name,
        equipped
      );

      if (isMe) {
        pname.appendChild(
          document.createTextNode(" (تو)")
        );
      }

    }


    function decorateFriendRow(row, name) {

      renderNameBlock(
        row.querySelector(".txt"),
        name,
        getCachedCosmetics(name)
      );

    }


    function renderPlayers() {

      primeCosmetics(
        Object.values(players).map(p => p.name),
        renderPlayers
      );


      playerCount.textContent =
        Object.keys(players).length;


      playerGrid.innerHTML =
        "";


      Object.entries(players)
        .forEach(
          ([uid, p]) => {

            const voted =
              !!votes[uid];


            const el =
              document.createElement(
                "div"
              );


            el.className =
              "room-player";


            el.innerHTML = `
              <div class="room-avatar">${(p.name.trim()[0] || "?").toUpperCase()}</div>
              <div class="pinfo">
                <div class="pname"></div>
                <small>${voted ? "رای خودش را داد" : "در حال انتخاب..."}</small>
              </div>
              ${voted ? '<span class="ready-badge">رای داد</span>' : '<span class="wait-badge">در انتظار</span>'}
            `;


            decoratePlayer(el, p.name, uid === myUid);


            playerGrid.appendChild(
              el
            );

          }
        );

    }


    // ============================================================
    // محاسبه رای‌ها
    // ============================================================

    function tally() {

      const counts = {};


      GAMES.forEach(
        (game) => {

          counts[game.id] =
            0;

        }
      );


      Object.entries(votes)
        .forEach(
          ([uid, vote]) => {

            if (
              players[uid] &&
              counts[vote.gameId] !== undefined
            ) {

              counts[vote.gameId]++;

            }

          }
        );


      return counts;

    }


    // ============================================================
    // نمایش بازی‌ها
    // ============================================================

    function renderGames() {

      const counts =
        tally();


      gameOptions.innerHTML =
        "";


      GAMES.forEach(
        (game) => {

          const el =
            document.createElement(
              "div"
            );


          const myVote =
            votes[myUid]?.gameId ===
            game.id;


          el.className = "vrow" + (myVote ? " voted" : "");

          const total = Object.keys(players).length || 1;
          const pct = Math.round((counts[game.id] / total) * 100);

          el.innerHTML = `
            <div class="v-art">${hasScene(game.id) ? sceneSVG(game.id, "90 40 180 180", game.name) : (game.icon || "🎮")}</div>
            <div class="v-body">
              <div class="v-top">
                <span class="name">${game.name}</span>
                <span class="votes">${counts[game.id]} رای</span>
              </div>
              <div class="v-bar"><i style="width:${pct}%"></i></div>
            </div>
          `;


          el.addEventListener(
            "click",
            async () => {

              await set(
                R(`votes/${myUid}`),
                {
                  gameId:
                    game.id,

                  name:
                    myName

                }
              );

            }
          );


          gameOptions.appendChild(
            el
          );

        }
      );


      const validVotes =
        Object.keys(votes)
          .filter(
            (uid) =>
              players[uid]
          )
          .length;


      const totalPlayers =
        Object.keys(players)
          .length;


      voteStatus.textContent =
        `${validVotes} از ${totalPlayers} نفر رای دادند · وقتی همه رای بدهند بازی شروع می‌شود`;

      document.getElementById("ringNum").textContent = validVotes;
      document.getElementById("ringFg").style.strokeDashoffset =
        String(326.7 * (1 - (totalPlayers ? validVotes / totalPlayers : 0)));

    }


    // ============================================================
    // شروع بازی
    // ============================================================

    async function maybeStartGame() {

      const validVotes =
        Object.keys(votes)
          .filter(
            (uid) =>
              players[uid]
          )
          .length;


      const totalPlayers =
        Object.keys(players)
          .length;


      if (
        started ||
        totalPlayers === 0 ||
        validVotes < totalPlayers
      ) {

        return;

      }


      const counts =
        tally();


      let winner =
        GAMES[0].id;


      let best =
        -1;


      GAMES.forEach(
        (game) => {

          if (
            counts[game.id] >
            best
          ) {

            best =
              counts[game.id];

            winner =
              game.id;

          }

        }
      );


      await runTransaction(
        R("currentGame"),
        (current) => {

          if (
            current &&
            current.gameId
          ) {

            return current;

          }


          return {

            gameId:
              winner,

            roundId:
              Date.now()

          };

        }
      );

    }


    // ============================================================
    // نمایش دوستان برای دعوت
    // ============================================================

    function renderInviteFriends() {

      primeCosmetics(
        friends.map(f => f.name),
        renderInviteFriends
      );


      inviteFriendsList.innerHTML =
        "";


      if (
        friends.length === 0
      ) {

        inviteFriendsList.innerHTML = `

          <p class="muted">
            هنوز دوستی نداری.
          </p>

        `;

        return;

      }


      friends.forEach(
        (friend) => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "request-row";


          const statusClass =
            friend.online
              ? ""
              : "off";


          row.innerHTML = `

            <div
              style="
                display:flex;
                align-items:center;
                gap:9px;
              "
            >

              <span
                class="fdot ${statusClass}"
              ></span>

              <span class="txt">
                
              </span>

            </div>

          `;


          const actions =
            document.createElement(
              "div"
            );


          actions.className =
            "actions";


          const button =
            document.createElement(
              "button"
            );


          if (friend.online) {

            button.textContent =
              "دعوت";


            button.addEventListener(
              "click",
              async () => {

                button.disabled =
                  true;

                button.textContent =
                  "در حال ارسال...";


                try {

                  await inviteFriendToRoom(
                    myName,
                    friend.name,
                    code
                  );


                  button.textContent =
                    "✓ ارسال شد";


                } catch (error) {

                  console.error(
                    error
                  );


                  button.disabled =
                    false;

                  button.textContent =
                    "دعوت";

                  alert(
                    "ارسال دعوت انجام نشد."
                  );

                }

              }
            );

          } else {

            button.textContent =
              "آفلاین";

            button.disabled =
              true;

            button.classList.add(
              "btn-ghost"
            );

          }


          actions.appendChild(
            button
          );


          row.appendChild(
            actions
          );


          decorateFriendRow(row, friend.name);


          inviteFriendsList
            .appendChild(
              row
            );

        }
      );

    }


    // ============================================================
    // باز کردن پنل دعوت
    // ============================================================

    inviteRoomBtn.addEventListener(
      "click",
      () => {

        inviteCard.style.display =
          "block";


        renderInviteFriends();


        inviteCard.scrollIntoView({
          behavior:
            "smooth",

          block:
            "center"

        });

      }
    );


    // ============================================================
    // بستن پنل دعوت
    // ============================================================

    closeInviteBtn.addEventListener(
      "click",
      () => {

        inviteCard.style.display =
          "none";

      }
    );


    // ============================================================
    // شروع
    // ============================================================

    async function init() {

      const user =
        await waitForUser();


      if (!user) {

        window.location.href =
          "index.html";

        return;

      }


      myUid =
        currentUid();


      // ورود بازیکن به لابی
      await joinLobby(
        myName
      );


      // چت
      mountChat(
        myName,
        code
      );


      // نمایش اولیه
      renderPlayers();

      renderGames();


      // دوستان
      listenFriends(
        myName,
        (list) => {

          friends =
            list || [];


          if (
            inviteCard.style.display !==
            "none"
          ) {

            renderInviteFriends();

          }

        }
      );


      // بازیکنان
      onValue(
        R("players"),
        (snap) => {

          players =
            snap.val() || {};


          renderPlayers();

          renderGames();

          maybeStartGame();

        }
      );


      // رای‌ها
      onValue(
        R("votes"),
        (snap) => {

          votes =
            snap.val() || {};


          renderPlayers();

          renderGames();

          maybeStartGame();

        }
      );


      // بازی انتخاب‌شده
      onValue(
        R("currentGame"),
        (snap) => {

          const currentGame =
            snap.val();


          if (
            currentGame &&
            currentGame.gameId
          ) {

            started =
              true;


            window.location.href =
              `games/${currentGame.gameId}.html?round=${currentGame.roundId}`;

          }

        }
      );

    }


    init();


    // ============================================================
    // خروج از اتاق
    // ============================================================

    document
      .getElementById("leaveBtn")
      .addEventListener(
        "click",
        async () => {

          await leaveLobby();

          clearRoom();

          window.location.href =
            "index.html";

        }
      );

  </script>
<script type="module" src="./js/invite-notification.js"></script>
<script type="module" src="./js/notifications.js"></script>
<script src="./js/nav.js" defer></script>
  
</body>
</html>
