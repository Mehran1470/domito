<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتاق بازی | دومیتو</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">🁢</div>
      <h1>اتاق بازی</h1>
      <div class="room-code-badge" id="roomCodeText" style="margin-top:8px;"></div>
    </div>

    <div class="card">
      <h2>👥 بازیکنان (<span id="playerCount">0</span>)</h2>
      <div class="room-players" id="playerGrid"></div>
    </div>

    <div class="card">
      <h2>رای بده به بازی بعدی</h2>
      <div id="gameOptions"></div>
      <p class="status-line" id="voteStatus">در انتظار رای‌ها...</p>
    </div>

    <button id="leaveBtn" class="btn-full btn-ghost">خروج از اتاق</button>
  </div>

<script type="module">
  import {
    GAMES, roomRef, getSavedRoom, onValue, set, waitForUser,
    getSavedName, leaveLobby, joinLobby, runTransaction, clearRoom, currentUid
  } from "./js/app.js";
  import { mountChat } from "./js/chat.js";

  const myName = getSavedName();
  const code = getSavedRoom();
  if (!myName || !code) window.location.href = "index.html";
  document.getElementById("roomCodeText").textContent = `کد: ${code}`;

  const R = (p) => roomRef(code, p);

  let myUid = null;
  let players = {};
  let votes = {};
  let started = false;

  const playerGrid = document.getElementById("playerGrid");
  const playerCount = document.getElementById("playerCount");
  const gameOptions = document.getElementById("gameOptions");
  const voteStatus = document.getElementById("voteStatus");

  function renderPlayers() {
    playerCount.textContent = Object.keys(players).length;
    playerGrid.innerHTML = "";
    Object.entries(players).forEach(([uid, p]) => {
      const voted = !!votes[uid];
      const el = document.createElement("div");
      el.className = "room-player";
      el.innerHTML = `
        ${voted ? '<span class="ready-badge">رای داد</span>' : ""}
        <div class="room-avatar">${(p.name.trim()[0] || "?").toUpperCase()}</div>
        <div class="pname">${p.name}${uid === myUid ? " (تو)" : ""}</div>
      `;
      playerGrid.appendChild(el);
    });
  }

  function tally() {
    const counts = {};
    GAMES.forEach((g) => (counts[g.id] = 0));
    Object.entries(votes).forEach(([uid, v]) => {
      if (players[uid] && counts[v.gameId] !== undefined) counts[v.gameId]++;
    });
    return counts;
  }

  function renderGames() {
    const counts = tally();
    gameOptions.innerHTML = "";
    GAMES.forEach((g) => {
      const el = document.createElement("div");
      const myVote = votes[myUid]?.gameId === g.id;
      el.className = "game-option" + (myVote ? " voted" : "");
      el.innerHTML = `
        <div><div class="name">${g.name}</div><div class="desc">${g.desc}</div></div>
        <div class="votes">${counts[g.id]}</div>
      `;
      el.addEventListener("click", async () => {
        await set(R(`votes/${myUid}`), { gameId: g.id, name: myName });
      });
      gameOptions.appendChild(el);
    });
    const validVotes = Object.keys(votes).filter((uid) => players[uid]).length;
    const totalPlayers = Object.keys(players).length;
    voteStatus.textContent = `${validVotes} از ${totalPlayers} نفر رای دادند`;
  }

  async function maybeStartGame() {
    const validVotes = Object.keys(votes).filter((uid) => players[uid]).length;
    const totalPlayers = Object.keys(players).length;
    if (started || totalPlayers === 0 || validVotes < totalPlayers) return;

    const counts = tally();
    let winner = GAMES[0].id;
    let best = -1;
    GAMES.forEach((g) => { if (counts[g.id] > best) { best = counts[g.id]; winner = g.id; } });

    await runTransaction(R("currentGame"), (curr) => (curr && curr.gameId ? curr : { gameId: winner, roundId: Date.now() }));
  }

  async function init() {
    const user = await waitForUser();
    if (!user) { window.location.href = "index.html"; return; }
    myUid = currentUid();
    await joinLobby(myName);
    mountChat(myName, code);
    renderPlayers();
    renderGames();

    onValue(R("players"), (snap) => { players = snap.val() || {}; renderPlayers(); renderGames(); maybeStartGame(); });
    onValue(R("votes"), (snap) => { votes = snap.val() || {}; renderPlayers(); renderGames(); maybeStartGame(); });
    onValue(R("currentGame"), (snap) => {
      const cg = snap.val();
      if (cg && cg.gameId) { started = true; window.location.href = `games/${cg.gameId}.html?round=${cg.roundId}`; }
    });
  }
  init();

  document.getElementById("leaveBtn").addEventListener("click", async () => {
    await leaveLobby();
    clearRoom();
    window.location.href = "index.html";
  });
</script>
</body>
</html>
