<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل | دومیتو</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">🁢</div>
      <h1>پروفایل</h1>
    </div>

    <div class="card" id="noNameCard" style="display:none">
      <p class="status-line">هنوز اسمی ثبت نکردی.</p>
      <a href="index.html" class="btn btn-full">ورود به سالن</a>
    </div>

    <div id="profileContent" style="display:none">
      <div class="card">
        <div class="profile-header">
          <div class="avatar" id="avatarLetter"></div>
          <div>
            <div style="font-weight:900; font-size:18px;" id="nameText"></div>
            <div class="muted" id="joinedGamesText"></div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="num" id="winsNum">0</div><div class="lbl">برد</div></div>
          <div class="stat-box"><div class="num" id="lossesNum">0</div><div class="lbl">باخت</div></div>
          <div class="stat-box"><div class="num" id="playedNum">0</div><div class="lbl">کل بازی‌ها</div></div>
        </div>
      </div>

      <div class="card">
        <h2>امتیاز به تفکیک بازی</h2>
        <div class="score-board" id="perGameBoard"></div>
      </div>
    </div>

    <a href="index.html" class="link-back">← بازگشت به سالن</a>
  </div>

<script type="module">
  import { getSavedName, profileRef, onValue, GAMES } from "./js/app.js";

  const name = getSavedName();
  if (!name) {
    document.getElementById("noNameCard").style.display = "block";
  } else {
    document.getElementById("profileContent").style.display = "block";
    document.getElementById("nameText").textContent = name;
    document.getElementById("avatarLetter").textContent = name.trim()[0] || "?";

    onValue(profileRef(name), (snap) => {
      const p = snap.val() || { wins: 0, losses: 0, gamesPlayed: 0, byGame: {} };
      document.getElementById("winsNum").textContent = p.wins || 0;
      document.getElementById("lossesNum").textContent = p.losses || 0;
      document.getElementById("playedNum").textContent = p.gamesPlayed || 0;
      document.getElementById("joinedGamesText").textContent =
        `${p.gamesPlayed || 0} دور بازی کرده`;

      const board = document.getElementById("perGameBoard");
      board.innerHTML = "";
      GAMES.forEach(g => {
        const stats = (p.byGame && p.byGame[g.id]) || { wins: 0, plays: 0 };
        const row = document.createElement("div");
        row.className = "score-row";
        row.innerHTML = `
          <span>${g.name}</span>
          <span class="muted" style="font-size:12px;">${stats.plays} بازی</span>
          <span class="points">${stats.wins} برد</span>
        `;
        board.appendChild(row);
      });
    });
  }
</script>
</body>
</html>
