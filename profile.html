<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل | دومیتو</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">🁢</div>
      <h1>پروفایل</h1>
    </div>

    <div class="card" id="noNameCard" style="display:none">
      <p class="status-line">هنوز وارد نشدی.</p>
      <a href="index.html" class="btn btn-full">ورود</a>
    </div>

    <div id="profileContent" style="display:none">
      <div class="card">
        <div class="profile-header">
          <div class="avatar" id="avatarBox"></div>
          <div>
            <div style="font-weight:900; font-size:18px;" id="nameText"></div>
            <div class="muted" id="joinedGamesText"></div>
          </div>
        </div>
        <div style="margin-top:10px;">
          <a href="wallet.html" class="coin-badge" style="text-decoration:none;">🪙 <span id="coinCount">0</span> سکه ←</a>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="num" id="winsNum">0</div><div class="lbl">برد</div></div>
          <div class="stat-box"><div class="num" id="lossesNum">0</div><div class="lbl">باخت</div></div>
          <div class="stat-box"><div class="num" id="playedNum">0</div><div class="lbl">کل بازی‌ها</div></div>
        </div>
      </div>

      <div class="card">
        <h2>امتیاز به تفکیک بازی</h2>
        <div class="score-board" id="perGameBoard"></div>
      </div>

      <div class="card">
        <h2>فروشگاه تم آواتار</h2>
        <div class="shop-grid" id="shopGrid"></div>
        <p class="status-line" id="shopStatus"></p>
      </div>

      <button id="logoutBtn" class="btn-full btn-ghost">خروج از حساب</button>
    </div>

    <a href="index.html" class="link-back">← بازگشت</a>
  </div>

<script type="module">
  import {
    getSavedName, profileRef, onValue, GAMES, SHOP_ITEMS, buyItem, equipTheme, waitForUser, logoutUser
  } from "./js/app.js";

  const shopStatus = document.getElementById("shopStatus");

  waitForUser().then((user) => {
    const name = getSavedName();
    if (!user || !name) { document.getElementById("noNameCard").style.display = "block"; return; }

    document.getElementById("profileContent").style.display = "block";
    document.getElementById("nameText").textContent = name;

    function themeGradient(equippedTheme) {
      const item = SHOP_ITEMS.find((i) => i.id === equippedTheme);
      return item ? `linear-gradient(145deg, ${item.colors[0]}, ${item.colors[1]})` : null;
    }

    onValue(profileRef(name), (snap) => {
      const p = snap.val() || { wins: 0, losses: 0, gamesPlayed: 0, byGame: {}, coins: 0, purchased: [], equippedTheme: "default" };
      document.getElementById("winsNum").textContent = p.wins || 0;
      document.getElementById("lossesNum").textContent = p.losses || 0;
      document.getElementById("playedNum").textContent = p.gamesPlayed || 0;
      document.getElementById("coinCount").textContent = p.coins || 0;
      document.getElementById("joinedGamesText").textContent = `${p.gamesPlayed || 0} دور بازی کرده`;

      const avatarBox = document.getElementById("avatarBox");
      avatarBox.textContent = name.trim()[0]?.toUpperCase() || "?";
      const grad = themeGradient(p.equippedTheme);
      if (grad) avatarBox.style.background = grad;

      const board = document.getElementById("perGameBoard");
      board.innerHTML = "";
      GAMES.forEach((g) => {
        const stats = (p.byGame && p.byGame[g.id]) || { wins: 0, plays: 0 };
        const row = document.createElement("div");
        row.className = "score-row";
        row.innerHTML = `<span>${g.name}</span><span class="muted" style="font-size:12px;">${stats.plays} بازی</span><span class="points">${stats.wins} برد</span>`;
        board.appendChild(row);
      });

      renderShop(p);
    });

    function renderShop(p) {
      const purchased = p.purchased || [];
      const grid = document.getElementById("shopGrid");
      grid.innerHTML = "";
      SHOP_ITEMS.forEach((item) => {
        const owned = purchased.includes(item.id);
        const equipped = p.equippedTheme === item.id;
        const el = document.createElement("div");
        el.className = "shop-item" + (owned ? " owned" : "") + (equipped ? " equipped" : "");
        el.innerHTML = `
          <div class="swatch" style="background:linear-gradient(135deg, ${item.colors[0]}, ${item.colors[1]})"></div>
          <div class="name">${item.name}</div>
          <div class="price">${owned ? (equipped ? "فعاله" : "خریداری‌شده") : `🪙 ${item.price}`}</div>
        `;
        const btn = document.createElement("button");
        if (equipped) { btn.textContent = "فعاله"; btn.disabled = true; }
        else if (owned) {
          btn.textContent = "فعال کردن"; btn.className = "btn-ghost";
          btn.addEventListener("click", async () => { await equipTheme(name, item.id); });
        } else {
          btn.textContent = "خرید"; btn.className = "btn-gold";
          btn.addEventListener("click", async () => {
            const res = await buyItem(name, item.id);
            shopStatus.textContent = res.ok ? "خریداری شد!" : (res.reason === "insufficient" ? "سکه‌ت کافی نیست" : "خطا در خرید");
          });
        }
        el.appendChild(btn);
        grid.appendChild(el);
      });
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await logoutUser();
      window.location.href = "index.html";
    });
  });
</script>
</body>
</html>
