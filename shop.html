
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f111a">
  <title>فروشگاه دومیتو 🛍️</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --shop-gold: #ffd166;
      --shop-muted: #aab1c5;
      --shop-border: rgba(255,255,255,.09);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top right, rgba(107,80,255,.15), transparent 45%),
        radial-gradient(ellipse at bottom left, rgba(255,190,70,.08), transparent 40%);
    }

    .shop-wrap {
      width: min(100%, 900px);
      margin: auto;
      padding: 20px 14px 40px;
    }

    .shop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .shop-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shop-logo {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 17px;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--shop-border);
      font-size: 26px;
    }

    .shop-title {
      margin: 0;
      font-size: 23px;
      font-weight: 900;
    }

    .shop-subtitle {
      margin: 5px 0 0;
      color: var(--shop-muted);
      font-size: 12px;
    }

    .shop-wallet {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 15px;
      border: 1px solid rgba(255,209,102,.2);
      border-radius: 15px;
      background: rgba(255,209,102,.09);
      color: var(--shop-gold);
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .shop-hero {
      position: relative;
      overflow: hidden;
      padding: 25px 20px;
      margin-bottom: 22px;
      border: 1px solid var(--shop-border);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(116,91,255,.16), rgba(255,255,255,.035));
    }

    .shop-hero h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .shop-hero p {
      margin: 0;
      color: var(--shop-muted);
      line-height: 1.9;
      font-size: 13px;
    }

    .shop-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 22px 2px 13px;
    }

    .shop-section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .shop-count {
      color: var(--shop-muted);
      font-size: 12px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .shop-item {
      min-width: 0;
      padding: 13px;
      border-radius: 21px;
      border: 1px solid var(--shop-border);
      background: rgba(255,255,255,.035);
      transition: transform .18s ease, border-color .18s ease;
    }

    .shop-item.owned {
      border-color: rgba(76,217,123,.24);
    }

    .shop-item.equipped {
      border-color: rgba(255,209,102,.6);
      background: rgba(255,209,102,.055);
    }

    .shop-item:active {
      transform: scale(.985);
    }

    .shop-swatch {
      height: 82px;
      border-radius: 15px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,.12);
      position: relative;
      overflow: hidden;
    }

    .shop-swatch::after {
      content: "D";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.88);
      font-size: 35px;
      font-weight: 1000;
      text-shadow: 0 3px 20px rgba(0,0,0,.25);
    }

    .shop-item-name {
      font-weight: 900;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .shop-item-price {
      color: var(--shop-gold);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .shop-item-state {
      color: var(--shop-muted);
      font-size: 11px;
      margin-bottom: 10px;
      min-height: 17px;
    }

    .shop-action {
      width: 100%;
      min-height: 39px;
      padding: 9px 8px;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      color: #171717;
      background: var(--shop-gold);
    }

    .shop-action.secondary {
      color: #fff;
      background: rgba(255,255,255,.09);
      border: 1px solid var(--shop-border);
    }

    .shop-action:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .shop-status {
      min-height: 24px;
      margin: 16px 2px;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    .shop-links {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .shop-links a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 12px;
      border-radius: 14px;
    }

    .shop-back {
      color: inherit;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--shop-border);
    }

    .shop-wallet-link {
      color: #171717;
      background: var(--shop-gold);
      font-weight: 900;
    }

    .shop-loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 12px;
      color: var(--shop-muted);
    }

    @media (min-width: 650px) {
      .shop-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 15px;
      }

      .shop-swatch {
        height: 105px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .shop-item {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="shop-wrap">

    <header class="shop-header">
      <div class="shop-brand">
        <div class="shop-logo">🛍️</div>
        <div>
          <h1 class="shop-title">فروشگاه دومیتو</h1>
          <p class="shop-subtitle">ظاهر خودت رو خاص کن ✨</p>
        </div>
      </div>

      <a class="shop-wallet" href="wallet.html">
        🪙 <span id="shopCoins">۰</span> سکه
      </a>
    </header>

    <section class="shop-hero">
      <h2>استایل بعدی تو کدومه؟ 🎨</h2>
      <p>
        تم موردعلاقه‌ات رو انتخاب کن، با سکه بخر و روی آواتارت فعالش کن.
        تم‌های خریداری‌شده همیشه در دسترس تو می‌مونن.
      </p>
    </section>

    <div class="shop-section-title">
      <h2>🎨 تم‌های آواتار</h2>
      <span class="shop-count" id="shopItemCount">در حال بارگذاری...</span>
    </div>

    <section class="shop-grid" id="shopGrid" aria-live="polite">
      <div class="shop-loading">در حال دریافت فروشگاه...</div>
    </section>

    <p class="shop-status" id="shopStatus" role="status" aria-live="polite"></p>

    <nav class="shop-links">
      <a href="profile.html" class="shop-back">👤 پروفایل من</a>
      <a href="wallet.html" class="shop-wallet-link">🪙 کیف پول</a>
    </nav>

  </main>

  <script type="module">
    import {
      getSavedName,
      profileRef,
      onValue,
      SHOP_ITEMS,
      buyItem,
      equipTheme,
      waitForUser
    } from "./js/app.js";

    const grid = document.getElementById("shopGrid");
    const coinsEl = document.getElementById("shopCoins");
    const statusEl = document.getElementById("shopStatus");
    const countEl = document.getElementById("shopItemCount");

    let myName = "";
    let currentProfile = {};
    let busyItems = new Set();

    function faNumber(value) {
      return Number(value || 0).toLocaleString("fa-IR");
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "#ff8b8b" : "#7fe5a0";
    }

    function createItem(item) {
      const owned = (currentProfile.purchased || []).includes(item.id);
      const equipped = currentProfile.equippedTheme === item.id;
      const busy = busyItems.has(item.id);

      const card = document.createElement("article");
      card.className = "shop-item" +
        (owned ? " owned" : "") +
        (equipped ? " equipped" : "");

      const swatch = document.createElement("div");
      swatch.className = "shop-swatch";
      swatch.style.background =
        `linear-gradient(135deg, ${item.colors[0]}, ${item.colors[1]})`;

      const name = document.createElement("div");
      name.className = "shop-item-name";
      name.textContent = item.name;

      const price = document.createElement("div");
      price.className = "shop-item-price";
      price.textContent = owned ? "متعلق به تو" : `🪙 ${faNumber(item.price)} سکه`;

      const state = document.createElement("div");
      state.className = "shop-item-state";
      state.textContent = equipped
        ? "✨ همین الان فعاله"
        : owned
          ? "✅ خریداری شده"
          : "برای تغییر ظاهر آواتار";

      const button = document.createElement("button");
      button.className = "shop-action";
      button.type = "button";
      button.disabled = busy || equipped;
      button.textContent = busy
        ? "در حال انجام..."
        : equipped
          ? "تم فعال"
          : owned
            ? "فعال کردن"
            : "خرید تم";

      if (owned && !equipped) {
        button.classList.add("secondary");
      }

      button.addEventListener("click", async () => {
        if (busyItems.has(item.id)) return;

        busyItems.add(item.id);
        setStatus("");

        // تا رسیدن نتیجه، دکمه قفل می‌شود.
        renderShop();

        try {
          if (owned) {
            const result = await equipTheme(myName, item.id);

            if (result && result.ok === false) {
              setStatus("فعال‌کردن تم انجام نشد.", true);
            } else {
              setStatus(`✨ تم «${item.name}» فعال شد!`);
            }
          } else {
            const result = await buyItem(myName, item.id);

            if (result && result.ok) {
              setStatus(`🎉 تم «${item.name}» خریداری شد!`);
            } else if (result?.reason === "insufficient") {
              setStatus("سکه‌هات برای خرید این تم کافی نیست. 🪙", true);
            } else if (result?.reason === "owned") {
              setStatus("این تم از قبل خریداری شده است.");
            } else {
              setStatus("خرید انجام نشد. دوباره تلاش کن.", true);
            }
          }
        } catch (error) {
          console.error("Shop action failed:", error);
          setStatus("ارتباط با فروشگاه برقرار نشد. دوباره امتحان کن.", true);
        } finally {
          busyItems.delete(item.id);
          renderShop();
        }
      });

      card.append(swatch, name, price, state, button);
      return card;
    }

    function renderShop() {
      grid.replaceChildren();

      if (!Array.isArray(SHOP_ITEMS) || SHOP_ITEMS.length === 0) {
        const empty = document.createElement("div");
        empty.className = "shop-loading";
        empty.textContent = "فعلاً تمی در فروشگاه موجود نیست.";
        grid.appendChild(empty);
        countEl.textContent = "۰ تم";
        return;
      }

      countEl.textContent = `${faNumber(SHOP_ITEMS.length)} تم`;

      for (const item of SHOP_ITEMS) {
        grid.appendChild(createItem(item));
      }
    }

    async function startShop() {
      try {
        const user = await waitForUser();
        myName = getSavedName();

        if (!user || !myName) {
          grid.innerHTML = "";
          const message = document.createElement("div");
          message.className = "shop-loading";
          message.textContent = "برای استفاده از فروشگاه، ابتدا وارد دومیتو شو.";
          grid.appendChild(message);
          countEl.textContent = "نیازمند ورود";
          setStatus("از صفحه اصلی وارد حساب خودت شو.", true);
          return;
        }

        onValue(profileRef(myName), (snapshot) => {
          currentProfile = snapshot.val() || {};
          coinsEl.textContent = faNumber(currentProfile.coins || 0);
          renderShop();
        }, (error) => {
          console.error("Profile listener failed:", error);
          setStatus("دریافت اطلاعات حساب انجام نشد.", true);
        });
      } catch (error) {
        console.error("Shop initialization failed:", error);
        grid.innerHTML = "";
        const message = document.createElement("div");
        message.className = "shop-loading";
        message.textContent = "بارگذاری فروشگاه ناموفق بود. صفحه را دوباره باز کن.";
        grid.appendChild(message);
        setStatus("خطا در اتصال به حساب کاربری.", true);
      }
    }

    startShop();
  </script>
</body>
</html>
