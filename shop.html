
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0a24">
  <title>فروشگاه دومیتو 🛍️</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">

  <style>
    :root {
      --shop-gold: #ffd166;
      --shop-muted: #aab1c5;
      --shop-border: rgba(255,255,255,.09);
      --rarity-common: #9ca3af;
      --rarity-rare: #4fd1ff;
      --rarity-epic: #b28dff;
      --rarity-legendary: #ffc845;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top right, rgba(107,80,255,.15), transparent 45%),
        radial-gradient(ellipse at bottom left, rgba(255,190,70,.08), transparent 40%);
    }

    .shop-wrap {
      width: min(100%, 900px);
      margin: auto;
      padding: 20px 14px 40px;
    }

    .shop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .shop-brand { display: flex; align-items: center; gap: 12px; }

    .shop-logo {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 17px;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--shop-border);
      font-size: 26px;
    }

    .shop-title { margin: 0; font-size: 23px; font-weight: 900; }
    .shop-subtitle { margin: 5px 0 0; color: var(--shop-muted); font-size: 12px; }

    .shop-wallet {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 15px;
      border: 1px solid rgba(255,209,102,.2);
      border-radius: 15px;
      background: rgba(255,209,102,.09);
      color: var(--shop-gold);
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ظاهر فعلی */
    .shop-me {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--shop-border);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(116,91,255,.16), rgba(255,255,255,.035));
    }

    .shop-me-avatar {
      flex: none;
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(145deg, var(--violet), var(--accent));
    }

    .shop-me-name { font-size: 17px; font-weight: 900; }
    .shop-me-hint { margin-top: 6px; color: var(--shop-muted); font-size: 11.5px; line-height: 1.7; }

    /* تب‌ها */
    .shop-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .shop-tabs::-webkit-scrollbar { display: none; }

    .shop-tab {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid var(--shop-border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      box-shadow: none;
    }
    .shop-tab .tab-count { color: var(--shop-muted); font-size: 11px; font-weight: 700; }
    .shop-tab[aria-selected="true"] {
      background: var(--shop-gold);
      border-color: var(--shop-gold);
      color: #171717;
    }
    .shop-tab[aria-selected="true"] .tab-count { color: #4a3a10; }

    .shop-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 2px 14px;
    }

    .shop-chip {
      padding: 7px 13px;
      border-radius: 100px;
      border: 1px solid var(--shop-border);
      background: transparent;
      color: var(--shop-muted);
      font-size: 12px;
      font-weight: 700;
      box-shadow: none;
    }
    .shop-chip[aria-pressed="true"] {
      color: var(--shop-gold);
      border-color: rgba(255,209,102,.5);
      background: rgba(255,209,102,.1);
    }

    .shop-count { margin-inline-start: auto; color: var(--shop-muted); font-size: 12px; }

    .shop-cat-hint { margin: 0 2px 12px; color: var(--shop-muted); font-size: 12px; }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 0;
    }

    .shop-item {
      position: relative;
      min-width: 0;
      padding: 13px;
      border-radius: 21px;
      border: 1px solid var(--shop-border);
      background: rgba(255,255,255,.035);
      transition: transform .18s ease, border-color .18s ease;
      text-align: right;
    }
    .shop-item.owned { border-color: rgba(76,217,123,.24); }
    .shop-item.equipped { border-color: rgba(255,209,102,.6); background: rgba(255,209,102,.055); }
    .shop-item:active { transform: scale(.985); }

    .shop-rarity {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--r, var(--rarity-common));
    }
    .shop-item[data-rarity="common"]    { --r: var(--rarity-common); }
    .shop-item[data-rarity="rare"]      { --r: var(--rarity-rare); }
    .shop-item[data-rarity="epic"]      { --r: var(--rarity-epic); }
    .shop-item[data-rarity="legendary"] { --r: var(--rarity-legendary); }

    .shop-fav {
      position: absolute;
      top: 9px;
      left: 9px;
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      border: 0;
      background: rgba(255,255,255,.07);
      color: var(--shop-muted);
      font-size: 17px;
      box-shadow: none;
    }
    .shop-fav[aria-pressed="true"] { color: #ff6b9d; background: rgba(255,107,157,.14); }

    .cos-preview {
      display: grid;
      place-items: center;
      height: 88px;
      margin-bottom: 11px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.18);
      overflow: hidden;
    }
    .cos-sample-avatar {
      width: 56px;
      height: 56px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(145deg, var(--violet), var(--accent));
    }
    .cos-sample-badge { font-size: 40px; line-height: 1; }
    .cos-sample-title { font-size: 13px; padding: 3px 12px; }
    .cos-sample-name  { font-size: 20px; font-weight: 900; }

    .shop-item-name { font-weight: 900; font-size: 14px; margin-bottom: 7px; }
    .shop-item-price { color: var(--shop-gold); font-size: 12px; font-weight: 800; margin-bottom: 10px; }
    .shop-item-state { color: var(--shop-muted); font-size: 11px; margin-bottom: 10px; min-height: 17px; }

    .shop-action {
      width: 100%;
      min-height: 41px;
      padding: 9px 8px;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 900;
      cursor: pointer;
      color: #171717;
      background: var(--shop-gold);
      box-shadow: none;
    }
    .shop-action.secondary { color: #fff; background: rgba(255,255,255,.09); border: 1px solid var(--shop-border); }
    .shop-action.confirm { background: #ff8b5e; }
    .shop-action:disabled { opacity: .55; cursor: not-allowed; }

    .shop-status { min-height: 24px; margin: 16px 2px; text-align: center; font-size: 13px; line-height: 1.8; }

    .shop-links { display: flex; gap: 10px; margin-top: 25px; }
    .shop-links a { flex: 1; text-align: center; text-decoration: none; padding: 12px; border-radius: 14px; }
    .shop-back { color: inherit; background: rgba(255,255,255,.06); border: 1px solid var(--shop-border); }
    .shop-wallet-link { color: #171717; background: var(--shop-gold); font-weight: 900; }

    .shop-loading { grid-column: 1 / -1; text-align: center; padding: 32px 12px; color: var(--shop-muted); }

    @media (min-width: 650px) {
      .shop-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
      .cos-preview { height: 100px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .shop-item { transition: none; }
    }

    /* ---- ظاهر جدید دومیتو ---- */
    :root { --shop-gold: #ff7ab0; --shop-muted: #b3acdf; --shop-border: rgba(255,255,255,.12); }
    body { background: none; }
    .shop-wrap { width: 100%; max-width: 480px; padding: 0; margin: 0 auto; }
    .shop-logo { border-radius: 50%; background: linear-gradient(135deg,#7c5cff,#ff4d8d); border: 0; }
    .shop-title { font-size: 20px; }
    .shop-wallet { border-radius: 100px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #ffd166; }
    .shop-me { border-radius: 24px; background: linear-gradient(160deg,rgba(124,92,255,.22),rgba(26,20,72,.75)); }
    .shop-me-avatar { border-radius: 50%; background: linear-gradient(135deg,#7c5cff,#ff4d8d); }
    .shop-tab { border-radius: 100px; background: rgba(255,255,255,.07); }
    .shop-tab[aria-selected="true"] { background: linear-gradient(135deg,#7c5cff,#ff4d8d); border-color: transparent; color: #fff; }
    .shop-tab[aria-selected="true"] .tab-count { color: #ffe3f0; }
    .shop-chip[aria-pressed="true"] { color: #fff; border-color: transparent; background: rgba(124,92,255,.45); }
    .shop-item { border-radius: 24px; background: rgba(255,255,255,.06); }
    .shop-item.equipped { border-color: #ff7ab0; background: rgba(255,77,141,.1); }
    .cos-preview { border-radius: 18px; background: linear-gradient(160deg,#2a1470,#4a1a68); }
    .cos-sample-avatar { background: linear-gradient(135deg,#7c5cff,#ff4d8d); }
    .shop-item-price { color: #ffd166; }
    .shop-action { background: linear-gradient(135deg,#7c5cff,#ff4d8d); color: #fff; border-radius: 100px; }
    .shop-action.secondary { background: rgba(255,255,255,.1); }
    .shop-action.confirm { background: #ff8b5e; }
    .shop-wallet-link { background: linear-gradient(135deg,#7c5cff,#ff4d8d); color: #fff; }
    .shop-links { margin-bottom: 10px; }
  </style>
</head>

<body class="pg">
  <main class="shop-wrap">

    <header class="shop-header">
      <div class="shop-brand">
        <div class="shop-logo">🛍️</div>
        <div>
          <h1 class="shop-title">فروشگاه دومیتو</h1>
          <p class="shop-subtitle">ظاهر خودت رو خاص کن ✨</p>
        </div>
      </div>

      <a class="shop-wallet" href="wallet.html">
        🪙 <span id="shopCoins">۰</span> سکه
      </a>
    </header>

    <!-- ظاهر فعلی -->
    <section class="shop-me" id="shopMe" hidden>
      <div class="shop-me-avatar" id="shopMeAvatar"></div>
      <div>
        <div class="shop-me-name" id="shopMeName"></div>
        <div class="shop-me-hint">این همان چیزی است که بقیه در لابی و لیست دوستان می‌بینند.</div>
      </div>
    </section>

    <div class="shop-tabs" id="shopTabs" role="tablist" aria-label="دسته‌بندی فروشگاه"></div>

    <div class="shop-filters" id="shopFilters">
      <button type="button" class="shop-chip" id="filterOwned" aria-pressed="false">✅ خریداری‌شده‌ها</button>
      <button type="button" class="shop-chip" id="filterFav" aria-pressed="false">❤️ علاقه‌مندی‌ها</button>
      <span class="shop-count" id="shopItemCount">در حال بارگذاری...</span>
    </div>

    <p class="shop-cat-hint" id="shopCatHint"></p>

    <section class="shop-grid" id="shopGrid" aria-live="polite">
      <div class="shop-loading">در حال دریافت فروشگاه...</div>
    </section>

    <p class="shop-status" id="shopStatus" role="status" aria-live="polite"></p>

    <nav class="shop-links">
      <a href="profile.html" class="shop-back">👤 پروفایل من</a>
      <a href="wallet.html" class="shop-wallet-link">🪙 کیف پول</a>
    </nav>

  </main>

  <script>
    // عیب‌یابی: هر خطای بارگذاری/اجرا را روی صفحه نشان می‌دهد
    window.__shopV = "2026-11-26-4";
    (function () {
      function show(msg) {
        var el = document.getElementById("shopStatus");
        if (el) { el.textContent = "⚠️ " + msg; el.style.color = "#ff8b8b"; }
      }
      window.addEventListener("error", function (e) {
        show("خطا: " + (e.message || "بارگذاری اسکریپت ناموفق") + (e.filename ? " (" + String(e.filename).split("/").pop() + ")" : ""));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason; show("خطا: " + ((r && (r.message || r.code)) || r));
      });
      setTimeout(function () {
        if (!window.__shopStarted) show("اسکریپت فروشگاه اجرا نشد (احتمالاً بارگذاری Firebase/gstatic ناموفق بود). نسخه صفحه: " + window.__shopV);
      }, 7000);
    })();
  </script>
  <script src="./js/nav.js" defer></script>
  <script type="module">

    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, get, onValue, runTransaction, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { firebaseConfig } from "./js/firebase-config.js";
    import {
      SHOP_ITEMS, SHOP_CATEGORIES, RARITY_LABELS, readShop,
      applyPurchase, applyEquip, applyUnequip, applyFavorite
    } from "./js/shop-core.js";

    // فروشگاه عمداً مستقل از js/app.js نوشته شده تا خرابی جای دیگر جلوی بارگذاری آن را نگیرد.
    const fbApp = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const auth = getAuth(fbApp);
    const db = getDatabase(fbApp);

    const getSavedName = () => (localStorage.getItem("domito_name") || "").trim();
    const profileRef = (name) => ref(db, "profiles/" + encodeURIComponent(String(name || "")));

    // ظاهرسازی (پیش‌نمایش/نام) اختیاری است؛ اگر بارگذاری نشد، نسخهٔ ساده نشان داده می‌شود.
    let cos = null;
    import("./js/cosmetics.js").then((m) => {
      cos = m;
      try { m.injectCosmeticStyles(); } catch (e) {}
      if (loaded) { try { renderMe(); renderShop(); } catch (e) {} }
    }).catch((e) => console.warn("cosmetics unavailable:", e));

    function preview(item) {
      if (cos) { try { return cos.createItemPreview(item); } catch (e) {} }
      const d = document.createElement("div");
      d.style.cssText = "height:56px;display:grid;place-items:center;font-size:28px;font-weight:800";
      if (item.emoji) d.textContent = item.emoji;
      else if (item.text) { d.textContent = item.text; d.style.color = item.color; d.style.fontSize = "15px"; }
      else if (item.colors) {
        const c = document.createElement("div");
        c.style.cssText = "width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg," + item.colors.join(",") + ")";
        d.appendChild(c);
      } else d.textContent = "✨";
      return d;
    }

    // خریدهای گران‌تر از این مقدار قبل از کسر سکه یک بار تأیید می‌خواهند.
    const CONFIRM_FROM_PRICE = 500;

    const grid = document.getElementById("shopGrid");
    const tabsEl = document.getElementById("shopTabs");
    const coinsEl = document.getElementById("shopCoins");
    const statusEl = document.getElementById("shopStatus");
    const countEl = document.getElementById("shopItemCount");
    const hintEl = document.getElementById("shopCatHint");
    const meBox = document.getElementById("shopMe");
    const meAvatar = document.getElementById("shopMeAvatar");
    const meName = document.getElementById("shopMeName");
    const filterOwnedBtn = document.getElementById("filterOwned");
    const filterFavBtn = document.getElementById("filterFav");

    let myName = "";
    let currentProfile = {};
    let shop = { purchased: {}, equipped: {}, favorites: {} };
    let activeCategory = SHOP_CATEGORIES[0].id;
    let onlyOwned = false;
    let onlyFav = false;
    let confirmItemId = null;
    let confirmTimer = null;
    const busyItems = new Set();

    function faNumber(value) {
      return Number(value || 0).toLocaleString("fa-IR");
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "#ff8b8b" : "#7fe5a0";
    }

    function clearConfirm() {
      confirmItemId = null;
      clearTimeout(confirmTimer);
    }

    // ---------- بالای صفحه ----------

    function renderMe() {
      meBox.hidden = false;
      meAvatar.textContent = myName.trim()[0]?.toUpperCase() || "?";
      if (cos) { cos.applyAvatarStyle(meAvatar, shop.equipped); cos.renderNameBlock(meName, myName, shop.equipped); }
      else meName.textContent = myName;
    }

    function renderTabs() {
      tabsEl.replaceChildren();

      for (const cat of SHOP_CATEGORIES) {
        const items = SHOP_ITEMS.filter((i) => i.category === cat.id);
        const ownedCount = items.filter((i) => shop.purchased[i.id] !== undefined).length;

        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "shop-tab";
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", String(cat.id === activeCategory));

        const label = document.createElement("span");
        label.textContent = `${cat.icon} ${cat.label}`;

        const count = document.createElement("span");
        count.className = "tab-count";
        count.textContent = `${faNumber(ownedCount)}/${faNumber(items.length)}`;

        tab.append(label, count);

        tab.addEventListener("click", () => {
          activeCategory = cat.id;
          clearConfirm();
          renderShop();
        });

        tabsEl.appendChild(tab);
      }
    }

    // ---------- کارت آیتم ----------

    function createItem(item) {
      const owned = shop.purchased[item.id] !== undefined;
      const equipped = shop.equipped[item.category] === item.id;
      const favorite = shop.favorites[item.id] === true;
      const busy = busyItems.has(item.id);
      const coins = Number(currentProfile.coins || 0);
      const missing = Math.max(0, item.price - coins);
      const awaitingConfirm = confirmItemId === item.id;

      const card = document.createElement("article");
      card.className = "shop-item" + (owned ? " owned" : "") + (equipped ? " equipped" : "");
      card.dataset.rarity = item.rarity;

      const fav = document.createElement("button");
      fav.type = "button";
      fav.className = "shop-fav";
      fav.setAttribute("aria-pressed", String(favorite));
      fav.setAttribute("aria-label", favorite ? "حذف از علاقه‌مندی‌ها" : "افزودن به علاقه‌مندی‌ها");
      fav.textContent = favorite ? "❤️" : "🤍";
      fav.disabled = busy;
      fav.addEventListener("click", async () => {
        if (busyItems.has(item.id)) return;
        await runAction(item, () => act(applyFavorite, item.id), () => "");
      });

      const rarity = document.createElement("div");
      rarity.className = "shop-rarity";
      rarity.textContent = RARITY_LABELS[item.rarity] || "";

      const preview = preview(item);

      const name = document.createElement("div");
      name.className = "shop-item-name";
      name.textContent = item.name;

      const price = document.createElement("div");
      price.className = "shop-item-price";
      price.textContent = owned ? "متعلق به تو" : `🪙 ${faNumber(item.price)} سکه`;

      const state = document.createElement("div");
      state.className = "shop-item-state";
      state.textContent = equipped
        ? "✨ همین الان فعاله"
        : owned
          ? "✅ خریداری شده"
          : missing > 0
            ? `${faNumber(missing)} سکه کم داری`
            : "آماده خرید";

      const button = document.createElement("button");
      button.className = "shop-action";
      button.type = "button";
      button.disabled = busy;

      if (busy) {
        button.textContent = "در حال انجام...";
      } else if (equipped) {
        button.textContent = "برداشتن";
        button.classList.add("secondary");
      } else if (owned) {
        button.textContent = "فعال کردن";
        button.classList.add("secondary");
      } else if (awaitingConfirm) {
        button.textContent = `تأیید خرید (${faNumber(item.price)} 🪙)`;
        button.classList.add("confirm");
      } else {
        button.textContent = "خرید";
        button.disabled = missing > 0;
      }

      button.addEventListener("click", async () => {
        if (busyItems.has(item.id)) return;

        if (equipped) {
          await runAction(item, () => act(applyUnequip, item.category),
            () => `«${item.name}» برداشته شد.`);
          return;
        }

        if (owned) {
          await runAction(item, () => act(applyEquip, item.id),
            (r) => r.ok ? `✨ «${item.name}» فعال شد!` : "فعال‌کردن انجام نشد.");
          return;
        }

        if (item.price >= CONFIRM_FROM_PRICE && confirmItemId !== item.id) {
          clearConfirm();
          confirmItemId = item.id;
          confirmTimer = setTimeout(() => { clearConfirm(); renderShop(); }, 4000);
          setStatus(`برای خرید «${item.name}» دوباره روی دکمه بزن.`);
          renderShop();
          return;
        }

        clearConfirm();
        await runAction(item, () => buy(item), (r) => {
          if (r.ok) return `🎉 «${item.name}» خریداری شد!`;
          if (r.reason === "insufficient") return "سکه‌هات کافی نیست. 🪙";
          if (r.reason === "owned") return "این آیتم از قبل خریداری شده است.";
          return "خرید انجام نشد. دوباره تلاش کن.";
        });
      });

      card.append(fav, rarity, preview, name, price, state, button);
      return card;
    }

    async function runAction(item, action, messageFor) {
      busyItems.add(item.id);
      setStatus("");
      renderShop();

      try {
        const result = await action();
        const message = messageFor(result || {});
        if (message) setStatus(message, !(result && result.ok));
      } catch (error) {
        console.error("Shop action failed:", error);
        setStatus("ارتباط با فروشگاه برقرار نشد. دوباره امتحان کن.", true);
      } finally {
        busyItems.delete(item.id);
        renderShop();
      }
    }

    // ---------- لیست ----------

    function renderShop() {
      renderTabs();

      filterOwnedBtn.setAttribute("aria-pressed", String(onlyOwned));
      filterFavBtn.setAttribute("aria-pressed", String(onlyFav));

      const cat = SHOP_CATEGORIES.find((c) => c.id === activeCategory);
      hintEl.textContent = cat ? `${cat.icon} ${cat.label}: ${cat.hint}` : "";

      grid.replaceChildren();

      let items = SHOP_ITEMS
        .filter((i) => i.category === activeCategory)
        .sort((a, b) => a.price - b.price);

      if (onlyOwned) items = items.filter((i) => shop.purchased[i.id] !== undefined);
      if (onlyFav) items = items.filter((i) => shop.favorites[i.id] === true);

      countEl.textContent = `${faNumber(items.length)} آیتم`;

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "shop-loading";
        empty.textContent = onlyOwned || onlyFav
          ? "چیزی با این فیلتر پیدا نشد."
          : "فعلاً آیتمی در این دسته نیست.";
        grid.appendChild(empty);
        return;
      }

      for (const item of items) grid.appendChild(createItem(item));
    }

    filterOwnedBtn.addEventListener("click", () => {
      onlyOwned = !onlyOwned;
      clearConfirm();
      renderShop();
    });

    filterFavBtn.addEventListener("click", () => {
      onlyFav = !onlyFav;
      clearConfirm();
      renderShop();
    });

    // ---------- شروع ----------

    function showMessage(text) {
      grid.replaceChildren();
      const message = document.createElement("div");
      message.className = "shop-loading";
      message.textContent = text;
      grid.appendChild(message);
    }


    // ---------- عملیات (خرید/فعال‌سازی/علاقه‌مندی) ----------

    async function tx(operation) {
      let result = { ok: false, reason: "unknown" };
      await runTransaction(profileRef(myName), (curr) => {
        const outcome = operation(curr || { coins: 0 });
        result = outcome.result;
        return outcome.profile;
      });
      return result;
    }

    const act = (fn, arg) => tx((curr) => fn(curr, arg));

    async function buyAllowed() {
      const uid = auth.currentUser && auth.currentUser.uid;
      try {
        const adm = (await get(ref(db, "admins/" + uid))).val();
        if (adm === true || adm === "true") return true;
      } catch (e) {}
      try {
        const raw = (await get(ref(db, "adminAccess/" + encodeURIComponent(myName)))).val() || {};
        const until = Number(raw.blockedUntil);
        if (raw.buy === false) return false;
        if (Number.isFinite(until) && until > Date.now()) return false;
      } catch (e) {}
      return true;
    }

    async function buy(item) {
      if (!(await buyAllowed())) return { ok: false, reason: "no-access" };
      const result = await tx((curr) => applyPurchase(curr, item.id));
      if (result.ok) {
        try {
          await push(ref(db, "profiles/" + encodeURIComponent(myName) + "/transactions"),
            { type: "purchase", amount: -item.price, note: "خرید " + item.name, at: Date.now() });
        } catch (e) { console.warn("transaction log failed:", e); }
      }
      return result;
    }

    // ---------- اتصال و دریافت موجودی ----------

    let loaded = false;
    let unsubProfile = null;
    let connWatchStarted = false;
    let slowTimer = null;
    let fallbackTimer = null;
    const retryBtn = document.createElement("button");
    retryBtn.type = "button";
    retryBtn.className = "shop-chip";
    retryBtn.textContent = "🔄 تلاش دوباره";
    retryBtn.style.display = "none";
    statusEl.after(retryBtn);
    retryBtn.style.margin = "0 auto 12px";

    const cacheKey = () => "domito_shop_coins_" + myName;

    function readCachedCoins() {
      try {
        const v = localStorage.getItem(cacheKey());
        return v === null ? null : Number(v);
      } catch (e) { return null; }
    }

    function writeCachedCoins(v) {
      try { localStorage.setItem(cacheKey(), String(Number(v) || 0)); } catch (e) {}
    }

    function errorText(error) {
      const code = String((error && (error.code || error.message)) || "");
      if (/permission/i.test(code)) return "دسترسی به اطلاعات حساب داده نشد (permission denied). از دومیتو خارج و دوباره وارد شو.";
      if (/network|unavailable|offline|disconnect/i.test(code)) return "اتصال به سرور برقرار نیست. اینترنت یا VPN رو چک کن.";
      return "دریافت اطلاعات حساب انجام نشد. اینترنت رو چک کن و دوباره امتحان کن.";
    }

    function applyProfile(value) {
      loaded = true;
      clearTimeout(slowTimer);
      clearTimeout(fallbackTimer);
      retryBtn.style.display = "none";
      currentProfile = value || {};
      coinsEl.textContent = faNumber(currentProfile.coins || 0);
      writeCachedCoins(currentProfile.coins || 0);
      if (statusEl.dataset.conn === "1") { statusEl.dataset.conn = ""; setStatus(""); }
      try {
        shop = readShop(currentProfile);
        if (cos) { try { cos.setCosmeticsCache(myName, shop.equipped); } catch (e) {} }
        renderMe();
        renderShop();
      } catch (error) {
        console.error("Shop render failed:", error);
        setStatus("نمایش فروشگاه با خطا مواجه شد. صفحه را دوباره باز کن.", true);
      }
    }

    function showConnProblem(text) {
      if (loaded) return;
      statusEl.dataset.conn = "1";
      setStatus(text, true);
      retryBtn.style.display = "block";
      if (grid.children.length <= 1) showMessage("هنوز به سرور وصل نشدیم…");
    }

    function subscribeProfile() {
      try { if (unsubProfile) unsubProfile(); } catch (e) {}
      loaded = false;
      retryBtn.style.display = "none";
      statusEl.dataset.conn = "1";
      setStatus("در حال اتصال به سرور…");

      unsubProfile = onValue(profileRef(myName), (snapshot) => {
        applyProfile(snapshot.val());
      }, (error) => {
        console.error("Profile listener failed:", error);
        showConnProblem(errorText(error));
      });

      // اگر بعد از چند ثانیه جواب نیامد: وضعیت اتصال را نشان بده و یک بار مستقیم بخوان.
      clearTimeout(slowTimer);
      clearTimeout(fallbackTimer);
      slowTimer = setTimeout(() => {
        if (!loaded) showConnProblem("اتصال کند است یا برقرار نیست؛ در حال تلاش دوباره…");
      }, 6000);
      fallbackTimer = setTimeout(async () => {
        if (loaded) return;
        try {
          const snap = await get(profileRef(myName));
          if (!loaded) applyProfile(snap.val());
        } catch (error) {
          console.error("Profile fallback read failed:", error);
          showConnProblem(errorText(error));
        }
      }, 9000);
    }

    retryBtn.addEventListener("click", () => {
      clearConfirm();
      subscribeProfile();
    });

    function watchConnection() {
      if (connWatchStarted) return;
      connWatchStarted = true;
      try {
        onValue(ref(db, ".info/connected"), (snap) => {
          if (snap.val() === true) {
            // دوباره وصل شد: اگر قبلاً چیزی نیامده بود، دوباره بخوان
            if (!loaded) subscribeProfile();
          } else if (loaded) {
            setStatus("اتصال قطع شد؛ موجودی ممکنه قدیمی باشه.", true);
            statusEl.dataset.conn = "1";
          }
        });
      } catch (e) { /* اختیاری */ }
    }

    function waitForUser() {
      return new Promise((resolve) => {
        const t = setTimeout(() => resolve(undefined), 10000);
        const un = onAuthStateChanged(auth, (u) => { clearTimeout(t); try { un(); } catch (e) {} resolve(u); });
      });
    }

    async function startShop() {
      window.__shopStarted = true;
      setStatus("نسخه " + window.__shopV + " — در حال ورود به حساب…");
      try {
        const user = await waitForUser();
        if (user === undefined) {
          showMessage("ورود به حساب جواب نداد.");
          setStatus("ورود (Auth) جواب نداد؛ اینترنت/VPN را چک کن و «تلاش دوباره» را بزن.", true);
          retryBtn.style.display = "block";
          retryBtn.onclick = () => location.reload();
          return;
        }
        myName = getSavedName();
        if (user && !myName) {
          try {
            const v = (await get(ref(db, "uidToName/" + user.uid))).val();
            if (v) { myName = String(v).trim(); localStorage.setItem("domito_name", myName); }
          } catch (e) { console.warn("uidToName failed:", e); }
        }

        if (!user || !myName) {
          showMessage("برای استفاده از فروشگاه، ابتدا وارد دومیتو شو.");
          countEl.textContent = "نیازمند ورود";
          setStatus("از صفحه اصلی وارد حساب خودت شو.", true);
          return;
        }

        const cached = readCachedCoins();
        if (cached !== null) coinsEl.textContent = faNumber(cached);

        subscribeProfile();
        watchConnection();
      } catch (error) {
        console.error("Shop initialization failed:", error);
        showMessage("بارگذاری فروشگاه ناموفق بود.");
        setStatus("خطا: " + ((error && (error.code || error.message)) || error), true);
        retryBtn.style.display = "block";
      }
    }

    renderTabs();
    startShop();
  </script>
<script type="module" src="./js/notifications.js"></script>
</body>
</html>
