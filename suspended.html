<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D1A">
<title>حساب تعلیق شده — دومیتو</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
  :root{
    --bg:#0A0D1A; --panel:#131629; --panel-2:#1B1F3A; --text:#EAF0FF;
    --dim:#8B93B8; --danger:#FF6B6B; --accent:#4F7CFF; --gold:#FFC845;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(900px 500px at 50% -10%, rgba(255,107,107,.18), transparent 60%), var(--bg);
    color:var(--text); font-family:'Vazirmatn',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
    min-height:100vh; min-height:100dvh;
  }
  .card{
    width:100%; max-width:440px; text-align:center;
    background:linear-gradient(160deg, rgba(27,31,58,.92), rgba(16,19,36,.92));
    border:1px solid rgba(255,107,107,.35); border-radius:22px; padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .icon{font-size:54px; line-height:1; margin-bottom:10px}
  h1{margin:0 0 6px; font-size:24px; font-weight:800; color:var(--danger)}
  p{margin:8px 0; color:var(--dim); font-size:14px; line-height:1.9}
  .name{color:var(--text); font-weight:600}
  .box{
    margin:16px 0 6px; background:var(--panel); border:1px solid rgba(255,255,255,.07);
    border-radius:16px; padding:14px 12px;
  }
  .label{font-size:12px; color:var(--dim); margin-bottom:4px}
  .value{font-size:15px; font-weight:600}
  .count{font-size:19px; font-weight:800; color:var(--gold); margin-top:2px}
  .row{display:flex; gap:10px; margin-top:18px}
  button{
    flex:1; font:inherit; font-weight:600; font-size:14px; cursor:pointer;
    padding:12px 10px; border-radius:14px; border:1px solid rgba(255,255,255,.12);
    background:var(--panel-2); color:var(--text);
  }
  button.primary{background:linear-gradient(145deg,#4F7CFF,#9B5CFF); border:0}
  button:disabled{opacity:.55; cursor:wait}
  .note{min-height:22px; margin-top:12px; font-size:13px; color:var(--dim)}
  .note.err{color:var(--danger)}
  .note.ok{color:#3ECF8E}
</style>
</head>
<body>
<main class="card">
  <div class="icon">⛔</div>
  <h1>تعلیق شدی</h1>
  <p>حساب <span class="name" id="who">—</span> موقتاً تعلیق شده و فعلاً نمی‌تونی وارد دومیتو بشی.</p>

  <div class="box">
    <div class="label">تاریخ رفع تعلیق</div>
    <div class="value" id="until">—</div>
    <div class="label" style="margin-top:10px">زمان باقی‌مانده</div>
    <div class="count" id="left">—</div>
  </div>

  <p style="font-size:12px">این وضعیت روی دستگاهت ذخیره شده؛ با خاموش کردن VPN یا قطع اینترنت هم همین‌جا می‌مونه.</p>

  <div class="row">
    <button class="primary" id="recheck">بررسی دوباره</button>
    <button id="logout">خروج از حساب</button>
  </div>
  <div class="note" id="note"></div>
</main>

<script type="module">
import {
  readActiveSuspension,
  formatUntil,
  formatRemaining
} from "./js/suspension.js";

const $ = (id) => document.getElementById(id);
const note = (t, cls = "") => { $("note").textContent = t; $("note").className = "note " + cls; };

let state = readActiveSuspension();
if (!state) {
  // تعلیقی در کش نیست (یا تمام شده)؛ به صفحه‌ی اصلی برگرد. ورود دوباره Firebase را چک می‌کند.
  location.replace("./index.html");
}

function paint() {
  state = readActiveSuspension();
  if (!state) { location.replace("./index.html"); return; }
  $("who").textContent = "«" + (state.name || "شما") + "»";
  $("until").textContent = formatUntil(state.until);
  $("left").textContent = formatRemaining(state.until - Date.now());
}
paint();
setInterval(paint, 1000);

let busy = false;
$("recheck").addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  $("recheck").disabled = true;
  note("در حال بررسی از Firebase...");
  try {
    const App = await import("./js/app.js");
    await App.waitForUser();
    const name = App.getSavedName() || (state && state.name) || "";
    const status = await App.checkSuspension(name);
    if (status === "ok") {
      note("تعلیقت برداشته شده ✅", "ok");
      setTimeout(() => location.replace("./index.html"), 700);
    } else if (status === "blocked") {
      paint();
      note("هنوز تعلیق هستی. تاریخ بالا به‌روز شد.", "err");
    } else {
      note("به Firebase وصل نشد. VPN رو روشن کن و دوباره امتحان کن.", "err");
    }
  } catch (e) {
    note("بررسی انجام نشد. VPN رو روشن کن و دوباره امتحان کن.", "err");
  }
  busy = false;
  $("recheck").disabled = false;
});

$("logout").addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  try {
    const App = await import("./js/app.js");
    await Promise.race([App.logoutUser(), new Promise(r => setTimeout(r, 4000))]);
  } catch (e) { /* خروج محلی هم کافی است */ }
  try { localStorage.removeItem("domito_name"); } catch (e) {}
  location.replace("./index.html");
});
</script>
</body>
</html>
