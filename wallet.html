<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کیف‌پول | دومیتو</title>
<link rel="stylesheet" href="css/style.css">

<style>
  .wallet-hero {
    text-align: center;
  }

  .available-box {
    margin-top: 8px;
    font-size: 12px;
  }

  /* =====================================================
     انتقال سکه — کارت یکپارچه و کوچک
     ===================================================== */

  .transfer-box {
    margin-top: 12px;
  }

  .transfer-box h2 {
    margin-bottom: 6px;
  }

  .transfer-info {
    font-size: 12px;
    margin-top: 5px;
  }

  .transfer-form {
    display: grid;
    grid-template-columns: 1fr 100px;
    gap: 7px;
    margin-top: 10px;
  }

  .transfer-form input {
    width: 100%;
    box-sizing: border-box;
    min-height: 40px;
    padding: 8px 10px;
  }

  .transfer-form button {
    grid-column: 1 / -1;
    min-height: 38px;
  }

  .transfer-message {
    margin-top: 7px;
    font-size: 12px;
    min-height: 17px;
  }

  .transfer-section-title {
    font-size: 13px;
    font-weight: bold;
    margin-top: 13px;
    margin-bottom: 3px;
    opacity: .9;
  }

  .transfer-list {
    max-height: 180px;
    overflow-y: auto;
  }

  .incoming-row,
  .outgoing-row {
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }

  .incoming-row:last-child,
  .outgoing-row:last-child {
    border-bottom: none;
  }

  .incoming-top,
  .outgoing-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }

  .incoming-amount {
    font-weight: bold;
    white-space: nowrap;
  }

  .incoming-time {
    margin-top: 3px;
    font-size: 10px;
    opacity: .55;
  }

  .incoming-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  .incoming-actions button {
    flex: 1;
    min-height: 32px;
    font-size: 11px;
  }

  .btn-danger {
    border: none;
    cursor: pointer;
  }

  .pending-box {
    margin-top: 8px;
    padding: 7px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    font-size: 12px;
  }

  .empty-transfer {
    opacity: .55;
    font-size: 11px;
    padding: 5px 0;
  }

  .outgoing-status {
    margin-top: 3px;
    font-size: 10px;
    opacity: .7;
  }

  .status-pending {
    color: #ffd166;
  }

  .status-accepted {
    color: #48e28a;
  }

  .status-refunded {
    color: #48e28a;
  }

  .transfer-divider {
    height: 1px;
    background: rgba(255,255,255,.06);
    margin: 10px 0;
  }

  .tx-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }

  .tx-row:last-child {
    border-bottom: none;
  }

  .plus {
    color: #48e28a;
    font-weight: bold;
    direction: ltr;
  }

  .minus {
    color: #ff6678;
    font-weight: bold;
    direction: ltr;
  }

  .muted-small {
    font-size: 11px;
    opacity: .6;
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="brand-mark">🪙</div>
    <h1>کیف‌پول</h1>
  </div>


  <div class="card" id="noNameCard" style="display:none">
    <p class="status-line">
      هنوز وارد نشدی.
    </p>

    <a href="index.html" class="btn btn-full">
      ورود
    </a>
  </div>


  <div id="walletContent" style="display:none">

    <!-- موجودی -->

    <div class="wallet-hero">

      <div class="muted">
        موجودی فعلی
      </div>

      <div class="amt">
        🪙
        <span id="balanceNum">0</span>
      </div>

      <div
        class="available-box muted"
        id="availableBox"
      >
        قابل استفاده: 0 🪙
      </div>

      <div
        class="pending-box"
        id="pendingBox"
      >
        در انتظار انتقال: 0 🪙
      </div>

    </div>


    <!-- ==================================================
         همه انتقال‌ها در یک کارت
         ================================================== -->

    <div class="card transfer-box">

      <h2>💸 انتقال سکه</h2>

      <div class="muted-small">
        ارسال سکه به کاربران دومیتو
      </div>


      <!-- فرم -->

      <div class="transfer-form">

        <input
          id="receiverInput"
          type="text"
          placeholder="نام کاربری"
          autocomplete="off"
        >

        <input
          id="amountInput"
          type="number"
          min="1"
          step="1"
          placeholder="سکه"
          inputmode="numeric"
        >

        <button
          id="sendBtn"
          class="btn btn-full"
        >
          💸 ارسال
        </button>

      </div>


      <div
        id="transferMessage"
        class="transfer-message"
      ></div>


      <!-- درخواست‌های دریافتی -->

      <div class="transfer-section-title">
        📥 درخواست‌های دریافتی
      </div>

      <div
        id="incomingList"
        class="transfer-list"
      >
        <p class="empty-transfer">
          درخواست جدیدی نداری.
        </p>
      </div>


      <div class="transfer-divider"></div>


      <!-- انتقال‌های من -->

      <div class="transfer-section-title">
        📤 انتقال‌های من
      </div>

      <div
        id="outgoingList"
        class="transfer-list"
      >
        <p class="empty-transfer">
          انتقالی وجود ندارد.
        </p>
      </div>

    </div>


    <!-- ماموریت‌ها -->

    <div class="card">

      <h2>
        🎯 ماموریت‌های امروز
      </h2>

      <div id="missionList"></div>

    </div>


    <!-- تاریخچه -->

    <div class="card">

      <h2>
        📜 تاریخچه تراکنش
      </h2>

      <div id="txList"></div>

      <p
        class="muted"
        id="txEmpty"
        style="display:none;"
      >
        هنوز تراکنشی ثبت نشده
      </p>

    </div>

  </div>


  <a
    href="profile.html"
    class="link-back"
  >
    ← بازگشت به پروفایل
  </a>

</div>


<script type="module">

import {

  getSavedName,
  profileRef,
  onValue,
  getTransactions,
  MISSIONS,
  claimMission,
  waitForUser,
  sendCoins,
  listenIncomingTransfers,
  acceptTransfer,
  rejectTransfer,
  processOutgoingTransfers,
  listenOutgoingTransfers

} from "./js/app.js";


waitForUser().then(async user => {

  const name = getSavedName();

  if (!user || !name) {

    document.getElementById("noNameCard").style.display = "block";

    return;

  }


  document.getElementById("walletContent").style.display = "block";


  const balanceNum =
    document.getElementById("balanceNum");

  const availableBox =
    document.getElementById("availableBox");

  const pendingBox =
    document.getElementById("pendingBox");

  const receiverInput =
    document.getElementById("receiverInput");

  const amountInput =
    document.getElementById("amountInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const transferMessage =
    document.getElementById("transferMessage");

  const incomingList =
    document.getElementById("incomingList");

  const outgoingList =
    document.getElementById("outgoingList");


  try {
    await processOutgoingTransfers(name);
  } catch (e) {
    console.warn("OUTGOING PROCESS ERROR:", e);
  }


  onValue(
    profileRef(name),
    snap => {

      const p = snap.val() || {
        coins: 0,
        gamesPlayed: 0,
        wins: 0,
        claimedMissions: []
      };


      const coins = Number(p.coins || 0);

      let pending = 0;

      const outgoing =
        p.outgoingTransfers || {};


      Object.values(outgoing).forEach(transfer => {

        if (
          transfer &&
          transfer.status === "pending"
        ) {

          const amount =
            Number(transfer.amount);

          if (
            Number.isInteger(amount) &&
            amount > 0
          ) {
            pending += amount;
          }

        }

      });


      balanceNum.textContent = coins;

      availableBox.textContent =
        `قابل استفاده: ${Math.max(0, coins)} 🪙`;

      pendingBox.textContent =
        `در انتظار انتقال: ${pending} 🪙`;


      renderMissions(p);

      refreshTx();

    }
  );


  sendBtn.addEventListener(
    "click",
    async () => {

      const receiver =
        receiverInput.value.trim();

      const amount =
        Number(amountInput.value);

      transferMessage.textContent = "";


      if (!receiver) {
        showMessage(
          "❌ نام کاربری گیرنده را وارد کن.",
          true
        );
        return;
      }


      if (
        !Number.isInteger(amount) ||
        amount <= 0
      ) {
        showMessage(
          "❌ مقدار سکه معتبر نیست.",
          true
        );
        return;
      }


      if (
        receiver.toLowerCase() ===
        name.toLowerCase()
      ) {
        showMessage(
          "❌ نمی‌توانی به خودت سکه انتقال بدهی.",
          true
        );
        return;
      }


      sendBtn.disabled = true;
      sendBtn.textContent = "⏳ ارسال...";


      try {

        const result =
          await sendCoins(
            name,
            receiver,
            amount
          );


        if (!result.ok) {

          const messages = {

            "invalid-name":
              "❌ نام کاربری معتبر نیست.",

            "self-transfer":
              "❌ نمی‌توانی به خودت سکه بفرستی.",

            "invalid-amount":
              "❌ مقدار سکه معتبر نیست.",

            "receiver-not-found":
              "❌ چنین کاربری پیدا نشد.",

            "sender-not-found":
              "❌ پروفایل شما پیدا نشد.",

            "insufficient":
              "❌ موجودی کافی نیست.",

            "transfer-create-failed":
              "❌ ساخت درخواست انتقال ناموفق بود.",

            "transfer-id-failed":
              "❌ ساخت شناسه انتقال ناموفق بود."

          };


          showMessage(
            messages[result.reason] ||
            "❌ انتقال انجام نشد.",
            true
          );

          return;

        }


        receiverInput.value = "";
        amountInput.value = "";


        showMessage(
          `✅ درخواست انتقال ${amount} سکه برای ${receiver} ارسال شد.`
        );


        await processOutgoingTransfers(name);
        await refreshTx();


      } catch (e) {

        console.error("SEND COINS ERROR:", e);

        showMessage(
          "❌ خطایی هنگام انتقال رخ داد.",
          true
        );

      } finally {

        sendBtn.disabled = false;
        sendBtn.textContent = "💸 ارسال";

      }

    }
  );


  listenIncomingTransfers(
    name,
    list => {
      renderIncoming(list);
    }
  );


  listenOutgoingTransfers(
    name,
    async list => {

      renderOutgoing(list);

      try {
        await processOutgoingTransfers(name);
      } catch (e) {
        console.warn(
          "OUTGOING WATCH ERROR:",
          e
        );
      }

    }
  );


  function renderIncoming(list) {

    if (!list || list.length === 0) {

      incomingList.innerHTML = `
        <p class="empty-transfer">
          درخواست جدیدی نداری.
        </p>
      `;

      return;
    }


    incomingList.innerHTML =
      list.map(transfer => {

        const from =
          escapeHtml(
            transfer.from || "کاربر"
          );

        const amount =
          Number(transfer.amount || 0);

        const time =
          formatTime(transfer.at);

        const id =
          escapeHtml(transfer.id);


        return `

          <div
            class="incoming-row"
            data-id="${id}"
          >

            <div class="incoming-top">

              <span>
                💰
                <strong>${from}</strong>
                →
                <strong>${amount}</strong>
                سکه
              </span>

              <span class="incoming-amount">
                🪙 ${amount}
              </span>

            </div>

            <div class="incoming-time">
              ${time}
            </div>

            <div class="incoming-actions">

              <button
                class="btn btn-gold accept-transfer"
                data-id="${id}"
              >
                ✅ قبول
              </button>

              <button
                class="btn btn-danger reject-transfer"
                data-id="${id}"
              >
                ❌ رد
              </button>

            </div>

          </div>

        `;

      }).join("");


    incomingList
      .querySelectorAll(".accept-transfer")
      .forEach(btn => {

        btn.addEventListener(
          "click",
          async () => {

            const id = btn.dataset.id;

            btn.disabled = true;

            try {

              const result =
                await acceptTransfer(
                  name,
                  id
                );


              if (!result.ok) {

                alert(
                  getTransferError(
                    result.reason
                  )
                );

                btn.disabled = false;
                return;

              }

              await refreshTx();

            } catch (e) {

              console.error(
                "ACCEPT ERROR:",
                e
              );

              alert(
                "❌ قبول انتقال ناموفق بود."
              );

              btn.disabled = false;

            }

          }
        );

      });


    incomingList
      .querySelectorAll(".reject-transfer")
      .forEach(btn => {

        btn.addEventListener(
          "click",
          async () => {

            const id = btn.dataset.id;

            btn.disabled = true;

            try {

              const result =
                await rejectTransfer(
                  name,
                  id
                );


              if (!result.ok) {

                alert(
                  getTransferError(
                    result.reason
                  )
                );

                btn.disabled = false;
              }

            } catch (e) {

              console.error(
                "REJECT ERROR:",
                e
              );

              alert(
                "❌ رد انتقال ناموفق بود."
              );

              btn.disabled = false;

            }

          }
        );

      });

  }


  function renderOutgoing(list) {

    if (!list || list.length === 0) {

      outgoingList.innerHTML = `
        <p class="empty-transfer">
          انتقالی وجود ندارد.
        </p>
      `;

      return;
    }


    outgoingList.innerHTML =
      list.map(transfer => {

        const to =
          escapeHtml(
            transfer.to || "کاربر"
          );

        const amount =
          Number(
            transfer.amount || 0
          );


        let statusText =
          "⏳ در انتظار قبول";

        let statusClass =
          "status-pending";


        if (
          transfer.status ===
          "accepted"
        ) {

          statusText =
            "✅ انتقال انجام شد";

          statusClass =
            "status-accepted";

        }


        if (
          transfer.status ===
          "refunded"
        ) {

          statusText =
            "↩️ سکه‌ها برگشت خورد";

          statusClass =
            "status-refunded";

        }


        return `

          <div class="outgoing-row">

            <div class="outgoing-top">

              <span>
                به
                <strong>${to}</strong>
              </span>

              <span>
                🪙 ${amount}
              </span>

            </div>

            <div
              class="outgoing-status ${statusClass}"
            >
              ${statusText}
            </div>

          </div>

        `;

      }).join("");

  }


  function renderMissions(p) {

    const claimed =
      p.claimedMissions || [];

    const list =
      document.getElementById(
        "missionList"
      );

    list.innerHTML = "";


    MISSIONS.forEach(m => {

      const progressVal =
        Number(p[m.statKey] || 0);

      const pct =
        Math.min(
          100,
          Math.round(
            (progressVal / m.target) * 100
          )
        );

      const done =
        progressVal >= m.target;

      const isClaimed =
        claimed.includes(m.id);


      const row =
        document.createElement("div");

      row.className =
        "mission-row";


      row.innerHTML = `

        <div class="top">

          <span class="txt">
            ${escapeHtml(m.label)}
          </span>

          <span class="reward">
            🪙 +${m.reward}
          </span>

        </div>

        <div class="progress-bar">

          <div
            class="progress-fill"
            style="width:${pct}%"
          ></div>

        </div>

      `;


      const btn =
        document.createElement(
          "button"
        );


      if (isClaimed) {

        btn.textContent =
          "دریافت شد";

        btn.disabled =
          true;

        btn.className =
          "btn-ghost";

      }

      else if (done) {

        btn.textContent =
          "دریافت پاداش";

        btn.className =
          "btn-gold";


        btn.addEventListener(
          "click",
          async () => {

            btn.disabled = true;

            try {

              const result =
                await claimMission(
                  name,
                  m.id
                );


              if (!result.ok) {

                alert(
                  "❌ دریافت پاداش انجام نشد."
                );

                btn.disabled = false;

              }

            } catch (e) {

              console.error(
                "MISSION ERROR:",
                e
              );

              btn.disabled = false;

            }

          }
        );

      }

      else {

        btn.textContent =
          `${progressVal} از ${m.target}`;

        btn.disabled =
          true;

        btn.className =
          "btn-ghost";

      }


      row.appendChild(btn);

      list.appendChild(row);

    });

  }


  async function refreshTx() {

    try {

      const txs =
        await getTransactions(
          name,
          30
        );


      const txList =
        document.getElementById(
          "txList"
        );

      const txEmpty =
        document.getElementById(
          "txEmpty"
        );


      if (txs.length === 0) {

        txEmpty.style.display =
          "block";

        txList.innerHTML =
          "";

        return;

      }


      txEmpty.style.display =
        "none";


      txList.innerHTML =
        txs.map(t => {

          const amount =
            Number(t.amount || 0);


          return `

            <div class="tx-row">

              <span>
                ${escapeHtml(
                  t.note || "تراکنش"
                )}
              </span>

              <span
                class="${
                  amount >= 0
                    ? "plus"
                    : "minus"
                }"
              >
                ${
                  amount >= 0
                    ? "+"
                    : ""
                }${amount}

              </span>

            </div>

          `;

        }).join("");


    } catch (e) {

      console.error(
        "TRANSACTION LOAD ERROR:",
        e
      );

    }

  }


  function showMessage(
    text,
    error = false
  ) {

    transferMessage.textContent =
      text;

    transferMessage.style.color =
      error
        ? "#ff6678"
        : "#48e28a";

  }


  function getTransferError(reason) {

    const messages = {

      "invalid":
        "❌ درخواست نامعتبر است.",

      "not-found":
        "❌ این درخواست دیگر وجود ندارد.",

      "already-processed":
        "⚠️ این درخواست قبلاً پردازش شده است.",

      "invalid-amount":
        "❌ مقدار انتقال نامعتبر است.",

      "credit-failed":
        "❌ اضافه کردن سکه ناموفق بود.",

      "status-update-failed":
        "❌ تغییر وضعیت انتقال ناموفق بود."

    };


    return (
      messages[reason] ||
      "❌ عملیات انتقال انجام نشد."
    );

  }


  function formatTime(timestamp) {

    if (!timestamp) {
      return "زمان نامشخص";
    }


    try {

      return new Intl.DateTimeFormat(
        "fa-IR",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(
        new Date(timestamp)
      );

    } catch {

      return "";

    }

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

});

</script>

</body>
</html>
